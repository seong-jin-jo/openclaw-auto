<body>
<div id="app"></div>
<script>
const NAV=[["Overview",[["성과","/"],["OSMU Studio","/studio"],["승인 인박스","/inbox"],["발행 캘린더","/calendar"]]],["Social",[["Threads","/channels/threads"],["X (Twitter)","/channels/x"],["Instagram","/channels/instagram"],["Facebook","/channels/facebook"],["Bluesky","/channels/bluesky"]]],["Messaging",[["Telegram","/channels/telegram"],["Discord","/channels/discord"],["Slack","/channels/slack"]]],["Video",[["YouTube","/channels/youtube"],["TikTok","/channels/tiktok"]]],["Data & Analytics",[["Blog Performance","/blog-performance"],["Search Console","/search-console"],["Google Analytics","/google-analytics"]]],["Keyword Research",[["Keyword Planner","/keyword-planner"],["Search Advisor","/search-advisor"],["Naver Trends","/naver-trends"],["Google Trends","/google-trends"]]],["Custom Integration",[["Blog","/blog"]]],["Assets & Tools",[["Images","/images"],["Videos","/videos"],["Midjourney","/channels/midjourney"]]],["System",[["Settings","/settings"]]]];
const VISUAL=[{id:"threads",name:"Threads",group:"✍️ 텍스트",kind:"threads",draft:"자동화는 시작보다 복구 지점을 먼저 정해야 합니다.\n\n작게 시작하고, 결과를 확인하고, 언제든 되돌릴 수 있게 만드세요."},{id:"x",name:"X",group:"✍️ 텍스트",kind:"x",draft:"자동화의 시작점은 실행 버튼이 아니다. 실패했을 때 어디로 돌아올지 정하는 것이 먼저다."},{id:"facebook",name:"Facebook",group:"✍️ 텍스트",kind:"facebook",draft:"반복 업무를 자동화하기 전에 팀이 먼저 합의해야 할 것은 복구 지점입니다. 실패를 숨기지 않고 되돌릴 수 있는 구조가 있어야 합니다."},{id:"shorts",name:"Shorts",group:"🎬 영상 9:16",kind:"video",draft:"자동화 전에 먼저 정할 것\n실패했을 때 돌아올 자리"},{id:"reels",name:"Reels",group:"🎬 영상 9:16",kind:"video",draft:"",generation:"failed"},{id:"tiktok",name:"TikTok",group:"🎬 영상 9:16",kind:"video",draft:"",generation:"empty"},{id:"instagram",name:"Instagram",group:"🖼️ 카드뉴스",kind:"instagram",draft:"자동화 전에 먼저 정할 것: 실패했을 때 돌아올 자리.\n\n#팀운영 #업무자동화"}];
const DIRECT=new Set(["threads","x","facebook","instagram"]);const SCHEDULE8=["threads","x","facebook","instagram","bluesky","telegram","discord","slack"];
const state={screen:"/studio",idea:"반복 업무 자동화 전에 실패했을 때 돌아올 지점을 정하는 체크리스트",generated:false,generating:false,cards:{},includes:{threads:true,x:true,facebook:true,instagram:true},editing:null,drawerConflict:false,showWiki:false,wikiMode:"wiki",wikiRepo:"https://github.com/openclaw-lab/brand-wiki",wikiPath:"wiki/",wikiMsg:"",wikiTone:"",wikiSynced:false,autoState:"idle",assetImage:false,assetVideo:false,notice:"",progress:null,showSchedule:false,schedules:[],scheduleTime:"2026-08-06T10:00",scheduleError:"",showHelp:false,historyError:"",toast:"",loading:null,settingsTab:"channels",providerTab:"queue"};
function initCards(){state.cards={};for(const v of VISUAL)state.cards[v.id]={...v,saved:false,publish:"idle",link:"",generation:v.generation||"ready",updated:""}}
function esc(s){return String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}function snap(c){return[c.id,c.draft,c.saved,c.publish,c.generation,c.updated].join("|")}function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16)}
function sidebar(){return `<aside class="sidebar"><div class="brand"><div class="brandline"><span class="mark"></span>Marketing Hub</div><div class="workspace">OpenClaw 워크스페이스</div></div><nav class="nav">${NAV.map(([g,items])=>`<div class="navgroup"><div class="navtitle">${g}</div>${items.map(([l,p])=>`<button class="navitem ${state.screen===p?"active":""}" data-nav="${p}"><span class="dot"></span>${l}${l==="OSMU Studio"?'<span class="new">NEW</span>':""}</button>`).join("")}</div>`).join("")}</nav></aside>`}
function studioBar(){const selected=Object.entries(state.includes).filter(([,v])=>v).length;return `<div class="studio-bar"><div class="studio-title"><b>OSMU Studio</b><p>직접 저작 · 생성→즉시 발행/예약</p></div><span class="engine">AI <b>Claude</b></span><input class="idea" data-idea value="${esc(state.idea)}" placeholder="글감 / 콘텐츠 주제 입력"><select class="select" data-video-model><option>Minimax 6cr</option><option>Veo3.1 8cr</option><option>Kling3 10cr</option></select><label class="check action"><input type="checkbox" data-with-video checked> 영상</label><button class="btn outline" data-brand>🎨 브랜드 ✓</button><button class="btn outline" data-wiki>📚 위키</button><button class="btn primary" data-generate>${state.generating?'<span class="spinner"></span>생성 중':"OSMU 생성"}</button><button class="btn outline" data-auto>${state.autoState==="loading"?'<span class="spinner"></span>저장 중':"✨ AI 자동초안"}</button>${state.generated?'<button class="btn" data-global-save>💾 Save</button>':""}${state.generated?`<button class="btn success" data-bulk-publish>🚀 Publish (${selected})</button>`:""}${state.generated?`<button class="btn outline" data-schedule-toggle>🗓️ 예약</button>`:""}<button class="btn" data-help>문제 해결</button></div>`}
function notices(){let html="";if(state.notice)html+=`<div class="notice ${state.notice.includes("실패")||state.notice.includes("못")?"error":"info"}"><span>${state.notice}</span><button class="btn tiny" data-clear-notice>닫기</button></div>`;if(state.progress)html+=`<div class="card progress"><div class="progress-ring">${state.progress.pct}%</div><div><b>${state.progress.title}</b><div class="sub">${state.progress.detail}</div></div>${state.loading?'<span class="spinner"></span>':""}</div>`;return html}
function schedulePanel(){if(!state.showSchedule)return"";return `<section class="card schedule"><div class="schedule-head"><b>🗓️ 예약 발행</b><span>미래 시각에 멀티채널 자동 발행</span></div><p>예약은 저장되고 자동화 파이프라인이 예약 시각에 발행합니다. Studio와 승인 인박스의 자동 연결은 아직 제공되지 않아요.</p>${state.scheduleError?`<div class="notice error">${state.scheduleError}<button class="btn tiny" data-schedule-error-clear>닫기</button></div>`:""}<div class="schedule-form"><div class="field"><label>예약 시각</label><input type="datetime-local" data-schedule-time value="${state.scheduleTime}"></div><div class="field" style="flex:1"><label>플랫폼</label><div class="platform-checks">${SCHEDULE8.map((p,i)=>`<label class="platform-check"><input type="checkbox" data-schedule-p="${p}" ${i<4?"checked":""}>${label(p)}</label>`).join("")}</div></div><button class="btn primary" data-schedule-create>예약</button></div><div class="schedule-list"><div class="sub">예약 목록 (${state.schedules.length})</div>${state.schedules.length?state.schedules.map(s=>`<div class="schedule-row" data-schedule-row="${s.id}"><div><b>${s.time}</b><div class="sub">${s.platforms.join(" · ")} · ${s.status}</div></div><div class="schedule-actions"><button class="btn tiny" data-schedule-change="${s.id}">변경</button><button class="btn tiny danger" data-schedule-cancel="${s.id}">취소</button></div></div>`).join(""):'<div class="sub" style="margin-top:8px">예약 없음</div>'}</div></section>`}
function label(id){return({threads:"Threads",x:"X",facebook:"Facebook",instagram:"Instagram",bluesky:"Bluesky",telegram:"Telegram",discord:"Discord",slack:"Slack"})[id]||id}

function publishActions(c){if(c.publish==="published")return `<button class="btn tiny" data-open-post="${c.id}">게시물 보기</button>`;if(c.publish==="failed")return `<button class="btn tiny danger" data-retry="${c.id}">다시 발행</button>`;if(c.publish==="repair")return `<button class="btn tiny" data-repair="${c.id}">결과 기록 복구</button>`;if(c.publish==="unknown")return `<button class="btn tiny" data-reconcile="${c.id}">결과 다시 확인</button>`;return `<button class="btn tiny primary" data-card-publish="${c.id}" ${!c.saved||!c.draft.trim()||state.loading?"disabled":""}>${c.publish==="processing"?'<span class="spinner"></span>처리 중':"Publish"}</button>`}
function additive(c){const status={idle:c.saved?"저장됨 · 발행 준비":"초안",processing:"이 카드만 발행 중",published:"발행됨",failed:"플랫폼 거절",repair:"결과 기록 복구 필요",unknown:"발행 여부 확인 중"}[c.publish]||c.publish;return `<div class="card-additive"><div class="card-status"><span class="status ${c.publish}">${status}</span><div class="card-actions"><button class="btn tiny" data-edit="${c.id}">편집</button>${publishActions(c)}</div></div>${c.publish==="published"?`<div class="permalink">${c.link}</div>`:""}${c.publish==="failed"?'<div class="safe-copy">거절이 확인된 이 카드만 다시 보냅니다.</div>':""}${c.publish==="repair"?'<div class="safe-copy">같은 게시물을 다시 보내지 않고 결과만 복구합니다.</div>':""}${c.publish==="unknown"?'<div class="safe-copy">결과 확인 전에는 다시 발행하지 않습니다.</div>':""}</div>`}
function platform(c){return `<article class="platform-wrap" data-card="${c.id}" data-card-snapshot="${hash(snap(c))}"><div class="preview-label"><span class="platform-logo">${c.name.slice(0,2)}</span><b>${c.name}</b>${c.id==="x"?`<span class="count">${c.draft.length}/280</span>`:""}${legacyPick(c)}</div><div class="platform-frame" data-edit="${c.id}">${preview(c)}</div>${additive(c)}</article>`}
function groups(){const gs=["✍️ 텍스트","🎬 영상 9:16","🖼️ 카드뉴스"];return gs.map(g=>{const cards=VISUAL.filter(v=>v.group===g).map(v=>state.cards[v.id]);return `<section class="group"><div class="group-head"><b>${g}</b><span>${cards.map(c=>c.name).join(" · ")} · 클릭해서 편집</span><div class="line"></div></div><div class="rail">${cards.map(platform).join("")}</div></section>`}).join("")}
function history(){return `<aside class="card history"><h3>📜 발행 이력</h3><p>클릭→수정 후 재발행</p>${state.historyError?`<div class="history-alert">이 기록의 상태를 확인하지 못했어요. 발행됨으로 추정하지 않습니다.</div>`:""}<div class="history-row"><div class="title">자동화 복구 체크리스트</div><div class="meta">8월 5일 06:20 · 📝</div><button class="btn tiny" data-history-load="1">불러오기</button></div><div class="history-row"><div class="title">브랜드 운영 원칙</div><div class="meta">8월 4일 14:10 · ⚠️ 복구 필요</div><button class="btn tiny" data-history-load="2">불러오기</button></div></aside>`}
function editor(){if(!state.editing)return"";const c=state.cards[state.editing];return `<div class="drawer-back" data-drawer-close></div><aside class="drawer"><div class="drawer-head"><h2>${c.name} 편집</h2><button class="btn" data-drawer-close>닫기</button></div>${state.drawerConflict?'<div class="conflict">다른 창에서 이 초안이 변경됐어요. 현재 내용과 저장된 내용을 비교한 뒤 선택하세요.<div style="margin-top:8px"><button class="btn tiny" data-conflict-resolve>내 변경 유지</button></div></div>':""}<textarea data-edit-draft="${c.id}">${esc(c.draft)}</textarea><div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" data-card-save="${c.id}">이 platform만 Save</button><button class="btn" data-image>이미지 ${state.assetImage?"재생성":"생성"}</button><button class="btn" data-video>영상 ${state.assetVideo?"재생성":"생성"}</button></div><div class="drawer-preview"><b>미리보기</b><p class="post">${esc(c.draft)||"내용을 입력하세요"}</p></div></aside>`}
function studio(){return `${studioBar()}${notices()}${schedulePanel()}<div class="layout"><div class="previews">${!state.generated?'<div class="sub" style="padding:48px;text-align:center">글감을 입력하고 OSMU 생성을 누르거나, 오른쪽 발행 이력에서 불러오세요.</div>':groups()}</div>${history()}</div>${editor()}${state.showWiki?wikiModal():""}${state.showHelp?helpModal():""}`}
function wikiModal(){return `<div class="overlay"><section class="modal"><div class="modal-head"><h2>📚 레포 위키 연동</h2><button class="btn" data-wiki-close>닫기</button></div><p>폴더 전체는 생성 시 사실 참조, 특정 파일은 브랜드 톤에 사용합니다.</p><div class="tabs"><button class="tab ${state.wikiMode==="wiki"?"active":""}" data-wiki-mode="wiki">📚 폴더 전체</button><button class="tab ${state.wikiMode==="files"?"active":""}" data-wiki-mode="files">📄 특정 파일</button></div><div class="field"><label>GitHub 레포 주소</label><input data-wiki-repo value="${esc(state.wikiRepo)}"></div><div class="field"><label>${state.wikiMode==="wiki"?"위키 폴더":"파일 경로"}</label><input data-wiki-path value="${esc(state.wikiPath)}"></div>${state.wikiMsg?`<div class="modal-msg ${state.wikiTone}">${state.wikiMsg}</div>`:""}<button class="btn primary" style="width:100%;margin-top:14px" data-wiki-sync>${state.wikiMode==="wiki"?"📚 위키 폴더 전체 동기화":"🔄 파일 가져와 톤 갱신"}</button></section></div>`}
function helpModal(){const rows=[["wiki","위키 불러오기","인증·빈 경로 오류"],["source","직접 source","빈 입력 검증"],["generate","OSMU 생성","5개 성공·1개 실패·1개 빈 초안"],["auto","AI 자동초안","응답 시간 초과"],["asset","이미지·영상","생성 실패와 권리 확인"],["save","플랫폼 Save","동시 수정 충돌"],["history","History","손상된 기록"],["bulk","즉시 Publish","일부 성공"],["schedule","Schedule","과거 시각 거절"]];return `<div class="overlay"><section class="modal"><div class="modal-head"><h2>문제 해결</h2><button class="btn" data-help-close>닫기</button></div><p>원본을 잃지 않고 각 문제 상태에서 다시 이어갈 수 있습니다.</p><div class="help-list">${rows.map(([id,t,s])=>`<div class="help-item"><div><b>${t}</b><small>${s}</small></div><button class="btn tiny" data-failure="${id}">화면에서 보기</button></div>`).join("")}</div><h3 style="font-size:13px;margin:16px 0 8px">카드별 안전 복구</h3><div class="help-list"><div class="help-item"><div><b>플랫폼이 발행을 거절했어요</b><small>거절이 확인된 카드만 다시 발행</small></div><button class="btn tiny" data-publish-demo="failed">Threads에서 보기</button></div><div class="help-item"><div><b>게시물은 올라갔지만 결과 저장이 덜 됐어요</b><small>재발행 없이 결과 기록만 복구</small></div><button class="btn tiny" data-publish-demo="repair">X에서 보기</button></div><div class="help-item"><div><b>발행 여부를 확인 중이에요</b><small>다시 보내기 전에 결과부터 확인</small></div><button class="btn tiny" data-publish-demo="unknown">Facebook에서 보기</button></div></div></section></div>`}
function settings(){const tabs=["Channels","AI Engine","Storage","Design Tools","Notifications","Fork 연동","Keywords","System"];return `<section class="route"><h1>Settings</h1><p>서비스 설정 · 각 항목이 어디에서 사용되는지 확인하세요</p><div class="settings-tabs">${tabs.map(t=>`<button class="tab ${state.settingsTab===t.toLowerCase()?"active":""}" data-settings-tab="${t.toLowerCase()}">${t}</button>`).join("")}</div><div class="card settings-panel"><h2>${tabs.find(t=>t.toLowerCase()===state.settingsTab)||"Channels"}</h2><p>활성 워크스페이스의 설정입니다. Channels에서 Studio 발행 계정을 연결할 수 있습니다.</p><button class="btn primary" data-nav="/studio">OSMU Studio로 돌아가기</button></div></section>`}
function route(){if(state.screen==="/settings")return settings();if(state.screen.startsWith("/channels/")){const id=state.screen.split("/").pop(),messaging=["telegram","discord","slack"].includes(id),inst=id==="instagram",threads=id==="threads",tabs=messaging?[]:inst?["Queue","Editor","Settings"]:threads?["Queue","Analytics","Growth","Popular","Settings"]:["Queue","Analytics","Settings"];return `<section class="route"><h1>${label(id)}</h1><p>기존 채널 route와 tab 구조를 유지합니다.</p>${tabs.length?`<div class="provider-tabs">${tabs.map(t=>`<button class="tab ${state.providerTab===t.toLowerCase()?"active":""}" data-provider-tab="${t.toLowerCase()}">${t}</button>`).join("")}</div>`:'<div class="route-note">이 채널은 tab 없이 연결 정보와 사용 가이드를 제공합니다.</div>'}<div class="card settings-panel"><h2>${tabs.length?"채널 작업":"연결 설정"}</h2><p>OSMU Studio preview card 수와 backend 채널 기능은 같은 목록이 아닙니다.</p><button class="btn primary" data-nav="/studio">OSMU Studio로 돌아가기</button></div></section>`}const continuity=state.screen==="/inbox"||state.screen==="/calendar";return `<section class="route"><h1>${state.screen==="/inbox"?"승인 인박스":state.screen==="/calendar"?"발행 캘린더":"기존 Marketing Hub 화면"}</h1><p>기존 route와 shell을 유지합니다.</p>${continuity?'<div class="route-note">Studio 초안과 이 화면의 자동 연결은 아직 제공되지 않아요. 같은 원문으로 이어지는 기능은 후속 연결 작업입니다.</div>':""}<button class="btn primary" data-nav="/studio">OSMU Studio로 돌아가기</button></section>`}
function render(){document.getElementById("app").innerHTML=`<div class="shell">${sidebar()}<main class="main">${state.screen==="/studio"?studio():route()}</main></div>${state.toast?`<div class="toast">${state.toast}</div>`:""}`}
function toast(msg){state.toast=msg;render();setTimeout(()=>{if(state.toast===msg){state.toast="";render()}},1200)}function mutateOnly(id,fn){const others=VISUAL.filter(v=>v.id!==id).map(v=>v.id),before=Object.fromEntries(others.map(x=>[x,snap(state.cards[x])]));fn(state.cards[id]);const after=Object.fromEntries(others.map(x=>[x,snap(state.cards[x])]));window.OSMU.lastIsolation={target:id,other6Stable:others.every(x=>before[x]===after[x]),before,after}}
function finishCard(id,mode="success"){mutateOnly(id,c=>{if(mode==="failed")c.publish="failed";else if(mode==="repair")c.publish="repair";else if(mode==="unknown")c.publish="unknown";else{c.publish="published";c.updated="방금";c.link=`https://result.example/${id}/post/${hash(c.draft).slice(0,8)}`}});state.loading=null;render()}
document.addEventListener("input",e=>{if(e.target.matches("[data-idea]")){state.idea=e.target.value}if(e.target.matches("[data-edit-draft]")){state.cards[e.target.dataset.editDraft].draft=e.target.value}if(e.target.matches("[data-wiki-repo]"))state.wikiRepo=e.target.value;if(e.target.matches("[data-wiki-path]"))state.wikiPath=e.target.value;if(e.target.matches("[data-schedule-time]"))state.scheduleTime=e.target.value});
document.addEventListener("change",e=>{if(e.target.matches("[data-include]")){state.includes[e.target.dataset.include]=e.target.checked;render()}});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;
 if(b.dataset.nav){state.screen=b.dataset.nav;state.showHelp=false;state.showWiki=false;render();return}
 if(b.hasAttribute("data-generate")){if(!state.idea.trim()){state.notice="글감을 입력하세요. 직전 초안은 바뀌지 않았습니다.";render();return}state.generating=true;state.loading="generate";render();setTimeout(()=>{initCards();state.generated=true;state.generating=false;state.loading=null;state.notice="visual7 초안을 만들었습니다. Reels는 다시 생성할 수 있고 TikTok은 직접 입력할 수 있어요.";render()},550);return}
 if(b.hasAttribute("data-wiki")){state.showWiki=true;render();return}if(b.hasAttribute("data-wiki-close")){state.showWiki=false;render();return}if(b.dataset.wikiMode){state.wikiMode=b.dataset.wikiMode;render();return}if(b.hasAttribute("data-wiki-sync")){if(!state.wikiRepo.trim()||(state.wikiMode==="files"&&!state.wikiPath.trim())){state.wikiMsg="레포 주소와 경로를 확인하세요. 기존 source는 그대로입니다.";state.wikiTone="error"}else{state.wikiMsg="✓ 24개 문서를 인식했습니다. 생성 source로 사용할 수 있어요.";state.wikiTone="";state.wikiSynced=true}render();return}
 if(b.hasAttribute("data-auto")){state.autoState="loading";state.loading="auto";render();setTimeout(()=>{state.autoState="saved";state.loading=null;toast("AI 자동초안 1개를 발행 이력에 저장했어요")},500);return}
 if(b.hasAttribute("data-global-save")){Object.values(state.cards).forEach(c=>c.saved=true);toast("현재 visual7 초안을 저장했어요");return}
 if(b.hasAttribute("data-bulk-publish")){const ids=Object.keys(state.includes).filter(id=>state.includes[id]);state.loading="bulk";state.progress={pct:25,title:"기존 즉시 Publish",detail:`${ids.map(label).join(" · ")} 선택 발행 중`};for(const id of ids)state.cards[id].publish="processing";render();setTimeout(()=>{ids.forEach(id=>{state.cards[id].publish=id==="x"?"failed":"published";state.cards[id].link=id==="x"?"":`https://result.example/${id}/bulk/${hash(state.cards[id].draft).slice(0,8)}`});state.loading=null;state.progress={pct:75,title:"일부 발행됨",detail:"Threads · Facebook · Instagram 성공, X만 다시 확인하세요"};render()},650);return}
 if(b.dataset.edit){state.editing=b.dataset.edit;state.drawerConflict=false;render();return}if(b.hasAttribute("data-drawer-close")){state.editing=null;render();return}if(b.dataset.cardSave){const id=b.dataset.cardSave;mutateOnly(id,c=>{c.saved=true;c.updated="방금"});state.editing=null;toast(`${label(id)} 초안만 저장했어요`);return}if(b.hasAttribute("data-conflict-resolve")){state.drawerConflict=false;render();return}
 if(b.hasAttribute("data-image")){state.loading="image";render();setTimeout(()=>{state.assetImage=true;state.loading=null;toast("이미지를 현재 작업에 연결했어요")},450);return}if(b.hasAttribute("data-video")){state.loading="video";render();setTimeout(()=>{state.assetVideo=true;state.loading=null;toast("영상을 현재 작업에 연결했어요")},450);return}
 if(b.dataset.regenerate){const id=b.dataset.regenerate;mutateOnly(id,c=>{c.generation="ready";c.draft="실패했을 때 돌아올 지점을 먼저 정하면 자동화를 안심하고 시작할 수 있습니다.";c.saved=false});toast(`${label(id)}만 다시 생성했어요`);return}
