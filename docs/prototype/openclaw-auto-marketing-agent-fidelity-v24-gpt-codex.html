       규칙 1. 간격은 4 / 8 / 12 / 16 / 24 / 32 여섯 단계만 쓴다. 알약 인셋 2px만 예외다.

       규칙 3. 라벨은 잘리지 않는다. 잘림은 사용자가 만든 본문에만 허용한다.
       규칙 4. 부품 내부 여백과 부품 사이 여백을 분리한다. 부품이 자기 아래 여백을 갖지 않는다. */
    :root{

    .stack-section > * + *{margin-top:var(--stack-section)}

      var s=effStatus(p);

      if(s==='notConnected'&&p.status==='opening'&&OPENING_CAUSE[p.key]==='credential'){

          status:'정상',tone:'success',attention:false,connectedAt:'오늘',expiresAt:r.expiresAt||'',isDefault:true,
          how:CONNECT_METHOD[live.key]&&CONNECT_METHOD[live.key].kind==='oauth'?'공식 로그인':'값 직접 입력',
          next:'이 채널로 바로 게시할 수 있습니다.',readiness:'서버 자격증명 준비됨'};
      }
      return CONNECTED_ACCOUNTS.filter(function(a){return a.provider==='Threads';})[0]||CONNECTED_ACCOUNTS[0];
    }
    /* 강조는 하나만. 6개를 모두 경고색으로 칠하면 아무것도 강조되지 않는다(디자인 헌법 §3 편집자 원칙).
       그래서 정렬로 순서를 주고, 지금 할 첫 한 개에만 v20의 다음 단계 테두리를 재사용한다. */
    function channelPolicyRow(p,isFirstActionable){
      var opening=p.status==='opening';
      return '<div class="list-row channel-row" data-channel-row="'+p.key+'" data-status3="'+p.status+'" data-next-action="'+(isFirstActionable?'true':'false')+'">'+
        StatusThree(p,'sm')+'<div class="grow"><b>'+esc(p.label)+'</b><small>'+esc(p.why)+
        (p.fix?' 해결 방법: '+esc(p.fix):'')+'</small></div>'+
        /* 오픈 준비중에는 누를 것을 주지 않는다. 눌리지 않는 버튼은 하고 싶은 일을 이름으로 걸어놓고 막는 것이다. */
        /* v22. 미연결 행의 버튼은 이제 실제로 연결 화면을 연다. v21에서는 접수증만 남기고 아무것도 열리지 않았다. */
        (opening?'<span class="waiting-note">기다리시면 됩니다</span>':
          p.status==='ready'?Button('연결 확인','channel-readback','','md',false):
          ConnectButton(p.key,isFirstActionable?'primary':'','연결 시작'))+'</div>';
    }
    /* 가입 직후 첫 화면. Hootsuite가 활성화 사건 하나로 밀어붙이는 방식을 코드의 4단계 체크리스트에 적용한다. */
    function startStrip(){
      /* v22. 완료 표시는 방문이 아니라 사건으로만 켜진다. 연결하면 그 자리에서 1단계가 체크된다. */
      var STEPS=START_STEPS.map(function(s){var c={};for(var k in s)c[k]=s[k];c.done=stepDone(s.key);return c;});
      var done=STEPS.filter(function(s){return s.done;}).length;
      var nextStep=STEPS.filter(function(s){return !s.done;})[0]||null;
      if(!nextStep)return finishedStrip();
      var nextKey=nextStep.key;
      return '<section class="start-strip" data-start-checklist="'+STEPS.length+'" data-start-done="'+done+'" aria-label="시작 체크리스트">'+
        '<div class="start-head"><h2>여기까지 하면 혼자서도 돌아갑니다</h2><span class="start-count">'+done+' / '+STEPS.length+' 완료</span></div>'+
        '<div class="start-steps">'+STEPS.map(function(s,i){
          return '<button type="button" data-start-step="'+s.key+'" data-step-done="'+(s.done?'true':'false')+'" data-step-next="'+(s.key===nextKey?'true':'false')+'" aria-label="'+esc(s.label)+'">'+
            '<span class="step-mark" aria-hidden="true">'+(s.done?'✓':(i+1))+'</span><span><b>'+esc(s.label)+'</b><small>'+esc(s.done?'완료':s.hint)+'</small></span></button>';
        }).join('')+'</div>'+
        /* 시작 체크리스트도 같은 3분류 어휘를 쓴다. 못 여는 채널을 유저가 자기 탓으로 오해하면 안 된다. */
        (function(){var c={notConnected:0,opening:0,ready:0};livePolicies().forEach(function(p){c[p.status]++;});
          return '<div class="inline u-mt-3" data-start-status3="true">'+
            '<span class="status success">발행 가능 '+c.ready+'</span>'+
            '<span class="status warning">미연결 '+c.notConnected+'</span><span class="owner-of-reason">내가 할 일</span>'+
            '<span class="status neutral">오픈 준비중 '+c.opening+'</span><span class="owner-of-reason">우리가 할 일</span></div>'+
            '<p class="u-note">오픈 준비중인 '+c.opening+'개는 우리가 플랫폼 심사와 앱 등록을 끝내면 자동으로 열립니다. 지금 하실 일은 없습니다.</p>';})()+
        /* v22. 1단계는 목적지가 아니라 연결 화면 자체를 연다. 화면만 바뀌고 할 일이 없으면 유저에겐 막다른 길이다. */
        '<div class="action-group">'+(nextKey==='channel'&&firstConnectable()?
          ConnectButton(firstConnectable().key,'primary',firstConnectable().label+' 연결 시작'):
          Button(nextStep.label+' 시작하기','start-next','primary','md',false))+
          Button('가입 직후 4단계 다시 보기','onboarding-open','','md',false)+'</div></section>';
    }
    /* 네 단계를 다 끝낸 사람에게 체크리스트를 계속 보여주면 끝난 일을 다시 시키는 화면이 된다.
       대신 다음에 무엇을 할지 하나만 제안한다. */
    function finishedStrip(){
      var more=firstConnectable();
      return '<section class="start-strip" data-start-checklist="4" data-start-done="4" data-start-finished="true" aria-label="시작 체크리스트 완료">'+
        '<div class="start-head"><h2>첫 흐름을 끝까지 돌렸습니다</h2><span class="start-count">4 / 4 완료</span></div>'+
        '<p class="u-note">연결, 브랜드 자료, 게시, 성과 확인까지 한 바퀴가 끝났습니다. '+
        (more?esc(more.label)+'을 더 연결하면 같은 글이 그 채널로도 나갑니다.':'다음 캠페인을 시작하면 이 흐름이 반복됩니다.')+'</p>'+
        '<div class="action-group">'+(more?ConnectButton(more.key,'primary',more.label+' 연결 시작'):Button('다음 캠페인 시작','go-studio','primary','md',false))+
        Button('성과 다시 보기','analytics-open','','md',false)+'</div></section>';
    }
    /* 가입 = Google 계속 한 번. 이메일·비밀번호 화면은 코드에 없으므로 만들지 않는다. */
    function onboardingDialog(){
      var s=ONBOARDING_STEPS.filter(function(x){return x.n===state.onboardingStep;})[0];
      var connectBody=state.onboardingStep===3?
        Notice('연결을 승인하고 돌아오면 아래 항목이 채워집니다. 자격증명 원문은 어느 화면에도 표시하지 않습니다.','')+accountReadback(CONNECTED_ACCOUNTS[1]):'';
      return '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="onboarding-title" data-onboarding-dialog="4">'+
        '<div class="dialog"><div class="dialog-head"><div><div class="kicker">가입 직후 · '+state.onboardingStep+' / 4</div>'+
        '<h2 id="onboarding-title">'+esc(s.title)+'</h2></div>'+btn('닫기','onboarding-close','quiet')+'</div>'+
        '<div class="inline">'+OriginChip('preserved')+'<span class="source-label">Google 계정으로 계속 한 번</span></div>'+
        '<p class="u-mt-3">'+esc(s.body)+'</p><p>'+esc(s.detail)+'</p>'+connectBody+
        '<div class="actions">'+(state.onboardingStep>1?btn('이전','onboarding-prev'):'')+
        (state.onboardingStep<4?btn('다음','onboarding-next','primary'):btn('Studio에서 시작','go-studio','primary'))+
        btn('나중에 하기','onboarding-close')+'</div></div></div>';
    }
    /* v20 정정. v19는 Threads의 Growth·Popular를 Analytics 안으로 옮겼지만 실제 ChannelPage는 둘을 각자 탭으로 갖고 있다.
       옮기지 않고 그대로 두고, 코드에 없는 Create·Calendar만 더한 탭으로 표시한다. */
    function platformTabsFor(item){
      var base=[['queue','Queue','preserved'],['analytics','Analytics','preserved']];
      if(item&&item.path==='/channels/threads')base=base.concat([['growth','Growth','preserved'],['popular','Popular','preserved']]);
      return [['create','Create','added']].concat([base[0]],[['calendar','Calendar','added']],base.slice(1),[['settings','Settings','preserved']]);
    }
    function HeaderTabs(active,item){
      var tabs=platformTabsFor(item);
      return '<nav class="page-tabs" aria-label="이 채널에서 할 일" data-platform-tabs="'+tabs.length+'" data-added-tabs="create,calendar">'+
        tabs.map(function(t){return '<button type="button" data-platform-tab="'+t[0]+'" data-tab-origin="'+t[2]+'" class="'+(active===t[0]?'active':'')+'">'+t[1]+'</button>';}).join('')+'</nav>';
    }
    function UnifiedSurfaceTabs(){return '<nav class="surface-tabs" aria-label="고객과 운영자 공통 운영 보기" data-unified-surface-tabs="5">'+SURFACE_TABS.map(function(t){return '<button type="button" data-surface-tab="'+t[0]+'" class="'+(state.surfaceTab===t[0]?'active':'')+'">'+t[1]+'</button>';}).join('')+'</nav>';}
    function accountTargetTable(){return '<div class="table-wrap"><table class="account-table" data-account-target-count="'+ACCOUNT_TARGETS.length+'"><thead><tr><th>플랫폼</th><th>계정</th><th>현재 사실</th><th>token·갱신</th><th>자동화</th><th>목표</th><th>증거</th></tr></thead><tbody>'+ACCOUNT_TARGETS.map(function(r){return '<tr><td>'+r.provider+'</td><td>'+r.account+'</td><td>'+r.current+'</td><td>'+r.token+'</td><td>'+r.automation+'</td><td>'+r.target+'</td><td>'+r.evidence+'</td></tr>';}).join('')+'</tbody></table></div>';}
    function gapsTable(){return '<div class="table-wrap"><table class="gap-table" data-gap-count="'+GAP_ROWS.length+'"><thead><tr><th>항목</th><th>현재</th><th>목표</th><th>owner</th><th>판정</th></tr></thead><tbody>'+GAP_ROWS.map(function(r){return '<tr><td>'+r.area+'</td><td>'+r.current+'</td><td>'+r.target+'</td><td>'+r.owner+'</td><td>'+StatusBadge(r.status,r.status==='부분'?'warning':'neutral')+'</td></tr>';}).join('')+'</tbody></table></div>';}
    function surfaceBody(role){
      if(state.surfaceTab==='accounts')return Panel(role==='operator'?'전체 계정별 현재와 목표':'내 작업 공간 계정 상태',accountTargetTable(),'','data-surface-body="accounts"');
      if(state.surfaceTab==='automation')return Panel('API 자동화 경계','<div class="list"><div class="list-row"><div class="grow"><b>OAuth 계정 연결</b><small>authorization code, state, scope, refresh, account identity를 확인한 뒤에만 자동화를 켭니다.</small></div>'+StatusBadge('계정별','warning')+'</div><div class="list-row"><div class="grow"><b>고객 자동화 동의</b><small>발행 요청은 기본 꺼짐이며 고객이 계정과 범위를 확인해 켭니다.</small></div>'+StatusBadge('기본 꺼짐','neutral')+'</div><div class="list-row"><div class="grow"><b>외부 실행</b><small>approval, readiness, live proof와 멱등 조건이 하나라도 없으면 요청 0입니다.</small></div>'+StatusBadge('fail closed','warning')+'</div></div>','','data-surface-body="automation"');
      if(state.surfaceTab==='evidence')return Panel('결과 증거','<p>고객은 제목, 수정 번호, 계정, 요청·확인 시각, 상태를 봅니다. 운영자는 같은 항목의 provider phase, correlation, version과 영향 범위를 추가로 봅니다.</p>'+ActionGroup(Button('결과 상세 열기','open-result','primary','md',false)+Button('전체 성과','go-home','quiet','md',false)),'','data-surface-body="evidence"');
      if(state.surfaceTab==='gaps')return Panel('명시적 미구현·미검증',gapsTable(),'','data-surface-body="gaps"');
      return '<div class="grid" data-surface-body="overview"><section class="panel span-6"><h2>'+(role==='operator'?'전체 계정 운영':'내 작업 공간 운영')+'</h2><p>계정, 자동화, 결과 증거, 미구현을 같은 순서로 찾습니다. 역할이 바뀌어도 게시 권한은 바뀌지 않습니다.</p></section><section class="panel span-6"><h2>역할 경계</h2><p>'+(role==='operator'?'고객 대신 작성·승인·게시하지 않습니다. 상태 확인, 제한 지원과 복구만 수행합니다.':'내 작업 공간의 작성·승인·게시만 가능합니다. 운영자 비밀값과 다른 고객 계정은 보이지 않습니다.')+'</p></section></div>';
    }
    function PageShell(title,desc,active,body,action,item){return header(title,desc,action)+HeaderTabs(active,item)+body;}
    function viewportMode(){return window.innerWidth<=700?'390':window.innerWidth<=1100?'1024':'1440';}
    function resultById(id){return state.results.filter(function(r){return r.external_result_id===id;})[0]||state.results[0];}
    function revisionLabel(id){return id==='rev_8'?'수정 8':'수정 7';}
    function campaignLabel(){return '가을 신규 고객 안내';}
    function resultSummary(id){var r=resultById(id);return r.platform+' · '+r.status+' · '+r.metric;}
    function resultSourceSummary(ids){return ids.map(function(id){return resultSummary(id);}).join(' + ');}
    function lineageData(overrides){
      var o=overrides||{};
      return {
        campaign_id:DEMO_IDENTITY.campaign_id,
        content_id:DEMO_IDENTITY.content_id,
        revision_id:o.revision_id||state.currentRevisionId,
        publish_attempt_id:o.publish_attempt_id||DEMO_IDENTITY.publish_attempt_id,
        external_result_id:o.external_result_id||DEMO_IDENTITY.external_result_id,
        experiment_id:DEMO_IDENTITY.experiment_id
      };
    }
    function lineageAttrs(owner,overrides){
      var x=lineageData(overrides);
      return ' data-lineage-owner="'+esc(owner)+'" data-campaign-id="'+x.campaign_id+'" data-content-id="'+x.content_id+'" data-revision-id="'+x.revision_id+'" data-publish-attempt-id="'+x.publish_attempt_id+'" data-external-result-id="'+x.external_result_id+'" data-experiment-id="'+x.experiment_id+'"';
    }
    function lineageStrip(owner,overrides){
      var x=lineageData(overrides),r=resultById(x.external_result_id);
      var labels={campaign_id:'캠페인',content_id:'작업물',revision_id:'수정본',publish_attempt_id:'게시 요청',external_result_id:'게시 결과',experiment_id:'다음 비교'};
      var values={campaign_id:campaignLabel(),content_id:'텍스트·카드뉴스·짧은 영상',revision_id:revisionLabel(x.revision_id),publish_attempt_id:r.requested_at+' 요청',external_result_id:r.platform+' · '+r.status,experiment_id:'첫 문장 구체성 비교'};
      return '<div class="lineage-strip" aria-label="캠페인 진행 정보"'+lineageAttrs(owner,overrides)+'>'+Object.keys(labels).map(function(k){return '<span>'+labels[k]+'<b>'+esc(values[k])+'</b></span>';}).join('')+'</div>';
    }
    function ownerForPath(){
      if(state.path==='/')return 'home';
      if(state.path==='/studio')return 'studio';
      if(state.path==='/inbox')return 'inbox';
      if(state.path==='/calendar')return 'calendar';
      if(state.path==='/settings')return 'settings';
      return 'platform';
    }
    function recoveryCard(owner){
      var s=state.screenState;
      if(s==='success')return '';
      var o=RECOVERY_OWNERS[owner],c=RECOVERY_STATES[s];
      if(!o||!c)return '';
      var preserved=DEMO_IDENTITY.content_id+'|'+o.account+'|'+state.currentRevisionId;
      var action=owner+'-'+s;
      return '<section class="panel state-card" data-recovery="true" data-owner="'+owner+'" data-state="'+s+'" data-preserved-id="'+esc(preserved)+'" data-item-id="'+DEMO_IDENTITY.content_id+'" data-account-id="'+esc(o.account)+'" data-revision-id="'+state.currentRevisionId+'"><div class="kicker">'+o.label+' 복구 경로</div><h2>'+o.label+' · '+c.title+'</h2><p>'+o.context+'을 보존합니다. '+c.detail+'</p><div class="recovery-preserved">보존됨: '+campaignLabel()+' · '+esc(o.accountLabel)+' · '+revisionLabel(state.currentRevisionId)+'</div><div class="actions"><button type="button" class="primary" data-recovery-action="'+action+'">'+o.label+'에서 '+c.verb+'</button>'+btn('Home으로','go-home')+'</div></section>';
    }
    function recoveryOutcome(owner){
      var x=state.lastRecovery;
      if(!x||x.owner!==owner)return '';
      return '<div class="notice" data-recovery-outcome="'+x.action+'" data-owner="'+x.owner+'" data-preserved-id="'+esc(x.preserved_after)+'">'+RECOVERY_OWNERS[owner].label+' 안전 행동 완료 · '+esc(x.label)+' · '+campaignLabel()+'과 '+revisionLabel(state.currentRevisionId)+'을 그대로 유지했습니다.</div>';
    }
    function actionOutcome(){
      var x=state.lastAction;
      return x?'<div class="notice" data-action-outcome="'+x.code+'">'+esc(x.label)+' · 입력과 현재 항목을 보존한 전용 동작을 기록했습니다.</div>':'';
    }
    function header(title,desc,action){
      return '<header class="page-head"><div><h1>'+title+'</h1><p>'+desc+'</p></div>'+(action?'<div class="head-action">'+action+'</div>':'')+'</header>';
    }
    /* 역할 전환. 검수 도구가 숨겨진 프레젠테이션 상태에서도 마우스로 눌러 운영자 화면에 들어가고
       다시 고객 화면으로 돌아올 수 있어야 한다. 네이티브 select가 아니라 버튼 두 개로 둔다. */
    function RoleSwitch(){
      return '<div class="role-switch" role="group" aria-label="역할 전환" data-role-switch-group="true">'+
        '<span class="role-switch-label">보는 사람</span>'+
        [['customer','고객'],['operator','운영자']].map(function(r){
          return '<button type="button" data-role-switch="'+r[0]+'" aria-pressed="'+(state.role===r[0]?'true':'false')+'" '+
            'aria-label="'+esc(r[1])+' 화면으로 보기">'+esc(r[1])+'</button>';}).join('')+'</div>';
    }
    function shell(content){
      var nav=groups.map(function(g){
        return '<section class="nav-group" data-group="'+esc(g.label)+'"><h2>'+esc(g.label)+'</h2>'+
          g.items.map(function(i){return '<button type="button" class="nav-item '+(state.path===i.path?'active':'')+'" data-route="'+i.path+'" data-destination="'+esc(i.label)+'">'+icon(i.icon)+'<span>'+esc(i.label)+'</span>'+(g.off?'<span class="off">꺼짐</span>':'')+'</button>';}).join('')+'</section>';
      }).join('');
      return '<div class="prototype" id="customer-app" data-role="customer" data-theme="'+state.theme+'" data-viewport="'+viewportMode()+'">'+
        '<button type="button" class="drawer-backdrop '+(state.mobileMenu?'mobile-open':'')+'" data-action="mobile-menu-close" aria-label="모바일 메뉴 닫기"></button>'+
        '<aside class="sidebar '+(state.mobileMenu?'mobile-open':'')+'"><div class="brand"><span class="brand-mark">'+icon('edit')+'</span>OpenClaw'+btn('닫기','mobile-menu-close','quiet')+'</div>'+
        '<div class="workspace"><small>작업 공간</small><b>모노스튜디오</b></div><nav aria-label="주요 메뉴">'+nav+'</nav></aside>'+
        '<main class="main"><header class="topbar"><button class="mobile-menu quiet" data-action="mobile-menu" aria-label="메뉴 열기">'+icon('menu')+'<span class="sr-only">메뉴</span></button>'+
        '<span class="breadcrumb">모노스튜디오 · 현재 캠페인</span><span class="spacer"></span>'+RoleSwitch()+
        '<button class="quiet" data-action="toggle-theme" aria-label="화면 테마 바꾸기">'+(state.theme==='light'?'어둡게':'밝게')+'</button></header>'+
