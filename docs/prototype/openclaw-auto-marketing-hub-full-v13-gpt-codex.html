<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketing Hub v13</title><style>
:root{--bg:#fbfbfc;--ink:#18181b;--muted:#52525b;--subtle:#a1a1aa;--line:#e4e4e7;--soft:#f4f4f5;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;font:14px Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:19px 10px;background:#fff;height:100vh;position:sticky;top:0;overflow-y:auto}.brand{padding:0 11px 18px;font-size:16px;font-weight:800}.brand small{display:block;color:var(--blue);font-size:11px;margin-top:4px}.group{margin:13px 0}.group h3{color:var(--subtle);font-size:10px;letter-spacing:.07em;margin:0 11px 5px}.nav{display:block;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:6px;background:transparent;text-align:left;color:#3f3f46}.nav:hover,.nav.active{background:#eff4ff;color:#1d4ed8;font-weight:700}.tag{float:right;font-size:9px;background:#dbeafe;padding:2px 5px;border-radius:99px}.main{min-width:0;padding:24px}.top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:16px}.mobile-menu{display:none}.top h1{font-size:20px;margin:0}.top p{color:var(--muted);margin:3px 0 0}.screen-select,.account{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 11px;min-height:44px}.account{margin-left:auto}.banner{margin:16px 0;padding:10px 13px;background:#eff4ff;border:1px solid #bfdbfe;border-radius:8px;color:#1e40af;font-size:12px}.view{max-width:1320px}.panel{border:1px solid var(--line);border-radius:12px;padding:18px;background:#fff;margin:14px 0}.panel h2{font-size:17px;margin:0 0 7px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:12px;padding:14px;min-height:118px;background:#fff}.card h3{margin:0 0 7px;font-size:14px}.metric{font-size:27px;font-weight:800}.btn{border:1px solid var(--line);background:#fff;border-radius:7px;min-height:44px;padding:8px 12px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:#b91c1c;border-color:#fecaca}.btn.success{color:#fff;background:var(--green);border-color:var(--green)}.btn:disabled{opacity:.48;cursor:not-allowed}.studio-top{display:flex;gap:8px;flex-wrap:wrap}.idea{flex:1;min-width:220px;border:1px solid var(--line);border-radius:7px;min-height:44px;padding:9px}.section-title{display:flex;align-items:center;gap:9px;margin:24px 0 10px}.section-title small{color:var(--muted)}.rail{display:flex;gap:20px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}.post{width:380px;flex:0 0 380px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.post-head{padding:11px;border-bottom:1px solid var(--line);font-weight:800;display:flex;gap:8px;align-items:center}.badge{margin-left:auto;font-size:10px;border-radius:99px;padding:3px 6px;background:var(--soft);color:var(--muted)}.preview{padding:14px;min-height:150px;white-space:pre-wrap;line-height:1.55;background:#fff}.threads .preview,.x .preview{background:#050505;color:#f4f4f5}.instagram .preview{background:#050505;color:#f4f4f5;min-height:380px;display:flex;align-items:end}.video .preview{background:#111;color:#fff;min-height:360px;display:flex;align-items:end}.post-actions{padding:10px;border-top:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap;background:#fff}.status{font-size:11px;color:var(--muted);margin-right:auto;align-self:center}.status.fail{color:var(--red)}.status.uncertain{color:#a16207}.link{font-size:11px;color:#1d4ed8;overflow-wrap:anywhere;padding:0 10px 10px}.form-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:9px 0}.form-row label{min-width:120px;color:var(--muted)}.field{border:1px solid var(--line);border-radius:7px;padding:10px;min-height:44px;flex:1;min-width:190px}.tabs{display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--line);padding-bottom:10px}.tab{white-space:nowrap;border:0;background:#fff;padding:10px;border-radius:6px;min-height:44px}.tab.active{background:#eff4ff;color:#1d4ed8;font-weight:700}.empty{padding:42px 15px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px}.toast{position:fixed;right:20px;bottom:20px;background:#18181b;color:#fff;padding:11px 14px;border-radius:8px;font-size:12px;z-index:50}.drawer-bg{position:fixed;inset:0;background:#0005;z-index:40}.drawer{position:fixed;inset:0 0 0 auto;width:min(470px,100vw);z-index:41;background:#fff;padding:22px;border-left:1px solid var(--line)}textarea{width:100%;height:210px;padding:11px;border:1px solid var(--line);border-radius:8px}.external{color:#1d4ed8}.disabled{opacity:.72}.jobs a{color:#1d4ed8;text-decoration:underline;cursor:pointer}.jobrow{padding:13px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.jobrow b{min-width:100px}.jobrow .muted{margin-right:auto}@media(max-width:700px){.app{display:block}.sidebar{display:none}.sidebar.open{display:block;position:fixed;inset:0 55px 0 0;z-index:45;overflow:auto;box-shadow:5px 0 20px #0003}.main{padding:16px}.mobile-menu{display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:7px}.top{gap:8px;flex-wrap:wrap}.top h1{font-size:17px}.top p{font-size:11px}.screen-select{order:3;width:100%}.account{font-size:11px;padding:8px}.grid{grid-template-columns:1fr}.panel{padding:14px}.studio-top{display:grid;grid-template-columns:1fr 1fr}.idea{grid-column:1/-1}.btn{min-height:44px}.tabs{padding-bottom:8px}.nav{min-height:44px}.post{width:340px;flex-basis:340px}.post-actions .btn{flex:1}.drawer{padding:18px}.banner{margin:12px 0}}
</style></head><body><div id="app"></div><script>
document.head.insertAdjacentHTML('beforeend','<style>.nav,.tab,.account{min-height:44px}.tab{min-width:44px}.field{min-height:44px}a.btn,.jobs a{display:inline-flex;align-items:center;min-height:44px}</style>');
const nav=[['OVERVIEW',['성과','OSMU Studio','승인 인박스','발행 캘린더']],['SOCIAL',['Threads','X (Twitter)','Instagram','Facebook','Bluesky']],['MESSAGING',['Telegram','Discord','Slack']],['VIDEO',['YouTube','TikTok']],['DATA & ANALYTICS',['Blog Performance','Search Console','Google Analytics']],['KEYWORD RESEARCH',['Keyword Planner','Search Advisor','Naver Trends','Google Trends']],['CUSTOM INTEGRATION',['Blog']],['ASSETS & TOOLS',['Images','Videos','Midjourney']],['SYSTEM',['Settings']]];
const route={성과:'home','OSMU Studio':'studio','승인 인박스':'inbox','발행 캘린더':'calendar',Threads:'threads','X (Twitter)':'x',Instagram:'instagram',Facebook:'facebook',Bluesky:'bluesky',Telegram:'telegram',Discord:'discord',Slack:'slack',YouTube:'youtube',TikTok:'tiktok','Blog Performance':'blog-performance','Search Console':'search-console','Google Analytics':'analytics','Keyword Planner':'keyword','Search Advisor':'advisor','Naver Trends':'naver','Google Trends':'trends',Blog:'blog',Images:'images',Videos:'videos',Midjourney:'midjourney',Settings:'settings'};
const screenRoutes=[['home','/ 성과'],['login','/login'],['signup','/signup'],['studio','/studio'],['inbox','/inbox'],['calendar','/calendar'],['threads','/channels/[channel]'],['videos','/videos'],['images','/images'],['blog','/blog'],['blog-performance','/blog-performance'],['search-console','/search-console'],['keyword','/keyword-planner'],['analytics','/google-analytics'],['naver','/naver-trends'],['advisor','/search-advisor'],['trends','/google-trends'],['performance','/performance'],['services','/services'],['settings','/settings'],['operator','/operator'],['customers','/operator/customers'],['privacy','/privacy'],['terms','/terms'],['deletion','/data-deletion']];
const state={r:'home',drawer:false,gen:false,account:'제로원 스튜디오',providerAccount:'@j.the.great.investor',tab:'Channels',toast:'',schedule:null,cards:{},mobile:false}; const platforms=[['threads','Threads','text'],['x','X','text'],['facebook','Facebook','text'],['instagram','Instagram','text'],['telegram','Telegram','text'],['discord','Discord','text'],['slack','Slack','text'],['line','LINE','text'],['shorts','YouTube Shorts','video'],['reels','Instagram Reels','video'],['tiktok','TikTok','video']];function reset(){platforms.forEach(([id,n,k])=>state.cards[id]={id,n,k,text:`${n}에 맞춘 메시지입니다. 오늘의 작은 실행이 내일의 성과를 만듭니다.`,saved:false,status:'draft',link:''})}reset();
function esc(x){return String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function shell(content){return `<div class="app"><aside class="sidebar ${state.mobile?'open':''}"><div class="brand">✣ Marketing Hub<small>${state.account}</small></div>${nav.map(([g,ns])=>`<section class="group"><h3>${g}</h3>${ns.map(n=>`<button data-route="${route[n]}" class="nav ${state.r===route[n]?'active':''}">${n}${n==='OSMU Studio'?'<span class="tag">NEW</span>':''}</button>`).join('')}</section>`).join('')}</aside><main class="main"><header class="top"><button class="mobile-menu" data-menu aria-label="메뉴 열기">☰</button><div><h1>${title()}</h1><p>고객용 마케팅 운영 화면</p></div><select class="screen-select" aria-label="화면 둘러보기" onchange="V13.go(this.value)">${screenRoutes.map(([v,l])=>`<option value="${v}" ${state.r===v?'selected':''}>${l}</option>`).join('')}</select><button class="account" data-route="settings">${state.account} ▾</button></header><div class="banner">연결된 채널의 상태와 발행 결과를 한곳에서 확인하세요.</div><div class="view">${content}</div></main></div>${state.drawer?drawer():''}${state.toast?`<div class="toast">${state.toast}</div>`:''}`}
function title(){const names={login:'로그인',signup:'가입',performance:'성과 이동 안내',services:'전체 서비스',operator:'운영자 로그인',customers:'고객 관리',privacy:'개인정보 처리방침',terms:'이용약관',deletion:'데이터 삭제 안내'};return names[state.r]||Object.entries(route).find(([,v])=>v===state.r)?.[0]||'Marketing Hub'}function home(){return `<section class="grid"><div class="card"><h3>이번 주 콘텐츠</h3><div class="metric">24</div><span class="muted">예약 6 · 검토 3</span></div><div class="card"><h3>도달</h3><div class="metric">18.4K</div><span class="muted">지난주보다 12% 증가</span></div><div class="card"><h3>연결된 채널</h3><div class="metric">4</div><span class="muted">발행 가능한 채널</span></div></section><section class="panel"><h2>오늘 할 일</h2><div class="jobs"><a data-route="studio">OSMU Studio에서 콘텐츠 만들기</a> · <a data-route="inbox">승인 대기 3건 확인</a> · <a data-route="calendar">예약 6건 보기</a></div></section>`}
function studio(){return `<div class="studio-top"><input class="idea" id="idea" placeholder="글감 / 콘텐츠 주제를 입력하세요" value="작은 실행이 만드는 변화"><button class="btn" data-brand>브랜드 설정</button><button class="btn" data-wiki>위키</button><button class="btn primary" data-generate>OSMU 생성</button><button class="btn" data-save-all>Save</button><button class="btn success" data-bulk>Publish (4)</button></div>${state.schedule?`<section class="panel"><h2>예약 발행 · 작업 MH-2048</h2><div class="form-row"><input class="field" value="${state.schedule}" id="scheduleTime"><button class="btn primary" data-change>시간 변경</button><button class="btn danger" data-cancel>예약 취소</button></div><div class="muted">같은 작업은 <a data-route="calendar">발행 캘린더</a>와 <a data-route="inbox">승인 인박스</a>에서 확인할 수 있습니다.</div></section>`:`<section class="panel"><button class="btn" data-schedule>발행 예약 만들기</button></section>`}<div class="section-title"><b>텍스트 8개</b><small>Threads, X, Facebook, Instagram, Telegram, Discord, Slack, LINE</small></div>${state.gen?`<div class="rail">${platforms.slice(0,8).map(([id])=>post(state.cards[id])).join('')}</div><div class="section-title"><b>영상 3개</b><small>Shorts, Reels, TikTok 원고를 영상 작업실로 넘깁니다.</small></div><div class="rail">${platforms.slice(8).map(([id])=>post(state.cards[id])).join('')}</div>`:'<div class="empty">글감 또는 브랜드 위키를 바탕으로 콘텐츠를 만들 수 있습니다.</div>'}`}
function post(c){let label={draft:'저장 전 초안',ready:c.k==='video'?'원고 저장됨':'발행 준비',publishing:'발행 중',published:'발행됨',failed_confirmed:'전송 전 실패',uncertain:'게시 여부 확인 필요',repair_required:'게시됨, 기록 복구 필요'}[c.status];let buttons;if(c.k==='video')buttons=`<button class="btn" data-video-save="${c.id}">원고 저장</button><button class="btn primary" data-route="videos">영상 작업실로</button>`;else if(c.id==='line')buttons=`<button class="btn" data-route="settings">연결 설정</button>`;else buttons=c.status==='published'?`<button class="btn" data-open="${c.id}">게시물 보기</button>`:c.status==='failed_confirmed'?`<button class="btn danger" data-retry="${c.id}">다시 발행</button>`:c.status==='uncertain'?`<button class="btn" data-reconcile="${c.id}">게시 결과 확인</button>`:c.status==='repair_required'?`<button class="btn" data-repair="${c.id}">기록 복구</button>`:`<button class="btn primary" data-publish="${c.id}" ${c.saved?'':'disabled'}>Publish</button>`;return `<article class="post ${c.id} ${c.k==='video'?'video':''}" data-card="${c.id}"><div class="post-head">${c.n}<span class="badge">${c.k==='video'?'영상 원고':c.id==='line'?'연결 준비 필요':'텍스트'}</span></div><div class="preview">${esc(c.text)}</div><div class="post-actions"><span class="status ${c.status==='failed_confirmed'?'fail':c.status==='uncertain'||c.status==='repair_required'?'uncertain':''}">${label}</span><button class="btn" data-edit="${c.id}">편집</button>${buttons}</div>${c.link?`<div class="link">${c.link}</div>`:''}</article>`}
function provider(){let n=title(), messaging=['Telegram','Discord','Slack'].includes(n), video=['YouTube','TikTok'].includes(n);let caps=n==='Instagram'?['Queue','Editor','Settings']:n==='Threads'?['Queue','Analytics','Growth','Popular','Settings']:messaging?['연결 설정']:video?['연결 설정','영상 작업실']:['Queue','Analytics','Settings'];return `<section class="panel"><div class="form-row"><div><h2>${n}</h2><p class="muted">${n==='Threads'?state.providerAccount:'연결된 기본 계정'} · <b style="color:var(--green)">연결됨</b></p></div><button class="btn" data-route="settings">계정 및 연결 관리</button></div></section><div class="tabs">${caps.map((x,i)=>`<button class="tab ${i===0?'active':''}">${x}</button>`).join('')}</div><section class="panel"><h2>${caps[0]}</h2><p class="muted">${messaging?'이 채널은 연결 정보와 발행 권한만 관리합니다.':video?'계정 연결은 여기서 관리하고 영상 제작과 전달은 영상 작업실에서 진행합니다.':'채널에 맞는 현재 콘텐츠와 상태를 확인합니다.'}</p><div class="form-row">${video?'<button class="btn primary" data-route="videos">영상 작업실 열기</button>':'<button class="btn primary" data-route="studio">Studio로 콘텐츠 만들기</button>'}</div></section>`}
function settings(){const tabs=['Channels','AI Engine','Storage','Design Tools','Notifications','Fork 연동','Keywords','System'];return `<div class="tabs">${tabs.map(x=>`<button class="tab ${state.tab===x?'active':''}" data-tab="${x}">${x}</button>`).join('')}</div><section class="panel"><h2>${state.tab}</h2>${state.tab==='Channels'?`<p class="muted">연결 확인이 끝난 계정만 Studio와 채널 화면에 같은 이름으로 표시됩니다.</p><div class="jobrow"><b>Threads</b><span class="muted">${state.providerAccount} · 연결됨</span><select class="field" id="providerAccount"><option ${state.providerAccount==='@j.the.great.investor'?'selected':''}>@j.the.great.investor</option><option ${state.providerAccount==='@code_zero_to_one'?'selected':''}>@code_zero_to_one</option></select><button class="btn primary" data-provider-switch>선택 계정 확인</button></div><div class="jobrow"><b>Instagram</b><span class="muted">@zeroone.official · 연결됨</span><button class="btn">다시 연결</button></div><div class="jobrow"><b>Facebook</b><span class="muted">권한이 만료되었습니다 · 다시 연결 필요</span><button class="btn">다시 연결</button></div><p class="muted">브라우저에 다른 Meta 계정이 열려 있으면 시크릿 창에서 원하는 계정으로 다시 인증하세요.</p>`:`<div class="form-row"><label>${state.tab}</label><span class="badge">설정 가능</span><button class="btn">변경</button></div>`}</section>`}
function generic(){let t=title();if(state.r==='inbox')return `<section class="panel"><h2>승인 및 발행 결과</h2><div class="jobrow"><b>MH-2047</b><span class="muted">Studio 카드 발행 · X · 발행됨</span><button class="btn" data-route="studio">작업 열기</button></div><div class="jobrow"><b>MH-2048</b><span class="muted">Studio 예약 · 8/07 10:00</span><button class="btn" data-route="calendar">캘린더에서 보기</button></div><div class="jobrow"><b>MH-2049</b><span class="muted">게시 여부 확인 필요</span><button class="btn" data-recovery="instagram:uncertain">게시 결과 확인</button></div></section>`;if(state.r==='calendar')return `<section class="panel"><h2>8월 발행 캘린더</h2><div class="jobrow"><b>8/07 10:00</b><span class="muted">MH-2048 · Threads, X, Facebook</span><button class="btn" data-route="studio">작업 열기</button></div>${state.schedule?`<div class="jobrow"><b>${state.schedule}</b><span class="muted">MH-2048 · 예약됨</span><button class="btn" data-route="studio">변경 또는 취소</button></div>`:'<div class="empty">추가 예약이 없습니다. Studio에서 새 예약을 만들 수 있습니다.</div>'}</section>`;if(['analytics','advisor','naver'].includes(state.r))return `<section class="panel disabled"><h2>${t}</h2><p>고객별 안전한 연결이 준비 중이라 현재 사용할 수 없습니다.</p><button class="btn" data-route="home">성과로 돌아가기</button></section>`;if(state.r==='trends')return `<section class="panel"><h2>Google Trends</h2><p class="external">Google에서 직접 검색 추세를 확인합니다.</p><a class="btn external" href="https://trends.google.com" target="_blank" rel="noreferrer">Google Trends 열기 ↗</a></section>`;if(state.r==='videos')return `<section class="panel"><h2>영상 작업실</h2><p class="muted">Shorts, Reels, TikTok 원고를 영상으로 제작하고 지원되는 계정으로 전달합니다.</p><div class="grid"><div class="card"><h3>YouTube Shorts</h3><button class="btn primary">원고 불러오기</button></div><div class="card"><h3>Instagram Reels</h3><button class="btn primary">원고 불러오기</button></div><div class="card"><h3>TikTok</h3><button class="btn primary">원고 불러오기</button></div></div></section>`;if(['images','midjourney'].includes(state.r))return `<section clas
