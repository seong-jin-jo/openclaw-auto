<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Marketing Hub · OSMU Studio</title>
  <style>
    :root{--bg:#fbfbfc;--surface:#fff;--surface-2:#f4f4f5;--border:#e4e4e7;--text:#18181b;--muted:#52525b;--subtle:#71717a;--accent:#2563eb;--accent-hover:#1d4ed8;--accent-fg:#fff;--accent-soft:#eff4ff;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--shadow:0 4px 12px rgba(16,24,40,.08);--radius:12px}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button,a,input,textarea{min-height:44px}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.46}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .shell{min-height:100vh;display:grid;grid-template-columns:224px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--border)}.brand{padding:20px 16px;border-bottom:1px solid var(--border)}.brandline{display:flex;align-items:center;gap:9px;font-weight:750}.brandmark{width:24px;height:24px;position:relative}.brandmark:before,.brandmark:after{content:"";position:absolute;width:14px;height:14px;border-radius:5px}.brandmark:before{left:1px;top:1px;background:#a1a1aa}.brandmark:after{right:1px;bottom:1px;background:var(--accent)}.workspace-name{font-size:12px;color:var(--muted);margin-top:5px}.nav{padding:12px 0 24px}.navgroup{margin-top:12px}.navtitle{padding:0 14px 5px;font-size:10px;font-weight:700;color:var(--subtle);text-transform:uppercase;letter-spacing:.08em}.navitem{border:0;background:transparent;width:100%;padding:0 14px;display:flex;align-items:center;gap:10px;color:var(--muted);text-align:left;font-size:13px;min-height:44px}.navitem:hover{background:var(--surface-2)}.navitem.active{background:var(--accent-soft);color:var(--text);border-right:2px solid var(--accent)}.navdot{width:8px;height:8px;border:1px solid currentColor;border-radius:50%;flex:0 0 auto}.new{margin-left:auto;color:var(--accent);font-size:9px;font-weight:800}
    .main{min-width:0;padding:28px 32px 60px}.content{max-width:1180px;margin:0 auto}.eyebrow{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.06em}.headline-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.headline h1{font-size:28px;line-height:36px;margin:5px 0 4px}.headline p{margin:0;color:var(--muted);font-size:14px;line-height:22px}.header-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:9px 14px;font-weight:650;font-size:13px}.btn:hover:not(:disabled){border-color:var(--subtle);background:var(--surface-2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}.btn.primary:hover:not(:disabled){background:var(--accent-hover)}.btn.danger{color:var(--danger);border-color:#fecaca}.btn.link{color:var(--accent);border-color:transparent;background:transparent;padding-inline:6px}.btn.small{min-height:44px;padding:8px 11px;font-size:12px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
    .source-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,.7fr);gap:16px;margin-top:24px}.source-card{padding:20px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.input{display:block;width:100%;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);padding:12px}.source-text{min-height:146px;resize:vertical;line-height:1.6}.field-meta{display:flex;justify-content:space-between;gap:12px;margin-top:7px;font-size:11px;color:var(--subtle)}.source-tools{display:flex;align-items:end;gap:10px;margin-top:14px;flex-wrap:wrap}.source-tools .field{min-width:150px;flex:1}.selectlike{width:100%;height:44px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 12px;color:var(--muted)}.generate{min-width:170px}.summary-card{padding:20px}.summary-card h2{font-size:16px;margin:0 0 12px}.promise{padding:13px;background:var(--accent-soft);border-radius:9px;color:#1e3a8a;font-size:13px;line-height:20px}.mini-list{display:grid;gap:9px;margin-top:15px}.mini-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.mini-row strong{color:var(--text);font-size:14px}.helper{margin:10px 0 0;color:var(--subtle);font-size:12px}.spinner{width:18px;height:18px;border:2px solid #bfdbfe;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}
    .workspace-head{margin-top:28px;display:flex;justify-content:space-between;align-items:end;gap:16px}.workspace-head h2{font-size:20px;margin:0 0 4px}.workspace-head p{font-size:13px;color:var(--muted);margin:0}.metrics{display:flex;gap:8px;flex-wrap:wrap}.metric{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 11px;font-size:11px;color:var(--muted)}.metric strong{color:var(--text)}
    .tabs{display:flex;gap:7px;margin:16px 0;overflow-x:auto;padding:2px 2px 8px}.tab{white-space:nowrap;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:12px;color:var(--muted);min-height:44px}.tab.active{background:var(--accent-soft);border-color:#bfdbfe;color:var(--accent);font-weight:750}.status-dot{width:7px;height:7px;display:inline-block;border-radius:50%;background:var(--subtle);margin-right:5px}.status-dot.ready{background:var(--success)}.status-dot.failed{background:var(--danger)}.status-dot.blocked{background:var(--warning)}.status-dot.published{background:var(--accent)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.platform-card{padding:20px;transition:border .15s,box-shadow .15s;scroll-margin-top:14px}.platform-card.focused{border-color:#93c5fd;box-shadow:0 0 0 3px var(--accent-soft)}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.platform-id{display:flex;align-items:center;gap:10px}.platform-icon{width:34px;height:34px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-weight:800}.platform-name{font-weight:750;font-size:16px}.account{font-size:11px;color:var(--subtle);margin-top:2px}.badge{display:inline-flex;align-items:center;min-height:28px;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:750;background:var(--surface-2);color:var(--muted)}.badge.success{background:#f0fdf4;color:var(--success)}.badge.warning{background:#fffbeb;color:var(--warning)}.badge.danger{background:#fef2f2;color:var(--danger)}.badge.info{background:var(--accent-soft);color:var(--accent)}.readiness{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px;padding:10px 12px;border-radius:8px;background:#f8fafc;font-size:11px;color:var(--muted)}.readiness.blocked{background:#fffbeb;color:#92400e}.draft{width:100%;min-height:132px;resize:vertical;border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--surface-2);color:var(--text);line-height:1.55}.draft[readonly]{cursor:default}.draft.editing{background:var(--surface);border-color:#93c5fd}.draft-meta{display:flex;justify-content:space-between;gap:10px;color:var(--subtle);font-size:11px;margin:7px 0 12px}.card-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card-actions .publish{margin-left:auto}.card-note{margin-top:10px;color:var(--subtle);font-size:11px;line-height:17px}.card-note.warn{color:#92400e}.card-note.error{color:var(--danger)}.result{margin-top:12px;border-top:1px solid var(--border);padding-top:12px;font-size:12px}.result-title{font-weight:750;margin-bottom:3px}.permalink{color:var(--accent);font-size:11px;overflow-wrap:anywhere;margin-top:5px}.failure-box{margin-top:14px;padding:14px;border-radius:9px;background:#fef2f2;color:#991b1b;font-size:12px;line-height:19px}.empty-box{margin-top:10px;padding:10px;border-radius:8px;background:#fffbeb;color:#92400e;font-size:11px}
    .bulk{margin-top:20px;overflow:hidden}.bulk-head{width:100%;border:0;background:var(--surface);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;text-align:left}.bulk-title{font-weight:750}.bulk-sub{font-size:11px;color:var(--subtle);margin-top:3px}.bulk-body{border-top:1px solid var(--border);padding:16px 18px}.bulk-list{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bulk-option{border:1px solid var(--border);border-radius:8px;min-height:44px;padding:8px;display:flex;align-items:center;gap:7px;font-size:12px}.bulk-option.disabled{opacity:.48}.bulk-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.bulk-review{padding:14px;background:var(--accent-soft);border-radius:8px;font-size:12px;margin-top:12px}
    .overlay{position:fixed;inset:0;background:rgba(24,24,27,.48);z-index:20;display:grid;place-items:center;padding:18px}.dialog{background:var(--surface);border-radius:14px;width:min(680px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.22)}.dialog-head{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:16px}.dialog-head h2{margin:0;font-size:19px}.dialog-body{padding:20px}.recovery-list{display:grid;gap:12px}.recovery-item{border:1px solid var(--border);border-radius:10px;padding:14px}.recovery-item h3{font-size:14px;margin:0 0 5px}.recovery-item p{font-size:12px;color:var(--muted);line-height:19px;margin:0 0 10px}.toast{position:fixed;right:20px;bottom:20px;background:#18181b;color:#fff;border-radius:9px;padding:12px 16px;font-size:12px;z-index:30;box-shadow:var(--shadow)}.route-card{margin-top:28px;padding:30px;text-align:center}.route-card h2{margin:0 0 8px}.route-card p{color:var(--muted);font-size:13px}
    @media(max-width:768px){.shell{display:block}.sidebar{position:relative;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--border);overflow:hidden}.brand{padding:14px 16px}.nav{display:flex;gap:4px;overflow-x:auto;padding:8px}.navgroup{display:contents}.navtitle{display:none}.navitem{width:auto;min-width:44px;flex:0 0 auto;white-space:nowrap;border:1px solid var(--border);border-radius:8px;min-height:44px;padding:0 12px}.navitem.active{border-right:1px solid #bfdbfe;border-color:#bfdbfe}.navdot{display:none}.main{padding:20px 16px 48px}.headline-row{display:block}.header-actions{margin-top:14px}.source-layout{grid-template-columns:1fr;margin-top:18px}.source-card,.summary-card,.platform-card{padding:16px}.source-tools{display:grid;grid-template-columns:1fr}.generate{width:100%}.workspace-head{display:block}.metrics{margin-top:12px}.grid{grid-template-columns:1fr}.tabs{margin-inline:-2px}.bulk-list{grid-template-columns:1fr 1fr}.card-actions .publish{margin-left:0;width:100%}.btn{min-height:44px}.headline h1{font-size:24px;line-height:31px}.toast{left:16px;right:16px;bottom:16px}.dialog{max-height:92vh}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const NAV=[
      ["Overview",[["성과","/"],["OSMU Studio","/studio"],["승인 인박스","/inbox"],["발행 캘린더","/calendar"]]],
      ["Social",[["Threads","/channels/threads"],["X","/channels/x"],["Instagram","/channels/instagram"],["Facebook","/channels/facebook"],["Bluesky","/channels/bluesky"]]],
      ["Messaging",[["Telegram","/channels/telegram"],["Discord","/channels/discord"],["Slack","/channels/slack"]]],
      ["Video",[["YouTube","/channels/youtube"],["TikTok","/channels/tiktok"]]],
      ["Data & Analytics",[["Blog Performance","/blog-performance"],["Search Console","/search-console"],["Google Analytics","/google-analytics"]]],
      ["Keyword Research",[["Keyword Planner","/keyword-planner"],["Search Advisor","/search-advisor"],["Naver Trends","/naver-trends"],["Google Trends","/google-trends"]]],
      ["Custom Integration",[["Blog","/blog"]]],
      ["Assets & Tools",[["Images","/images"],["Videos","/videos"],["Midjourney","/channels/midjourney"]]],
      ["System",[["Settings","/settings"]]]
    ];
    const PLATFORM_DEFS=[
      {id:"threads",name:"Threads",icon:"T",account:"@brand_notes",meta:"대화형 첫 문장 · 링크 허용",ready:true,draft:"자동화는 일을 줄이는 버튼이 아니라, 실패했을 때 돌아올 자리를 먼저 정하는 약속입니다.\n\n우리 팀이 자동화를 시작하기 전에 확인하는 세 가지를 정리했습니다."},
      {id:"x",name:"X",icon:"X",account:"@brand_ops",meta:"핵심 한 문장 · 280자",ready:true,draft:"자동화의 시작점은 실행 버튼이 아니다. 실패했을 때 어디로 돌아올지 정하는 것이 먼저다. 팀 자동화 전 확인할 3가지를 정리했다."},
      {id:"facebook",name:"Facebook",icon:"f",account:"연결할 페이지 없음",meta:"설명형 본문 · 링크 미리보기",ready:false,reason:"Settings에서 Facebook 페이지를 연결하면 발행할 수 있어요.",draft:"반복 업무를 자동화하기 전에 팀이 먼저 합의해야 할 것은 복구 지점입니다. 실패를 숨기지 않고 되돌릴 수 있는 구조가 있어야 자동화를 안심하고 확장할 수 있습니다."},
      {id:"instagram",name:"Instagram",icon:"◎",account:"@brand.daily",meta:"캡션 · 해시태그 · 이미지",ready:true,draft:"자동화 전에 먼저 정할 것: 실패했을 때 돌아올 자리.\n\n작게 시작하고, 결과를 확인하고, 언제든 되돌릴 수 있게 만드세요.\n\n#팀운영 #업무자동화 #생산성"},
      {id:"bluesky",name:"Bluesky",icon:"B",account:"계정 연결 필요",meta:"핵심 관점 · 300자",ready:false,reason:"Settings에서 Bluesky 계정을 연결하면 발행할 수 있어요.",draft:"",generation:"failed"},
      {id:"telegram",name:"Telegram",icon:"TG",account:"채널 연결 필요",meta:"채널 메시지 · 링크 미리보기",ready:false,reason:"Settings에서 Telegram 채널과 bot을 연결하면 발행할 수 있어요.",draft:"자동화는 시작보다 복구가 먼저입니다. 팀이 안전하게 자동화를 시작하는 체크리스트를 공유합니다."},
      {id:"discord",name:"Discord",icon:"D",account:"서버 연결 필요",meta:"서버 공지 · markdown",ready:false,reason:"Settings에서 Discord 서버와 채널을 연결하면 발행할 수 있어요.",draft:"**팀 자동화 체크리스트**\n실패했을 때 돌아올 지점을 먼저 정하고 작은 범위부터 시작하세요."},
      {id:"slack",name:"Slack",icon:"S",account:"워크스페이스 연결 필요",meta:"채널 공지 · 링크 미리보기",ready:false,reason:"Settings에서 Slack 워크스페이스와 채널을 연결하면 발행할 수 있어요.",draft:"",generation:"empty"}
    ];
    const state={screen:"studio",generated:false,generating:false,source:"반복 업무를 자동화하기 전에 실패했을 때 돌아올 지점을 먼저 정해야 합니다. 팀이 안심하고 자동화를 쓸 수 있는 가장 작은 체크리스트를 공유합니다.",focus:"threads",cards:{},bulkOpen:false,bulkReview:false,bulkSelected:new Set(),recoveryOpen:false,loadingPlatform:null,toast:""};
    function newCards(){state.cards={};for(const p of PLATFORM_DEFS){state.cards[p.id]={...p,editing:false,saved:false,publish:"idle",permalink:"",updated:"",generation:p.generation||"nonempty"}}}
    function sidebar(){return `<aside class="sidebar"><div class="brand"><div class="brandline"><span class="brandmark"></span>Marketing Hub</div><div class="workspace-name">OpenClaw 워크스페이스</div></div><nav class="nav">${NAV.map(([g,items])=>`<div class="navgroup"><div class="navtitle">${g}</div>${items.map(([label,path])=>`<button class="navitem ${path==="/studio"&&state.screen==="studio"?"active":""}" data-nav="${path}"><span class="navdot"></span>${label}${label==="OSMU Studio"?'<span class="new">NEW</span>':""}</button>`).join("")}</div>`).join("")}</nav></aside>`}
    function header(){return `<div class="headline-row"><div class="headline"><div class="eyebrow">OSMU STUDIO</div><h1>원문 한 번, 채널별 초안 8개</h1><p>필요한 카드만 따로 고쳐 저장하고, 준비된 카드만 하나씩 발행하세요.</p></div><div class="header-actions"><button class="btn" data-recovery-open>안전 복구 보기</button><button class="btn" data-new-source>새 원문</button></div></div>`}
    function sourceArea(){const enabled=state.source.trim().length>0&&!state.generating;return `<div class="source-layout"><section class="card source-card"><div class="field"><label for="source">승인할 원문</label><textarea id="source" class="input source-text" data-source>${esc(state.source)}</textarea><div class="field-meta"><span>초안 생성 뒤에도 원문은 보존돼요.</span><span>${state.source.length}자</span></div></div><div class="source-tools"><div class="field"><label>브랜드 톤</label><button class="selectlike" data-tone>명료하고 실용적인 톤</button></div><div class="field"><label>이미지</label><button class="selectlike" data-image>이미지 선택 · 선택 사항</button></div><button class="btn primary generate" data-generate ${enabled?"":"disabled"}>${state.generating?'<span class="spinner"></span>8개 초안 만드는 중':"Generate Drafts"}</button></div>${!state.source.trim()?'<p class="helper">원문을 입력하면 8개 채널 초안을 만들어요.</p>':""}</section><aside class="card summary-card"><h2>한 번 만들고, 하나씩 발행</h2><div class="promise">8개 초안은 같은 원문에서 시작하지만 편집, 저장, 발행 결과는 카드마다 독립적입니다.</div><div class="mini-list"><div class="mini-row"><span>생성되는 카드</span><strong>항상 8개</strong></div><div class="mini-row"><span>기본 일괄 선택</span><strong>0개</strong></div><div class="mini-row"><span>Generate의 외부 발행</span><strong>없음</strong></div></div></aside></div>`}
    function statusOf(c){if(c.publish==="published")return["발행됨","info","published"];if(c.publish==="publishing")return["발행 중","warning","blocked"];if(c.publish==="failed")return["발행 거절","danger","failed"];if(c.publish==="repair")return["결과 복구 필요","warning","blocked"];if(c.publish==="unknown")return["결과 확인 중","warning","blocked"];if(c.generation==="failed")return["생성 실패","danger","failed"];if(c.generation==="empty")return["내용 필요","warning","blocked"];if(c.saved&&!c.ready)return["저장됨","success","blocked"];if(c.saved)return["발행 가능","success","ready"];return["초안 준비됨","","ready"]}
    function cardSnapshot(c){return [c.id,c.draft,c.saved,c.publish,c.generation,c.ready,c.updated].join("|")}
    function cardHtml(c){const [label,kind]=statusOf(c);const empty=!c.draft.trim();const publishDisabled=!c.ready||empty||!c.saved||c.generation==="failed"||state.loadingPlatform!==null;const safeNote=!c.ready?c.reason:empty?"내용을 입력하고 저장하면 발행할 수 있어요.":!c.saved?"초안을 저장하면 이 카드만 발행할 수 있어요.":"Publish는 이 카드 하나만 처리합니다.";return `<article class="card platform-card ${state.focus===c.id?"focused":""}" id="card-${c.id}" data-card="${c.id}" data-visible-snapshot="${hash(cardSnapshot(c))}"><div class="card-head"><div class="platform-id"><div class="platform-icon">${c.icon}</div><div><div class="platform-name">${c.name}</div><div class="account">${c.account}</div></div></div><span class="badge ${kind}">${label}</span></div>${c.ready?`<div class="readiness"><span>✓ 발행 계정 준비됨</span><strong>${c.account}</strong></div>`:`<div class="readiness blocked"><span>발행 준비 필요</span><button class="btn link small" data-connect="${c.id}">Settings에서 연결</button></div>`}${c.generation==="failed"?`<div class="failure-box"><strong>이 채널 초안을 만들지 못했어요.</strong><br>원문은 안전하게 보존됐습니다.<div style="margin-top:10px"><button class="btn small" data-regenerate="${c.id}">이 카드만 다시 만들기</button></div></div>`:`<textarea class="draft ${c.editing?"editing":""}" data-draft="${c.id}" ${c.editing||c.generation==="empty"?"":"readonly"} aria-label="${c.name} 초안">${esc(c.draft)}</textarea><div class="draft-meta"><span>${c.meta}</span><span>${c.draft.length}자</span></div><div class="card-actions"><button class="btn small" data-edit="${c.id}">${c.editing?"편집 닫기":"Edit"}</button><button class="btn small" data-save="${c.id}" ${empty?"disabled":""}>Save</button>${publishActions(c,publishDisabled)}</div><div class="card-note ${!c.ready||empty?"warn":""}">${safeNote}</div>${publishResult(c)}`}</article>`}
    function publishActions(c,disabled){if(c.publish==="failed")return `<button class="btn primary small publish" data-retry="${c.id}">다시 발행</button>`;if(c.publish==="repair")return `<button class="btn primary small publish" data-repair="${c.id}">결과 기록 복구</button>`;if(c.publish==="unknown")return `<button class="btn primary small publish" data-check-result="${c.id}">결과 다시 확인</button>`;if(c.publish==="published")return `<button class="btn small publish" data-open-post="${c.id}">실제 게시물 보기</button>`;return `<button class="btn primary small publish" data-publish="${c.id}" ${disabled?"disabled":""}>${c.publish==="publishing"?'<span class="spinner"></span>발행 중':"Publish"}</button>`}
    function publishResult(c){if(c.publish==="published")return `<div class="result"><div class="result-title">✓ 발행됐어요 · ${c.updated}</div><div>실제 게시물 링크를 확인할 수 있어요.</div><div class="permalink">${c.permalink}</div></div>`;if(c.publish==="failed")return `<div class="result"><div class="result-title" style="color:var(--danger)">플랫폼이 발행을 거절했어요.</div><div>초안을 확인한 뒤 이 카드만 다시 보냅니다.</div></div>`;if(c.publish==="repair")return `<div class="result"><div class="result-title" style="color:var(--warning)">게시물은 올라갔지만 결과 저장이 덜 됐어요.</div><div>같은 게시물을 다시 보내지 않고 기존 결과만 복구합니다.</div></div>`;if(c.publish==="unknown")return `<div class="result"><div class="result-title" style="color:var(--warning)">발행 여부를 확인 중이에요.</div><div>확인이 끝날 때까지 다시 발행하지 않습니다.</div></div>`;return ""}
    function tabs(){return `<div class="tabs" aria-label="플랫폼 카드로 이동">${PLATFORM_DEFS.map(p=>{const c=state.cards[p.id],[, ,dot]=statusOf(c);return `<button class="tab ${state.focus===p.id?"active":""}" data-tab="${p.id}"><span class="status-dot ${dot}"></span>${p.name}</button>`}).join("")}</div>`}
    function workspace(){const cards=Object.values(state.cards),saved=cards.filter(c=>c.saved).length,ready=cards.filter(c=>c.ready&&c.saved&&c.draft.trim()).length,published=cards.filter(c=>c.publish==="published").length;return `<section class="workspace-head"><div><h2>채널별 초안</h2><p>탭은 카드를 숨기지 않고 해당 카드로 이동합니다.</p></div><div class="metrics"><span class="metric"><strong>8</strong>개 카드</span><span class="metric"><strong>${saved}</strong> 저장</span><span class="metric"><strong>${ready}</strong> 발행 가능</span><span class="metric"><strong>${published}</strong> 발행됨</span></div></section>${tabs()}<section class="grid">${PLATFORM_DEFS.map(p=>cardHtml(state.cards[p.id])).join("")}</section>${bulkHtml()}`}
    function bulkHtml(){const ready=PLATFORM_DEFS.filter(p=>{const c=state.cards[p.id];return c.ready&&c.saved&&c.draft.trim()&&c.publish!=="published"});return `<section class="card bulk"><button class="bulk-head" data-bulk-toggle><span><div class="bulk-title">일괄 발행</div><div class="bulk-sub">기본 흐름이 아닙니다. 선택 0개에서 직접 검토해 시작합니다.</div></span><span>${state.bulkOpen?"접기 ↑":"열기 ↓"}</span></button>${state.bulkOpen?`<div class="bulk-body"><div class="bulk-list">${PLATFORM_DEFS.map(p=>{const c=state.cards[p.id],enabled=ready.some(x=>x.id===p.id);return `<label class="bulk-option ${enabled?"":"disabled"}"><input type="checkbox" data-bulk-select="${p.id}" ${state.bulkSelected.has(p.id)?"checked":""} ${enabled?"":"disabled"}>${p.name}</label>`}).join("")}</div>${state.bulkReview?`<div class="bulk-review"><strong>선택한 ${state.bulkSelected.size}개를 검토하세요.</strong><br>계정과 초안이 맞는지 확인한 뒤에만 발행합니다.</div>`:""}<div class="bulk-actions"><button class="btn" data-bulk-cancel>취소</button>${state.bulkReview?`<button class="btn primary" data-bulk-confirm>선택한 ${state.bulkSelected.size}개 발행 확인</button>`:`<button class="btn primary" data-bulk-review ${state.bulkSelected.size?"":"disabled"}>선택한 ${state.bulkSelected.size}개 검토</button>`}</div></div>`:""}</section>`}
    function recoveryDialog(){return `<div class="overlay"><section class="dialog"><div class="dialog-head"><div><div class="eyebrow">안전 복구</div><h2>같은 게시물을 두 번 보내지 않아요</h2></div><button class="btn" data-recovery-close>닫기</button></div><div class="dialog-body"><div class="recovery-list"><div class="recovery-item"><h3>플랫폼이 발행을 거절했어요</h3><p>거절이 확인된 카드만 다시 발행할 수 있어요. 다른 7개는 바뀌지 않습니다.</p><button class="btn small" data-demo="failed">X 카드에서 보기</button></div><div class="recovery-item"><h3>게시물은 올라갔지만 결과 저장이 덜 됐어요</h3><p>같은 게시물을 다시 보내지 않고 기존 결과 기록만 복구합니다.</p><button class="btn small" data-demo="repair">Instagram 카드에서 보기</button></div><div class="recovery-item"><h3>발행 여부를 확인 중이에요</h3><p>결과를 먼저 확인합니다. 확인 전에는 다시 발행할 수 없습니다.</p><button class="btn small" data-demo="unknown">Threads 카드에서 보기</button></div></div></div></section></div>`}
    function studio(){return `${header()}${sourceArea()}${state.generated?workspace():""}${state.recoveryOpen?recoveryDialog():""}`}
    function route(){return `${header()}<section class="card route-card"><h2>${state.screen==="/settings"?"Settings · Channels":"기존 Marketing Hub 메뉴"}</h2><p>${state.screen==="/settings"?"Channels 탭에서 발행 계정을 연결하면 저장한 초안으로 돌아와 Publish할 수 있어요.":"이 프로토타입은 OSMU Studio 작업에 집중합니다. 기존 경로와 명칭은 그대로 유지됩니다."}</p><button class="btn primary" data-nav="/studio">OSMU Studio로 돌아가기</button></section>`}
    function esc(s){return String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}
    function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
    function toast(msg){state.toast=msg;render();setTimeout(()=>{if(state.toast===msg){state.toast="";render()}},1300)}
    function render(){document.getElementById("app").innerHTML=`<div class="shell">${sidebar()}<main class="main"><div class="content">${state.screen==="studio"?studio():route()}</div></main></div>${state.toast?`<div class="toast">${state.toast}</div>`:""}`}
    function mutateOnly(id,fn){const before=Object.fromEntries(PLATFORM_DEFS.filter(p=>p.id!==id).map(p=>[p.id,cardSnapshot(state.cards[p.id])]));fn(state.cards[id]);const stable=PLATFORM_DEFS.filter(p=>p.id!==id).every(p=>before[p.id]===cardSnapshot(state.cards[p.id]));window.OSMU.lastIsolation={target:id,other7Stable:stable,before,after:Object.fromEntries(PLATFORM_DEFS.filter(p=>p.id!==id).map(p=>[p.id,cardSnapshot(state.cards[p.id])]))}}
    function completePublish(id){mutateOnly(id,c=>{if(id==="x"){c.publish="failed";c.updated="방금"}else if(id==="instagram"){c.publish="repair";c.updated="방금"}else{c.publish="published";c.updated="방금";c.permalink=`https://social.example/${id}/posts/8f4c2a91`}});state.loadingPlatform=null;render()}
    document.addEventListener("input",e=>{if(e.target.matches("[data-source]")){state.source=e.target.value;render()}if(e.target.matches("[data-draft]")){const id=e.target.dataset.draft;mutateOnly(id,c=>{c.draft=e.target.value;c.generation=c.draft.trim()?"nonempty":"empty";c.saved=false});render()}});
    document.addEventListener("change",e=>{if(e.target.matches("[data-bulk-select]")){const id=e.target.dataset.bulkSelect;e.target.checked?state.bulkSelected.add(id):state.bulkSelected.delete(id);state.bulkReview=false;render()}});
    document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;
      if(b.dataset.nav){state.screen=b.dataset.nav==="/studio"?"studio":b.dataset.nav;state.recoveryOpen=false;render();return}
      if(b.hasAttribute("data-generate")){state.generating=true;render();setTimeout(()=>{newCards();state.generated=true;state.generating=false;state.focus="threads";render()},650);return}
      if(b.dataset.tab){state.focus=b.dataset.tab;render();document.getElementById(`card-${b.dataset.tab}`)?.scrollIntoView({behavior:"smooth",block:"center"});return}
      if(b.dataset.edit){const id=b.dataset.edit;mutateOnly(id,c=>c.editing=!c.editing);state.focus=id;render();return}
      if(b.dataset.save){const id=b.dataset.save;mutateOnly(id,c=>{c.saved=true;c.updated="방금";c.editing=false});toast(`${state.cards[id].name} 초안을 저장했어요`);return}
      if(b.dataset.regenerate){const id=b.dataset.regenerate;mutateOnly(id,c=>{c.generation="nonempty";c.draft="자동화는 시작보다 복구가 먼저입니다. 실패했을 때 돌아올 지점을 정해야 팀이 안심하고 확장할 수 있어요.";c.saved=false});toast(`${state.cards[id].name} 카드만 다시 만들었어요`);return}
      if(b.dataset.publish){const id=b.dataset.publish;state.loadingPlatform=id;mutateOnly(id,c=>c.publish="publishing");render();setTimeout(()=>completePublish(id),700);return}
      if(b.dataset.retry){const id=b.dataset.retry;state.loadingPlatform=id;mutateOnly(id,c=>c.publish="publishing");render();setTimeout(()=>{mutateOnly(id,c=>{c.publish="published";c.permalink=`https://social.example/${id}/posts/9a62df30`;c.updated="방금"});state.loadingPlatform=null;render()},700);return}
      if(b.dataset.repair){const id=b.dataset.repair;mutateOnly(id,c=>{c.publish="published";c.permalink=`https://social.example/${id}/posts/31b760ac`;c.updated="방금"});toast("기존 게시물의 결과 기록만 복구했어요");return}
      if(b.dataset.checkResult){const id=b.dataset.checkResult;mutateOnly(id,c=>{c.publish="published";c.permalink=`https://social.example/${id}/posts/4f19c27d`;c.updated="방금"});toast("기존 발행 결과를 확인했어요");return}
      if(b.dataset.connect){state.screen="/settings";render();return}
      if(b.hasAttribute("data-recovery-open")){state.recoveryOpen=true;render();return}if(b.hasAttribute("data-recovery-close")){state.recoveryOpen=false;render();return}
      if(b.dataset.demo){const map={failed:"x",repair:"instagram",unknown:"threads"},id=map[b.dataset.demo];mutateOnly(id,c=>c.publish=b.dataset.demo);state.focus=id;state.recoveryOpen=false;render();document.getElementById(`card-${id}`)?.scrollIntoView({block:"center"});return}
      if(b.hasAttribute("data-new-source")){state.generated=false;state.source="";state.cards={};state.bulkOpen=false;render();return}
      if(b.hasAttribute("data-bulk-toggle")){state.bulkOpen=!state.bulkOpen;state.bulkReview=false;render();return}
      if(b.hasAttribute("data-bulk-review")){state.bulkReview=true;render();return}
      if(b.hasAttribute("data-bulk-cancel")){state.bulkOpen=false;state.bulkReview=false;state.bulkSelected.clear();render();return}
      if(b.hasAttribute("data-bulk-confirm")){toast(`선택한 ${state.bulkSelected.size}개를 확인했습니다`);state.bulkReview=false;return}
      if(b.hasAttribute("data-open-post")){toast("실제 게시물 링크를 엽니다");return}
      if(b.hasAttribute("data-tone")){toast("브랜드 톤을 선택했어요");return}if(b.hasAttribute("data-image")){toast("이미지 선택은 선택 사항입니다");return}
    });
    newCards();window.OSMU={state,render,newCards,cardSnapshot,hash,completePublish};render();
  </script>
