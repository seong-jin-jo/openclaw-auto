    function enhanceControlNames(){
      Array.prototype.forEach.call(document.querySelectorAll('input,select,textarea'),function(el){

        var parentLabel=el.closest('label'),field=el.closest('.field'),label=parentLabel||field&&field.querySelector('.label');

    function interactionHandler(el){
      var a=el.getAttribute('data-action');if(a)return ACTION_CONTRACTS[a]||a.indexOf('platform-')===0||a.indexOf('account-')===0||a.indexOf('shared-ai-')===0?'action:'+a:'';
      var recovery=el.getAttribute('data-recovery-action');if(recovery){var p=recovery.split('-'),owner=p.shift(),s=p.join('-');return RECOVERY_OWNERS[owner]&&RECOVERY_STATES[s]?'recovery:'+recovery:'';}
      var keys=['route','osmuRoute','viewportControl','journeyStep','studioStep','source','variant','bulkToggle','resultSelect','previewPlatform','directPlatform','settingsTab','adminTab','videoPhase','videoState','platformTab','surfaceTab','platformAnalyticsTab','platformFormat','model','variantModel'];

      if(['qa-role','qa-state','qa-theme','qa-hide','qa-restore'].indexOf(el.id)>=0)return 'direct-listener:'+el.id;

    function controlName(el){

    function collectCustomerLanguageAudit(){
      if(state.role!=='customer')return {role:state.role,surfaceCount:0,rawIdentifierHits:[],implementationJargonHits:[],pass:true};
      var root=document.getElementById('root');
      var visible=[root?root.textContent:''];
      Array.prototype.forEach.call(root?root.querySelectorAll('input,select,textarea,[aria-label],[title],[alt]'):[],function(el){
        visible.push(el.value||'',el.getAttribute('aria-label')||'',el.getAttribute('title')||'',el.getAttribute('alt')||'');
      });
      var text=visible.join('\n');
      var raw=text.match(/\b(?:cmp|cnt|rev|pub|ext|exp)_[A-Za-z0-9_-]+\b/g)||[];
      var jargonTerms=['campaign_id','content_id','revision_id','publish_attempt_id','external_result_id','experiment_id','data-owner','data-lineage','fixture','manifest','JSDOM','Header7','Settings8','Admin9','preview7','direct4'];
      var jargon=jargonTerms.filter(function(term){return text.indexOf(term)>=0;});

    }

      var failures=controls.filter(function(x){return !x.accessibleNamePass||!x.nonGenericHandlerPass||!x.target44Pass;});

      var inspectorNodes=Array.prototype.slice.call(document.querySelectorAll('[data-prototype-inspector]'));
      var inspectorVisibleCount=inspectorNodes.filter(function(el){var cs=getComputedStyle(el),r=el.getBoundingClientRect();return !el.hidden&&cs.display!=='none'&&cs.visibility!=='hidden'&&(r.width>0||r.height>0);}).length;
      var inspectorDefaultPass=!inspectorOptIn?inspectorVisibleCount===0:true;
      return {version:'v19-fidelity',role:state.role,theme:state.theme,viewport:viewportMode(),controls:controls,failures:failures,customerLanguage:language,inspectorOptIn:inspectorOptIn,inspectorVisibleCount:inspectorVisibleCount,inspectorDefaultPass:inspectorDefaultPass,pass:failures.length===0&&language.pass&&inspectorDefaultPass,contrastTokens:CONTRAST_TOKENS,contrastMinimum:4.5,mobileVideoScrollHintCount:document.querySelectorAll('.scroll-hint').length};
