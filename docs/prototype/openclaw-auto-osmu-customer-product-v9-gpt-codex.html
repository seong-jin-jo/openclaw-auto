x;border:1px solid var(--border);border-radius:8px;resize:vertical}.draft-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.review-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:66px;padding:10px 0;border-bottom:1px solid var(--border)}.review-row:last-child{border-bottom:0}.review-check{display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--border);border-radius:7px;color:var(--subtle);background:var(--surface)}.review-check.checked{color:#fff;border-color:var(--success);background:var(--success)}.notice{display:flex;gap:10px;margin-bottom:16px;padding:12px 14px;border:1px solid #bfdbfe;border-radius:10px;color:#1e3a8a;background:var(--accentSoft)}.notice.warning{color:#78350f;border-color:#fde68a;background:var(--warningSoft)}.notice.danger{color:#7f1d1d;border-color:#fecaca;background:var(--dangerSoft)}.loading{display:grid;place-items:center;min-height:330px;text-align:center}.spinner{width:42px;height:42px;margin-bottom:16px;border:4px solid #dbeafe;border-top-color:var(--accent);border-radius:999px;animation:spin .8s linear infinite}.progress{height:8px;overflow:hidden;border-radius:999px;background:var(--surface2)}.progress span{display:block;height:100%;border-radius:inherit;background:var(--accent)}.support{display:grid;gap:8px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:5px 9px;border:1px solid var(--border);border-radius:999px;color:var(--muted);background:var(--surface);font-size:12px}.toast{position:fixed;right:18px;bottom:18px;z-index:50;max-width:360px;padding:12px 14px;border-radius:10px;color:#fff;background:#18181b;box-shadow:var(--shadow);opacity:0;transform:translateY(16px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}.footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--border);color:var(--subtle);font-size:11px}.footer a{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;color:var(--accent)}@keyframes spin{to{transform:rotate(360deg)}}

<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Marketing Hub 메뉴">
      <div class="brand"><div class="brand-row"><span class="logo" aria-hidden="true"></span>Marketing Hub</div><div class="workspace">OpenClaw 워크스페이스</div></div>
      <nav id="nav" class="sidebar-nav"></nav>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const navSections=[
      ["Overview",[["성과","home"],["OSMU Studio","home"],["승인 인박스","route"],["발행 캘린더","route"]]],
      ["Social",[["Threads","route"],["X (Twitter)","settings"],["Instagram","route"],["Facebook","route"],["Bluesky","route"]]],
      ["Messaging",[["Telegram","route"],["Discord","route"],["Slack","route"]]],
      ["Video",[["YouTube","settings"],["TikTok","settings"]]],
      ["Data & Analytics",[["Blog Performance","route"],["Search Console","route"],["Google Analytics","route"]]],
      ["Keyword Research",[["Keyword Planner","route"],["Search Advisor","route"],["Naver Trends","route"],["Google Trends","route"]]],
      ["Custom Integration",[["Blog","route"]]],["Assets & Tools",[["Images","route"],["Videos","settings"],["Midjourney","route"]]],["System",[["Settings","settings"]]]
    ];
    const state={screen:"home",sourceTab:"write",selected:{threads:false,instagram:false,x:false},xReady:true,edit:{threads:false,instagram:false,x:false},checks:[false,false,false,false],schedule:false,recovery:"wrong"};
    const drafts={threads:"자동화는 시작보다 복구 지점이 먼저입니다. 반복 업무를 줄이기 전에 실패했을 때 어디로 돌아올지 정해두세요. 자세히 보기 →",instagram:"자동화 전에 먼저 정할 것: 실패했을 때 돌아올 지점.\n\n반복 업무를 줄이는 것보다 안전하게 되돌리는 구조가 먼저입니다.\n\n#업무자동화 #팀운영 #생산성",x:"자동화는 시작보다 복구 지점이 먼저다. 반복 업무를 줄이기 전에 실패했을 때 어디로 돌아올지 정해두자."};
    function nav(){document.getElementById("nav").innerHTML=navSections.map(([t,items])=>`<div class="nav-group"><div class="nav-title">${t}</div>${items.map(([x,g],i)=>`<button class="nav-item ${state.screen===g&&g!=="route"?"active":""}" data-nav data-go="${g}"><span class="nav-dot"></span>${x}${x==="OSMU Studio"?`<span class="new">NEW</span>`:""}</button>`).join("")}</div>`).join("")}
    function footer(){return ""}
    function header(k,t,d,b=""){return `<div class="header"><div><p class="eyebrow">${k}</p><h1>${t}</h1><p class="lede">${d}</p></div>${b?`<span class="badge accent">${b}</span>`:""}</div>`}
    function stepper(n){const xs=["원문","계정","초안","검수","발행"];return `<div class="stepper">${xs.map((x,i)=>`<span class="step-pill ${i+1===n?"active":i+1<n?"done":""}">${i+1<n?"✓":i+1} ${x}</span>`).join("")}</div>`}
    function home(){return `<section class="hero"><div><p class="eyebrow">OSMU Studio</p><h1>원문 하나로 세 채널 발행을 끝내세요</h1><p class="lede">Threads, Instagram Feed, X에 맞춘 초안을 만들고 직접 검수해 계정마다 한 번씩 발행합니다. 결과도 한곳에서 확인하세요.</p><div class="actions"><button class="btn primary" data-go="source">새 OSMU 작업</button><button class="btn" data-go="results">최근 결과 보기</button></div></div><div class="hero-steps"><div class="hero-step"><span class="step-num">1</span><div><strong>원문 하나</strong><div class="meta">직접 쓰거나 가져오기</div></div></div><div class="hero-step"><span class="step-num">3</span><div><strong>채널별 초안</strong><div class="meta">각 채널에 맞게 직접 수정</div></div></div><div class="hero-step"><span class="step-num">✓</span><div><strong>한곳에서 결과</strong><div class="meta">성공과 실패를 계정별 확인</div></div></div></div></section><div class="grid two" style="margin-top:18px"><section class="card"><div class="head"><div><h2>최근 작업</h2><p class="meta">팀 운영 자동화 체크리스트</p></div><span class="badge success">2개 발행됨</span></div><div class="row"><div><div class="row-title">Threads · Instagram Feed</div><div class="row-sub">8월 4일 오후 3:20</div></div><button class="btn" data-go="results">결과 보기</button></div></section><section class="card soft"><h2>처음이신가요?</h2><p class="lede">원문만 준비하면 채널별 초안을 만든 뒤 발행 전에 모두 확인할 수 있어요.</p><div class="actions"><button class="btn" data-go="source">예시로 시작</button></div></section></div>`+footer()}
    function source(){return stepper(1)+header("1. 원문","무엇을 알리고 싶나요?","원문을 직접 쓰거나 URL, 문서, 텍스트로 가져오세요.","자동 저장됨")+`<div class="tabs"><button class="tab ${state.sourceTab==="write"?"active":""}" data-source="write">직접 작성</button><button class="tab ${state.sourceTab==="import"?"active":""}" data-source="import">가져오기</button></div>${state.sourceTab==="write"?`<section class="card"><div class="field"><label>제목</label><input class="input" value="팀 운영 자동화 체크리스트" aria-label="제목"></div><div class="field"><label>원문</label><textarea class="input" aria-label="원문">반복 업무를 자동화하기 전에 실패했을 때 돌아올 지점을 먼저 정해야 합니다. 팀이 안심하고 자동화를 쓸 수 있는 가장 작은 체크리스트를 공유합니다.</textarea><div class="counter">84자</div></div><div class="field"><label>핵심 메시지</label><input class="input" value="자동화는 시작보다 복구 지점이 먼저다" aria-label="핵심 메시지"></div><div class="grid two"><div class="field"><label>링크 · 선택</label><input class="input" value="" placeholder="선택 사항" aria-label="링크"></div><div class="field"><label>이미지 · 선택</label><button class="btn" data-action="image">이미지 선택</button></div></div></section>`:`<section class="card"><div class="tabs"><button class="tab active">URL</button><button class="tab">문서</button><button class="tab">붙여넣기</button></div><div class="field"><label>가져올 URL</label><input class="input" placeholder="https://" aria-label="가져올 URL"></div><button class="btn primary" data-action="import">원문 가져오기</button></section>`}<div class="actions"><button class="btn" data-go="home">홈으로</button><button class="btn primary" data-go="accounts">계정 선택으로</button></div>`+footer()}
    function accountRow(key,name,platform){const selected=state.selected[key];const blocked=key==="x"&&!state.xReady;return `<div class="row"><span class="check ${selected&&!blocked?"":"off"}">${selected&&!blocked?"✓":""}</span><div class="row-main"><div class="row-title">${name}</div><div class="row-sub">${platform} · ${blocked?"발행 준비가 필요해요":"준비됨"}</div></div>${blocked?`<button class="btn" data-go="settings">설정에서 확인</button>`:`<button class="btn" data-account="${key}">${selected?"선택됨":"선택"}</button>`}</div>`}
    function accounts(){const count=Object.entries(state.selected).filter(([k,v])=>v&&!(k==="x"&&!state.xReady)).length;return stepper(2)+header("2. 계정","어느 계정에 발행할까요?","계정명을 확인하고 발행할 채널을 선택하세요.",`${count}개 선택`)+`<section class="card">${accountRow("threads","@openclaw_lab","Threads")}${accountRow("instagram","@openclaw.official","Instagram Feed")}${accountRow("x","@openclaw_ops","X")}</section>${!state.xReady?`<div class="notice warning" style="margin-top:16px"><strong>X 발행 준비가 필요해요.</strong><span>X를 제외하고 계속하거나 Settings에서 연결을 확인하세요.</span></div>`:""}<div class="actions"><button class="btn" data-go="source">원문으로</button><button class="btn" data-action="wrong">계정이 다른가요?</button><button class="btn primary" data-generate ${count===0?"disabled":""}>${count}개 초안 만들기</button></div>`+footer()}
    function generating(){return stepper(3)+`<section class="card loading"><div><div class="spinner" aria-hidden="true"></div><h2>세 채널 초안을 만들고 있어요</h2><p class="lede">원문의 핵심 메시지는 그대로 두고 채널 문법에 맞춥니다.</p><div class="progress" style="margin-top:18px"><span style="width:68%"></span></div><p class="meta" style="margin-top:10px">다른 화면으로 이동해도 계속 만들어요</p></div></section><div class="actions"><button class="btn" data-go="home">홈으로</button><button class="btn primary" data-go="drafts">초안 바로 보기</button></div>`+footer()}
    function draftCard(key,title,desc){const edited=state.edit[key];return `<section class="card draft"><div class="draft-top"><div><h2>${title}</h2><p class="meta">${desc}</p></div><span class="badge ${edited?"success":"accent"}">${edited?"수정됨":"초안"}</span></div><textarea aria-label="${title} 초안" data-draft="${key}">${drafts[key]}</textarea><div class="actions"><button class="btn" data-edit="${key}">${edited?"수정 완료":"수정"}</button><button class="btn" data-action="preview">미리보기</button><button class="btn" data-action="reset">원문으로 되돌리기</button></div></section>`}
    function draftsView(){return stepper(3)+header("3. 채널별 초안","세 채널에 맞춘 초안을 확인하세요","한 채널을 수정해도 다른 초안은 바뀌지 않아요.","초안 3개")+`<div class="notice"><strong>원문 핵심:</strong><span>자동화는 시작보다 복구 지점이 먼저다</span></div><div class="grid three">${draftCard("threads","Threads","대화형 첫 문장 · 링크")}${draftCard("instagram","Instagram Feed","캡션 · 해시태그 · 4:5 이미지")}${draftCard("x","X",drafts.x.length+"/280자 · 핵심 한 문장")}</div><div class="actions"><button class="btn" data-go="accounts">계정으로</button><button class="btn primary" data-go="review">최종 검수로</button></div>`+footer()}
    function review(){const labels=[["계정","@openclaw_lab · @openclaw.official · @openclaw_ops"],["내용","초안 3개 · 이미지 1개"],["공개 정보","링크 2개 · 태그 4개 · 민감 정보 없음"],["시간",state.schedule?"8월 7일 오전 9시 · KST":"지금 발행"]];const all=state.checks.every(Boolean);return stepper(4)+header("4. 최종 검수","발행 전 마지막으로 확인해 주세요","계정, 내용, 공개 정보, 시간을 확인하면 발행할 수 있어요.",`${state.checks.filter(Boolean).length}/4 확인`)+`<section class="card">${labels.map(([t,d],i)=>`<div class="review-row"><button class="review-check ${state.checks[i]?"checked":""}" data-check="${i}" aria-label="${t} 확인">${state.checks[i]?"✓":""}</button><div><div class="row-title">${t}</div><div class="row-sub">${d}</div></div><button class="btn" data-action="change">수정</button></div>`).join("")}</section><section class="card soft" style="margin-top:16px"><div class="tabs"><button class="tab ${!state.schedule?"active":""}" data-time="now">지금 발행</button><button class="tab ${state.schedule?"active":""}" data-time="schedule">예약</button></div>${state.schedule?`<div class="grid two"><div class="field"><label>날짜</label><input class="input" value="2026-08-07"></div><div class="field"><label>시간 · KST</label><input class="input" value="09:00"></div></div>`:`<p>검수를 마치면 바로 3개 계정에 발행합니다.</p>`}</section><div class="actions"><button class="btn" data-go="drafts">초안으로</button><button class="btn primary" data-publish ${all?"":"disabled"}>${state.schedule?"3개 계정 예약하기":"3개 계정에 지금 발행"}</button></div>`+footer()}
    function progress(){return stepper(5)+header("5. 발행","3개 계정에 발행하고 있어요","이 화면을 닫아도 결과에서 이어서 확인할 수 있어요.","진행 중")+`<section class="card"><div class="loading" style="min-height:120px"><div><div class="spinner"></div><p class="meta">중복 요청을 막고 계정별 결과를 확인합니다</p></div></div><div class="row"><div><div class="row-title">@openclaw_lab · Threads</div><div class="row-sub">처리 중</div></div><span class="badge warning">처리 중</span></div><div class="row"><div><div class="row-title">@openclaw.official · Instagram Feed</div><div class="row-sub">게시물 확인 완료</div></div><span class="badge success">발행됨</span></div><div class="row"><div><div class="row-title">@openclaw_ops · X</div><div class="row-sub">대기</div></div><span class="badge">대기</span></div><div class="actions"><button class="btn" data-action="duplicate">발행 버튼 다시 누르기</button><button class="btn primary" data-go="results">결과 화면에서 보기</button></div></section>`+footer()}
    function results(){return header("발행 결과","3개 계정에 발행됐어요","계정별 실제 게시물과 처리 시각을 한곳에서 확인하세요.","3/3 발행됨")+`<section class="card"><div class="row"><span class="check">✓</span><div class="row-main"><div class="row-title">@openclaw_lab · Threads</div><div class="row-sub">8월 5일 오전 5:31 발행</div></div><button class="btn" data-action="open-post">게시물 보기</button></div><div class="row"><span class="check">✓</span><div class="row-main"><div class="row-title">@openclaw.official · Instagram Feed</div><div class="row-sub">8월 5일 오전 5:31 발행</div></div><button class="btn" data-action="open-post">게시물 보기</button></div><div class="row"><span class="check">✓</span><div class="row-main"><div class="row-title">@openclaw_ops · X</div><div class="row-sub">8월 5일 오전 5:32 발행</div></div><button class="btn" data-action="open-post">게시물 보기</button></div></section><div class="actions"><button class="btn primary" data-go="source">새 OSMU 작업</button><button class="btn" data-action="calendar">발행 캘린더</button><button class="btn" data-go="recovery">발행 문제 해결</button><button class="btn" data-go="home">홈</button></div>`+footer()}
    function recovery(){const r=state.recovery;const blocks={wrong:["선택한 계정과 연결된 계정이 달라요","선택 @openclaw_ops · 연결 @personal_sj","다시 연결"],x:["X 발행 준비가 필요해요","권한과 연결 상태를 확인해 주세요","설정에서 확인"],duplicate:["같은 발행 요청을 이미 처리하고 있어요","새 발행을 만들지 않았습니다","진행 보기"],timeout:["게시 여부를 확인하고 있어요","다음 자동 확인: 오전 5:35","결과 보기"],partial:["3개 중 2개 발행, 1개 확인 필요","성공한 2개는 그대로 유지됩니다","실패한 X만 다시 시도"],expired:["X 연결이 만료됐어요","다시 연결한 뒤 X만 이어서 발행할 수 있어요","다시 연결"]};const [t,d,a]=blocks[r];return header("문제 해결",t,d,"복구 가능")+`<div class="tabs">${[["wrong","계정 다름"],["x","X 준비"],["duplicate","중복 요청"],["timeout","확인 중"],["partial","부분 성공"],["expired","연결 만료"]].map(([k,x])=>`<button class="tab ${r===k?"active":""}" data-recovery="${k}">${x}</button>`).join("")}</div><section class="card ${r==="partial"?"warning":"danger"}"><div class="head"><h2>${t}</h2><span class="badge ${r==="partial"?"warning":"danger"}">${r==="partial"?"2/3":"확인 필요"}</span></div><p>${d}</p>${r==="partial"?`<div class="row"><div><div class="row-title">Threads · Instagram Feed</div><div class="row-sub">발행됨 · 다시 시도하지 않음</div></div><span class="badge success">유지</span></div><div class="row"><div><div class="row-title">X</div><div class="row-sub">연결 만료</div></div><span class="badge danger">실패</span></div>`:""}<div class="actions"><button class="btn primary" data-action="recover">${a}</button><button class="btn" data-go="results">결과로</button><button class="btn" data-go="home">홈</button></div></section>`+footer()}
    function settings(){return header("Settings","채널 연결과 지원 범위","Threads, Instagram Feed, X 연결을 확인하세요.","3개 채널")+`<div class="grid two"><section class="card"><div class="head"><h2>지원 채널</h2><span class="badge success">사용 가능</span></div>${["Threads · @openclaw_lab","Instagram Feed · @openclaw.official","X · @openclaw_ops"].map(x=>`<div class="row"><div class="row-title">${x}</div><span class="badge success">연결됨</span></div>`).join("")}<div class="actions"><button class="btn" data-x-ready>${state.xReady?"X 준비 문제 보기":"X 연결 확인 완료"}</button><button class="btn" data-go="accounts">계정 선택으로</button></div></section><section class="card soft"><div class="head"><h2>추후 지원</h2><span class="badge">준비 중</span></div><p class="meta">안정적인 발행을 위해 순차적으로 지원합니다.</p><div class="support" style="margin-top:14px"><strong>영상</strong>${chips(["YouTube","TikTok","Reels"])}<strong style="margin-top:10px">추가 채널</strong>${chips(["Facebook","Bluesky","Telegram","Discord","Slack 외"])}</div></section></div>`+footer()}
    function chips(xs){return `<div class="chips">${xs.map(x=>`<span class="chip">${x}</span>`).join("")}</div>`}
    function route(){return header("Marketing Hub","이 메뉴는 그대로 사용할 수 있어요","OSMU 작업은 Studio에서 시작하고 다른 도구는 원래 위치에서 이어집니다.")+`<section class="card"><div class="actions"><button class="btn primary" data-go="home">OSMU 홈</button><button class="btn" data-go="source">새 작업</button></div></section>`+footer()}
    function render(){nav();const views={home,source,accounts,generating,drafts:draftsView,review,progress,results,recovery,settings,route};const main=document.getElementById("main");main.innerHTML=(views[state.screen]||home)();main.focus({preventScroll:true});document.title=`Marketing Hub · ${state.screen}`}
    function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>el.classList.remove("show"),2400)}
    document.addEventListener("click",e=>{const x=e.target.closest("button,a");if(!x)return;if(x.dataset.go){state.screen=x.dataset.go;render();return}if(x.dataset.source){state.sourceTab=x.dataset.source;render();return}if(x.dataset.account){state.selected[x.dataset.account]=!state.selected[x.dataset.account];render();return}if(x.hasAttribute("data-generate")){state.screen="generating";render();setTimeout(()=>{if(state.screen==="generating"){state.screen="drafts";render()}},900);return}if(x.dataset.edit){state.edit[x.dataset.edit]=!state.edit[x.dataset.edit];render();return}if(x.dataset.check!==undefined){state.checks[Number(x.dataset.check)]=!state.checks[Number(x.dataset.check)];render();return}if(x.dataset.time){state.schedule=x.dataset.time==="schedule";render();return}if(x.hasAttribute("data-publish")){state.screen="progress";render();return}if(x.dataset.recovery){state.recovery=x.dataset.recovery;render();return}if(x.hasAttribute("data-x-ready")){state.xReady=!state.xReady;toast(state.xReady?"X 연결 확인이 끝났어요":"X 발행 준비가 필요해요");render();return}if(x.dataset.action==="wrong"){state.recovery="wrong";state.screen="recovery";render();return}const msgs={image:"이미지 1개를 선택했어요",import:"원문을 가져왔어요",preview:"채널 미리보기를 열었어요",reset:"이 초안만 원문 기준으로 되돌렸어요",change:"해당 항목을 수정할 수 있어요",duplicate:"같은 발행 요청을 이미 처리하고 있어요","open-post":"실제 게시물 링크를 엽니다",calendar:"발행 캘린더로 이동합니다",recover:"복구를 시작했어요"};if(x.dataset.action)toast(msgs[x.dataset.action]||"처리했어요")});window.OSMU={state,render};render();
  </script>
