    function recoveryView(){const r=state.recovery;const body={wrong:`<section class="card danger"><div class="head"><h2>Wrong account</h2><span class="badge none">TOKEN 0 · PUBLISH 0</span></div><div class="grid two"><div><p class="meta">Expected target sample</p><p class="row-title">@openclaw_ops</p></div><div><p class="meta">Callback target sample</p><p class="row-title">@personal_sj</p></div></div><div class="actions"><button class="btn primary" data-action="reconnect">다시 연결 계약</button><button class="btn" data-go="target">Target preview</button></div></section>`,concurrent:`<section class="card target"><div class="head"><h2>OAuth callback 20</h2><span class="badge target">ATOMIC TARGET</span></div><div class="grid two"><div><div class="stat">1</div><div class="stat-label">accepted</div></div><div><div class="stat">19</div><div class="stat-label">replay rejected</div></div></div><p class="lede">one-time consume primitive는 회수 필요입니다.</p></section>`,x:`<section class="card warning"><div class="head"><h2>X readiness</h2><span class="badge none">FAIL-CLOSE</span></div><p>identity, scope, token lifecycle, real probe가 모두 확인되기 전 dispatch 선택을 닫습니다.</p><div class="actions"><button class="btn" data-action="probe">Probe contract</button><button class="btn" data-go="target">X 제외 preview</button></div></section>`,revoke:`<section class="card danger"><div class="head"><h2>Revoke incident</h2><span class="badge none">NEW SIDE EFFECT 0</span></div><p>검증된 과거 result evidence는 보존하고 새 dispatch를 막습니다.</p><div class="actions"><button class="btn primary" data-action="reconnect">Reconnect contract</button><button class="btn" data-action="incident">Incident evidence</button></div></section>`}[r];return header("TARGET CONTRACT","Account와 OAuth safety","아래 상태는 PRD contract이며 운영 token 또는 account 관찰이 아닙니다.","NOT LIVE","target")+`<div class="tabs"><button class="tab ${r==="wrong"?"active":""}" data-recovery="wrong">Wrong</button><button class="tab ${r==="concurrent"?"active":""}" data-recovery="concurrent">Concurrent20</button><button class="tab ${r==="x"?"active":""}" data-recovery="x">X gate</button><button class="tab ${r==="revoke"?"active":""}" data-recovery="revoke">Revoke</button></div>${body}`+footer()}
    function migrationView(){const m=state.migration;const steps=["M0 Observe","M1 Provenance","M2 Source backfill","M3 Account targets","M4 Result shadow","M5 Dual-read diff","M6 Canary","M7 Expand","M8 Cutover"];return header("TARGET CONTRACT","Migration과 28h safety","운영 authority, migration run, active-minute timer를 관찰했다는 뜻이 아닙니다.","OPERATOR DESIGN","target")+`<div class="tabs"><button class="tab ${m==="m5"?"active":""}" data-migration="m5">M0-M8</button><button class="tab ${m==="1679"?"active":""}" data-migration="1679">1679</button><button class="tab ${m==="1680"?"active":""}" data-migration="1680">1680</button><button class="tab ${m==="1681"?"active":""}" data-migration="1681">1681</button></div>${m==="m5"?`<section class="card target"><div class="head"><h2>TARGET SAMPLE migration</h2><span class="badge warning">M5 MISMATCH 2</span></div><div class="timeline">${steps.map((x,i)=>`<div class="step ${i<5?"done":i===5?"active":""}"><span class="num">${i}</span><div><div class="row-title">${x}</div><div class="row-sub">${i<5?"sample evidence recorded":i===5?"sample diff blocks cutover":"locked"}</div></div><span class="badge ${i<5?"success":i===5?"warning":""}">${i<5?"DONE":i===5?"BLOCKED":"LOCKED"}</span></div>`).join("")}</div><div class="actions"><button class="btn" data-action="diff">Diff contract</button><button class="btn danger" data-action="rollback">Reverse replay</button></div></section>`:`<section class="card ${m==="1681"?"danger":m==="1680"?"target":"warning"}"><div class="stat">${m}</div><h2 style="margin-top:8px">${m==="1679"?"다음 batch 시작 금지":m==="1680"?"Atomic operation 닫기":"Read-only · next side effect 0"}</h2><p class="lede">${m==="1679"?"checkpoint를 미리 준비합니다.":m==="1680"?"commit 또는 rollback 뒤 5필드 checkpoint를 기록합니다.":"provider/API/migration batch/file mutation을 차단합니다."}</p><div class="actions"><button class="btn primary" data-action="checkpoint">Checkpoint contract</button><button class="btn" data-go="prod">Evidence gate</button></div></section>`}`+footer()}
    function appendixView(){return header("LOCAL CODE APPENDIX","로컬 preservation inventory","build orphan을 막기 위한 local code count입니다. 운영 IA와 customer habit의 증거가 아닙니다.","PROD UNVERIFIED","repo")+`<div class="grid two"><section class="card repo"><div class="head"><h2>Local Sidebar 26</h2><span class="badge repo">26/26</span></div>${chips(localSidebar,"data-local-sidebar")}</section><section class="card repo"><div class="head"><h2>Local routes 24</h2><span class="badge repo">24/24</span></div>${chips(localRoutes,"data-local-route")}</section></div><section class="card" style="margin-top:16px"><div class="grid three"><div><div class="stat">5</div><div class="stat-label">Threads local tabs</div></div><div><div class="stat">3</div><div class="stat-label">Instagram local tabs</div></div><div><div class="stat">9</div><div class="stat-label">Settings local tabs</div></div></div><div style="margin-top:14px">${chips(settingsTabs,"data-local-settings-tab")}</div></section><section class="card" style="margin-top:16px"><div class="head"><h2>Provider code inventory</h2><span class="badge repo">LOCAL ONLY</span></div><p class="meta">text8</p>${chips(text8,"data-local-text")}<p class="meta" style="margin-top:12px">direct4</p>${chips(direct4,"data-local-direct")}<p class="meta" style="margin-top:12px">preview7</p>${chips(preview7,"data-local-preview")}<p class="meta" style="margin-top:12px">video3</p>${chips(video3,"data-local-video")}<p class="meta" style="margin-top:12px">extensions15</p>${chips(extensions15,"data-local-extension")}</section>`+footer()}
    function rtmView(){return header("DESIGN QA","PRD AC28 provenance RTM","각 AC를 view/state와 evidence layer에 연결합니다. build/QA 통과 증거가 아닙니다.","28/28 · ORPHAN 0","target")+`<div class="grid three" style="margin-bottom:16px"><div class="card"><div class="stat">28</div><div class="stat-label">mapped</div></div><div class="card"><div class="stat">0</div><div class="stat-label">orphan</div></div><div class="card"><div class="stat">0</div><div class="stat-label">unsupported prod claim</div></div></div><div class="table-wrap"><table><thead><tr><th>AC</th><th>View/state</th><th>Layer</th><th>Open</th></tr></thead><tbody>${acRows.map(([n,x,v])=>`<tr data-ac><td data-label="AC"><strong>AC-${String(n).padStart(2,"0")}</strong></td><td data-label="View/state">${x}</td><td data-label="Layer"><span class="badge ${v==="repo"||v==="appendix"?"repo":v==="prod"?"none":"target"}">${v}</span></td><td data-label="Open"><button class="btn" data-go="${v}">보기</button></td></tr>`).join("")}</tbody></table></div>`+footer()}
    function render(){const layer=layerByScreen[state.screen]||layerByScreen.prod;document.getElementById("strip").innerHTML=`<span class="layer ${layer[0]}" data-layer="${layer[0]}">${layer[1]}</span><span class="strip-text">${layer[2]}</span>`;const views={prod:prodView,repo:repoView,target:targetView,result:resultView,recovery:recoveryView,migration:migrationView,appendix:appendixView,rtm:rtmView};const main=document.getElementById("main");main.innerHTML=(views[state.screen]||prodView)();main.focus({preventScroll:true});document.querySelectorAll(".tool[data-go]").forEach(x=>x.classList.toggle("active",x.dataset.go===state.screen));document.title=`OSMU v8 · ${state.screen}`}
    function toast(msg){const x=document.getElementById("toast");x.textContent=msg;x.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>x.classList.remove("show"),2400)}
    document.addEventListener("click",e=>{const x=e.target.closest("button,a");if(!x)return;if(x.dataset.viewport){document.getElementById("frame").classList.toggle("mobile",x.dataset.viewport==="390");document.querySelectorAll("[data-viewport]").forEach(y=>y.classList.toggle("active",y===x));toast(`${x.dataset.viewport}px QA view`);return}if(x.dataset.go){state.screen=x.dataset.go;render();return}if(x.dataset.target){state.targetState=x.dataset.target;render();return}if(x.dataset.recovery){state.recovery=x.dataset.recovery;render();return}if(x.dataset.migration){state.migration=x.dataset.migration;render();return}const msgs={requirements:"URL, identity, timestamp, 1024/390 observation, deployed revision이 모두 필요합니다.",permalink:"실제 저장된 permalink만 open action을 가질 수 있습니다.",copy:"external ID copy rule을 검토했습니다.",reconcile:"lookup 전 재발행 0, side effect unknown 유지.",reconnect:"새 one-time state를 만드는 target contract입니다.",probe:"real readiness evidence 전 X dispatch 0.",incident:"revoke time, blocked dispatch, preserved evidence contract.",diff:"mismatch 0 전 cutover 0.",rollback:"외부 게시물 재발행 없이 internal mapping만 역재생.",checkpoint:"source/account/result/migration/next action 5필드."};if(x.dataset.action)toast(msgs[x.dataset.action]||"Target contract state")});
    function syncViewport(){const v=innerWidth<=700?"390":"1024";document.querySelectorAll("[data-viewport]").forEach(x=>x.classList.toggle("active",x.dataset.viewport===v))}addEventListener("resize",syncViewport);render();syncViewport();
