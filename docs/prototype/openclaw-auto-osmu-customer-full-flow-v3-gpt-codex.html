<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OSMU 실제 구현 보존형 전체 고객 흐름 v3</title>
  <style>
    :root{--bg:#fbfbfc;--surface:#fff;--surface2:#f4f4f5;--border:#e4e4e7;--text:#18181b;--muted:#52525b;--subtle:#71717a;--accent:#2563eb;--accent2:#eff4ff;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--shadow:0 10px 30px rgba(16,24,40,.08)}
    [data-theme="dark"]{--bg:#0a0a0b;--surface:#161618;--surface2:#1f1f23;--border:#27272a;--text:#f4f4f5;--muted:#a1a1aa;--subtle:#a1a1aa;--accent:#3b82f6;--accent2:#172554;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--shadow:0 12px 32px rgba(0,0,0,.45)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5} button,select,input,textarea{font:inherit} button{min-height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);padding:10px 14px;cursor:pointer;font-weight:700;text-align:left}button:hover,button:focus-visible{border-color:var(--accent);outline:3px solid color-mix(in srgb,var(--accent) 24%,transparent);outline-offset:1px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.quiet{background:transparent}.danger{color:var(--bad)}
    .tools{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:color-mix(in srgb,var(--surface) 94%,transparent);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}.tools strong{margin-right:auto}.tools select{min-height:38px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:6px 28px 6px 10px}.tools button{min-height:38px;padding:6px 10px}
    .viewport{width:min(1024px,calc(100vw - 28px));min-height:760px;margin:18px auto 60px;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);transition:width .2s}.viewport.mobile{width:min(390px,calc(100vw - 20px))}.app{min-height:760px;display:grid;grid-template-columns:220px 1fr}.sidebar{background:var(--surface2);border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;gap:6px}.brand{font-size:17px;font-weight:900;padding:0 10px 16px}.side-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);padding:14px 10px 4px}.side{width:100%;min-height:44px;border:0;background:transparent;padding:8px 10px;font-weight:600}.side.active{background:var(--accent2);color:var(--accent)}.side.logout{margin-top:auto;color:var(--bad)}
    .main{min-width:0}.identity{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:11px 24px;border-bottom:1px solid var(--border);background:var(--surface)}.identity span{color:var(--muted);font-size:12px}.identity b{color:var(--text)}.content{padding:28px;max-width:900px;margin:auto}.crumb{color:var(--subtle);font-size:12px;margin-bottom:8px}.title-row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:22px}.title-row h1{font-size:28px;line-height:1.15;margin:0 0 7px;letter-spacing:-.025em}.title-row p{margin:0;color:var(--muted);max-width:620px}.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;white-space:nowrap}.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.bad{color:var(--bad)}.badge.info{color:var(--accent)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:17px;min-width:0}.card h2,.card h3{margin:0 0 8px;letter-spacing:-.015em}.card h2{font-size:18px}.card h3{font-size:15px}.card p{margin:4px 0;color:var(--muted)}.card .value{font-size:23px;font-weight:900;color:var(--text)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.row strong{display:block}.row small{color:var(--muted)}.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0 20px}.flow span{padding:7px 9px;background:var(--surface2);border-radius:8px;font-size:12px;font-weight:700}.flow i{color:var(--subtle);font-style:normal}.notice{border-left:3px solid var(--accent);background:var(--accent2);padding:14px 16px;border-radius:8px;margin-bottom:16px}.notice.warn{border-left-color:var(--warn)}.notice.bad{border-left-color:var(--bad)}.notice strong{display:block;margin-bottom:3px}.notice p{margin:0;color:var(--muted)}.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--border);margin:-2px 0 18px}.tabs button{border:0;border-radius:0;min-height:40px;background:transparent;white-space:nowrap}.tabs button.active{color:var(--accent);border-bottom:2px solid var(--accent)}.editor{width:100%;min-height:150px;resize:vertical;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);padding:14px}.check{display:flex;gap:10px;align-items:flex-start;margin:9px 0}.check input{margin-top:4px}.support{width:100%;border-collapse:collapse}.support th,.support td{text-align:left;padding:11px;border-bottom:1px solid var(--border);vertical-align:top}.support th{font-size:11px;color:var(--subtle)}.steps{display:grid;gap:8px}.step{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:9px}.step .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:900}.trace{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.external{color:var(--accent);text-decoration:underline;text-underline-offset:3px}.meta{font-size:12px;color:var(--muted)}
    .loading-region{min-height:112px;border-radius:10px;background:linear-gradient(90deg,var(--surface2) 25%,color-mix(in srgb,var(--surface2) 62%,var(--surface)) 45%,var(--surface2) 65%);background-size:300% 100%;animation:shimmer 1.3s infinite}@keyframes shimmer{to{background-position:-120% 0}}.statebox{margin-bottom:18px}.statebox .actions{margin-top:10px}.route-pill{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--subtle);font-size:11px}.login-shell{min-height:760px;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at top,var(--accent2),transparent 42%),var(--bg)}.login-card{width:min(420px,100%);padding:28px;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}.login-card h1{font-size:28px;margin:0 0 8px}.login-card p{color:var(--muted)}.login-card button{width:100%;text-align:center;margin-top:12px}
    .mobile .app{display:block}.mobile .sidebar{position:relative;border-right:0;border-bottom:1px solid var(--border);padding:10px;display:flex;flex-direction:row;overflow:auto}.mobile .brand,.mobile .side-label{display:none}.mobile .side{width:auto;white-space:nowrap;flex:0 0 auto}.mobile .side:nth-of-type(n+7):not(.logout){display:none}.mobile .side.logout{margin:0}.mobile .identity{padding:10px 16px;gap:7px;display:grid;grid-template-columns:1fr}.mobile .content{padding:20px 16px}.mobile .title-row{display:block}.mobile .title-row h1{font-size:24px}.mobile .title-row>.badge{margin-top:12px}.mobile .grid,.mobile .grid.three{grid-template-columns:1fr}.mobile .actions{flex-direction:column}.mobile .actions button{width:100%}.mobile .support{display:block;overflow-x:auto}.mobile .flow{overflow:auto;flex-wrap:nowrap}.mobile .flow span{white-space:nowrap}.mobile .row{align-items:flex-start}.mobile .tools{position:static}
    @media(max-width:650px){.tools strong{width:100%;margin:0}.tools select{flex:1;min-width:130px}}
  </style>
</head>
<body>
  <header class="tools" aria-label="프로토타입 도구">
    <strong>OSMU 고객 전체 흐름 v3</strong>
    <label>화면 <select id="viewSelect"></select></label>
    <label>상태 <select id="stateSelect"></select></label>
    <button data-action="viewport">390 / 1024</button>
    <button data-action="theme">Light / Dark</button>
  </header>
  <div id="viewport" class="viewport"><div id="root"></div></div>
  <script>
    const views=[
      ['login','로그인','/login'],['workspace','작업공간 확인','/'],['onboarding','온보딩','/'],['home','홈','/'],['content','내 브랜드 정보','/studio'],['studio','플랫폼별 초안','/studio'],['channels','채널 지도','/channels/[channel]'],['threads','Threads','/channels/threads'],['instagram','Instagram','/channels/instagram'],['accountSwitch','계정 전환','/channels/threads'],['review','발행 전 확인','/studio'],['delivery','지금 발행 또는 예약','/studio'],['queue','Queue','/channels/threads'],['calendar','캘린더','/calendar'],['publishing','게시 중·복구','/studio'],['records','발행 기록','/'],['analytics','분석','/channels/threads'],['globalSettings','전역 설정','/settings'],['channelSettings','채널 설정','/channels/instagram'],['supportMap','지원 기능','/settings'],['logout','로그아웃·재로그인','/login']
    ];
    const states=[['default','기본'],['loading','로딩'],['empty','빈 상태'],['oauth-checking','연결 확인 중'],['oauth-failed','연결 실패'],['reconnect','재연결 필요'],['wrong-account','계정 불일치'],['tenant-mismatch','작업공간 불일치'],['scheduled','예약됨'],['publishing','게시 중'],['502','502 결과 확인'],['partial','부분 성공'],['published','게시됨'],['error','오류']];
    let current='login',state='default',mobile=false;
    const routeOf=id=>views.find(v=>v[0]===id)?.[2]||'/';
    const btn=(label,go,cls='')=>`<button class="${cls}" data-go="${go}">${label}</button>`;
    const action=(label,name,cls='')=>`<button class="${cls}" data-action="${name}">${label}</button>`;
    const badge=(text,type='info')=>`<span class="badge ${type}">${text}</span>`;
    const title=(name,desc,status='')=>`<div class="crumb"><span class="route-pill">${routeOf(current)}</span></div><div class="title-row"><div><h1>${name}</h1><p>${desc}</p></div>${status}</div>`;
    const tabs=(items,active)=>`<div class="tabs">${items.map(x=>`<button class="${x===active?'active':''}" data-action="tab">${x}</button>`).join('')}</div>`;
    const identity=()=>`<div class="identity"><span>로그인 <b>j.the.great.investor</b></span><span>작업공간 <b>J 투자 연구소</b></span><span>게시 대상 <b>${state==='wrong-account'||state==='tenant-mismatch'?'code_zero_to_one':'Threads @j.the.great.investor'}</b> · ${state==='reconnect'?'재연결 필요':state==='wrong-account'||state==='tenant-mismatch'?'계정 불일치':'연결됨'}</span></div>`;
    const sidebar=()=>`<aside class="sidebar"><div class="brand">OSMU 운영</div><div class="side-label">Workspace</div>${[['home','홈'],['studio','Studio'],['records','Inbox'],['calendar','Calendar']].map(x=>`<button class="side ${current===x[0]?'active':''}" data-go="${x[0]}">${x[1]}</button>`).join('')}<div class="side-label">Social</div><button class="side ${current==='threads'?'active':''}" data-go="threads">Threads</button><button class="side ${current==='instagram'?'active':''}" data-go="instagram">Instagram</button><div class="side-label">Data & Analytics</div><button class="side" data-go="analytics">Google Analytics</button><button class="side" data-go="analytics">Search Console</button><div class="side-label">Create</div><button class="side" data-go="content">Blog · Images · Videos</button><button class="side" data-go="globalSettings">Settings</button><button class="side logout" data-go="logout">로그아웃</button></aside>`;
    const mismatch=()=>`<div class="notice bad"><strong>계정 불일치로 발행만 잠겼어요</strong><p>로그인 계정 j.the.great.investor · 확인된 게시 계정 code_zero_to_one. 초안과 과거 기록은 계속 사용할 수 있습니다.</p><div class="actions">${btn('계정과 작업공간 다시 확인','accountSwitch','primary')}${btn('발행 기록 보기','records')}</div></div>`;
    function statePanel(){
      if(state==='default')return '';
      const map={
        loading:['업데이트 중','영향받은 영역 하나만 새로 불러옵니다.','loading'],empty:['아직 항목이 없어요','첫 행동을 선택하면 이 화면에서 이어집니다.','empty'],
        'oauth-checking':['연결 확인 중','실제 계정 정보를 확인한 뒤에만 연결됨으로 표시합니다.','checking'],'oauth-failed':['계정을 확인하지 못했어요','초안은 그대로 두고 계정만 다시 확인하세요.','failed'],
        reconnect:['재연결 필요','저장된 계정은 있지만 지금 게시 가능한지 다시 확인해야 합니다.','reconnect'],'wrong-account':['계정 불일치','기대 계정 @j.the.great.investor · 반환 계정 @code_zero_to_one','wrong'],
        'tenant-mismatch':['작업공간과 계정을 확인해 주세요','로그인 j.the.great.investor · 현재 표시 code_zero_to_one','wrong'],scheduled:['2026-08-03 20:00에 예약됐어요','Queue와 Calendar에서 변경할 수 있습니다.','scheduled'],
        publishing:['검수한 글을 게시하고 있어요','같은 글을 다시 보내지 않고 결과를 확인합니다.','publishing'],'502':['발행 결과를 확인하고 있어요','추적 번호 OSMU-20260803-7F2A · 기존 외부 결과를 먼저 조회합니다.','502'],
        partial:['외부 게시물은 확인됐어요','내부 기록을 정리하는 동안 자동 재발행을 막았습니다.','partial'],published:['게시됨','실제 게시물 링크와 대상 계정이 확인됐습니다.','published'],error:['이 영역을 불러오지 못했어요','나머지 화면은 계속 사용할 수 있습니다.','error']
      };
      const [h,p,k]=map[state];
      if(state==='loading')return `<div class="statebox"><div class="loading-region" aria-label="업데이트 중"></div><div class="actions">${btn('다른 작업 계속하기','home')}</div></div>`;
      const acts=k==='502'?btn('기존 발행 결과 확인하기','publishing','primary')+btn('발행 기록 보기','records'):k==='partial'?action('게시물 먼저 열기','external','primary')+btn('기록 상태 다시 확인','records'):k==='published'?action('게시물 열기','external','primary')+btn('분석 보기','analytics'):k==='wrong'?btn('계정 변경 방법 보기','accountSwitch','primary')+btn('기록 보기','records'):k==='reconnect'?btn('채널 다시 연결하기','channelSettings','primary')+btn('초안 보기','studio'):k==='checking'?btn('채널 관리로 돌아가기','channels'):k==='failed'?btn('계정 다시 확인하기','accountSwitch','primary')+btn('Studio로 돌아가기','studio'):k==='scheduled'?btn('Queue에서 보기','queue','primary')+btn('Calendar에서 보기','calendar'):k==='publishing'?btn('발행 기록에서 상태 보기','records'):k==='empty'?btn('첫 원문 만들기','content','primary')+btn('홈으로','home'):btn('실패한 영역 다시 불러오기',current,'primary')+btn('홈으로','home');
      return `<div class="notice ${k==='wrong'||k==='error'||k==='failed'?'bad':k==='reconnect'||k==='502'?'warn':''} statebox"><strong>${h}</strong><p>${p}</p><div class="actions">${acts}</div></div>`;
    }
    const page={
      workspace:()=>`${title('작업공간을 확인해 주세요','로그인 계정과 콘텐츠가 속할 사업체를 함께 확인합니다.',badge('1 / 2','info'))}<div class="card"><div class="row"><div><strong>로그인 계정</strong><small>Google 계정</small></div><b>j.the.great.investor</b></div><div class="row"><div><strong>현재 작업공간</strong><small>콘텐츠·채널·기록이 저장되는 곳</small></div><b>J 투자 연구소</b></div><div class="actions">${btn('이 작업공간에서 계속','onboarding','primary')}${btn('다른 계정으로 로그인','logout')}</div></div>`,
      onboarding:()=>`${title('처음 설정을 같이 해볼게요','업종, 채널, 첫 연결, 내 브랜드 정보를 순서대로 설정합니다.',badge('2 / 4','info'))}<div class="flow"><span>업종</span><i>→</i><span>채널</span><i>→</i><span>첫 연결</span><i>→</i><span>내 브랜드 정보</span></div><div class="grid"><div class="card"><h2>J 투자 연구소</h2><p>투자 교육 · 차분하고 근거 중심</p>${btn('업종과 말투 확인','content','primary')}</div><div class="card"><h2>첫 채널</h2><p>Threads TEXT·IMAGE부터 시작할 수 있어요.</p>${btn('Threads 계정 확인','accountSwitch')}</div></div><div class="actions">${btn('홈에서 둘러보기','home')}${btn('나중에 설정하기','home','quiet')}</div>`,
