    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}button,input{font:inherit}button{cursor:pointer}button,input,a{min-height:44px}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}.sidebar{width:var(--sidebar);height:100vh;position:sticky;top:0;overflow-y:auto;background:#fff;border-right:1px solid var(--border)}.brand{padding:20px 18px 17px;border-bottom:1px solid var(--border)}.brand strong{font-size:17px;display:flex;gap:9px;align-items:center}.brandmark{width:18px;height:18px;position:relative}.brandmark:before,.brandmark:after{content:"";position:absolute;width:12px;height:12px;border-radius:4px}.brandmark:before{left:0;top:0;background:#d4d4d8}.brandmark:after{right:0;bottom:0;background:#2563eb}.brand small{display:block;margin-top:6px;color:#2563eb}.nav{padding:12px 0 30px}.navgroup{margin-top:10px}.navtitle{padding:0 12px 6px;color:#a1a1aa;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.navcount{float:right;font-size:9px;font-weight:500}.navitem{border:0;background:transparent;width:100%;padding:0 16px;display:flex;gap:12px;align-items:center;text-align:left;color:#52525b;min-height:32px}.navitem.active{background:#eff4ff;color:#18181b;border-right:2px solid #2563eb}.navitem .ico{width:16px;text-align:center;color:#a1a1aa}.navitem.active .ico{color:#2563eb}.navitem .new{font-size:9px;color:#2563eb;margin-left:auto}.navitem .pill{font-size:9px;color:white;background:#86b89a;border-radius:9px;padding:2px 6px;margin-left:auto}.main{min-width:0;padding:20px 24px 56px}.toolbar{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:15px}.title{flex:0 0 135px}.title h1{font-size:18px;line-height:22px;margin:4px 0 0}.title p{font-size:10px;color:va lay:flex;align-items:center;gap:9px;padding:0 12px}.ighead .avatar{width:32px;height:32px;flex-basis:32px}.igmedia{height:380px;background:#fff;display:grid;place-items:center;color:var(--subtle)}.igfoot{padding:10px 12px}.igicons{display:flex;gap:18px;font-size:18px}.igicons .right{margin-left:auto}.igcaption{font-size:14px;line-height:1.45;margin-top:8px}.video-card{height:676px;border:1px solid #222;border-radius:16px;background:#000;color:#fff;position:relative;overflow:hidden}.video-empty{position:absolute;inset:0;display:grid;place-items:center;color:#a1a1aa;font-size:12px}.video-top{position:absolute;top:14px;left:14px;right:14px;font-weight:700}.video-rail{position:absolute;right:12px;bottom:88px;display:grid;gap:18px;text-align:center}.video-copy{position:absolute;left:14px;right:54px;bottom:14px;font-size:12px;line-height:1.4}.additive{border:1px dashed #2563eb;border-top:0;border-radius:0 0 9px 9px;background:#f8fbff;padding:9px 10px;min-height:64px}.additive:before{content:"v12 추가 영역";display:block;color:#2563eb;font-size:9px;font-weight:800;letter-spacing:.04em;margin-bottom:6px}.addrow{display:flex;align-items:center;gap:7px}.status{font-size:11px;color:var(--muted);margin-right:auto}.status.processing{color:var(--warning)}.status.published{color:var(--success)}.status.failed{color:var(--danger)}.status.unknown{color:var(--warning)}.mini{height:36px;min-height:36px;border:1px solid var(--border);border-radius:6px;background:#fff;padding:0 10px;font-size:11px}.mini.primary{color:white;background:#2563eb;border-color:#2563eb}.mini.danger{color:#b91c1c;border-color:#fecaca}.permalink{font-size:10px;color:#2563eb;margin-top:7px;overflow-wrap:anywhere}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #bfdbfe;border-top-color:#2563eb;border-radius:50%;animation:spin .65s linear infinite;vertical-align:-2px;margin-right:5px}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;right:22px;bottom:22px;background:#18181b;color:#fff;border-radius:8px;padding:11px 14px;font-size:12px;z-index:10}.baseline .additive{display:none}.baseline .surface{outline:0}.baseline-badge{position:fixed;left:236px;bottom:12px;background:#18181b;color:#fff;padding:5px 8px;border-radius:5px;font-size:10px;z-index:4}.baseline .baseline-badge{display:none}.drawerback{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}.drawer{position:fixed;right:0;top:0;width:min(520px,92vw);height:100vh;background:#fff;border-left:1px solid var(--border);padding:22px;z-index:21}.drawer h2{font-size:17px}.drawer textarea{width:100%;height:180px;border:1px solid var(--border);border-radius:7px;padding:12px;line-height:1.5}.draweractions{display:flex;gap:8px;margin-top:10px}.schedule-panel{border:1px solid #93c5fd;border-radius:8px;padding:12px;margin:0 0 15px}.schedule-panel h3{font-size:13px;margin:0 0 9px}.schedule-panel input{height:40px;border:1px solid var(--border);border-radius:6px;padding:0 8px}.schedule-panel .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.schedule-item{margin-top:8px;padding:8px;background:var(--surface2);font-size:11px;display:flex;gap:8px;align-items:center}.schedule-item span{margin-right:auto}.error-note{padding:8px 10px;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:6px;font-size:11px;margin-bottom:8px}
    .additive .mini{height:44px;min-height:44px;min-width:44px}
    @media(max-width:1100px){.toolbar{gap:8px}.title{flex-basis:128px}.idea{order:3;flex-basis:calc(100% - 220px)}.ai{order:2}.toolbar .btn{order:4}.schedule-break{display:none}.workspace{gap:14px}.history{width:190px;flex-basis:190px}.surface{width:360px;flex-basis:360px}.preview{width:360px}.igmedia{height:360px}.video-card{height:640px}}
    @media(max-width:700px){.shell{display:block}.sidebar{position:relative;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--border);overflow:hidden}.brand{padding:13px 16px}.nav{display:flex;overflow-x:auto;padding:7px 8px;gap:6px}.navgroup{display:contents}.navtitle{display:none}.navitem{width:auto;flex:0 0 auto;min-height:44px;border:1px solid var(--border);border-radius:6px;padding:0 10px}.navitem .ico,.navitem .new,.navitem .pill{display:none}.main{padding:16px}.toolbar{gap:8px}.title{flex:1 0 100%}.idea{order:2;flex:1 0 100%;min-width:100%;height:44px;min-height:44px}.ai{order:1}.toolbar .btn{order:3;flex:1 1 calc(50% - 4px);height:44px;min-height:44px}.schedule-break{display:none}.notice{height:auto;min-height:44px;padding:8px 10px}.workspace{display:block}.history{width:100%;margin-top:18px;position:static}.surface{width:340px;flex-basis:340px}.preview{width:340px}.igmedia{height:340px}.video-card{height:604px}.section{margin-bottom:25px}.baseline-badge{left:12px}.drawer{width:100vw}.mini{height:44px;min-height:44px}.schedule-panel .row{display:grid;grid-template-columns:1fr}.schedule-panel input,.schedule-panel button{width:100%}}

<body>
<div id="app"></div>
<script>
const NAV=[['OVERVIEW',['성과','OSMU Studio','승인 인박스','발행 캘린더']],['SOCIAL',['Threads','X (Twitter)','Instagram','Facebook','Bluesky']],['MESSAGING',['Telegram','Discord','Slack']],['VIDEO',['YouTube','TikTok']],['DATA & ANALYTICS',['Blog Performance','Search Console','Google Analytics']],['KEYWORD RESEARCH',['Keyword Planner','Search Advisor','Naver Trends','Google Trends']],['CUSTOM INTEGRATION',['Blog']],['ASSETS & TOOLS',['Images','Videos','Midjourney']],['SYSTEM',['Settings']]];
const PLATFORMS=[
 {id:'threads',name:'Threads',group:'text',text:'Threads 본문'},
 {id:'x',name:'X',group:'text',text:'X 본문'},
 {id:'facebook',name:'Facebook',group:'text',text:'Facebook 본문'},
 {id:'instagram',name:'Instagram',group:'card',text:'Instagram 본문'},
 {id:'shorts',name:'Shorts',group:'video',text:'Shorts 영상 본문'},
 {id:'reels',name:'Reels',group:'video',text:'Reels 영상 본문'},
 {id:'tiktok',name:'TikTok',group:'video',text:'TikTok 영상 본문'}
];
const query=new URLSearchParams(location.search);const state={generated:query.get('mode')!=='empty',baseline:query.get('baseline')==='1',idea:query.get('mode')==='empty'?'':'기존 화면 기준선',cards:{},drawer:null,toast:'',schedule:false,scheduleError:'',scheduleItem:null,history:query.get('mode')==='empty'?[]:[{title:'자동화 복구 체크리스트',date:'8월 5일 06:20'}]};
function resetCards(){state.cards={};PLATFORMS.forEach(p=>state.cards[p.id]={...p,status:'idle',saved:false,link:'',draft:p.text})}resetCards();
function esc(v){return String(v).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function sidebar(){return `<aside class="sidebar"><div class="brand"><strong><span class="brandmark"></span>Marketing Hub</strong><small>Existing Studio</small></div><nav class="nav">${NAV.map(([g,items])=>`<div class="navgroup"><div class="navtitle">${g}${['SOCIAL','MESSAGING','VIDEO'].includes(g)?`<span class="navcount">0/${items.length}</span>`:''}</div>${items.map(n=>`<button class="navitem ${n==='OSMU Studio'?'active':''}"><span class="ico">${n==='OSMU Studio'?'✣':'○'}</span>${n}${n==='OSMU Studio'?'<span class="new">NEW</span>':n==='승인 인박스'?'<span class="pill">NEW</span>':''}</button>`).join('')}</div>`).join('')}</nav></aside>`}
function toolbar(){return `<div class="toolbar"><div class="title"><h1>OSMU Studio</h1><p>직접 저작 · 생성→즉시 발행/예약</p></div><div class="ai">AI 확인 중</div><input class="idea" value="${esc(state.idea)}" placeholder="글감 / 콘텐츠 주제 입력" data-idea><button class="btn outline" data-brand>🎨 브랜드 설정</button><button class="btn outline" data-wiki>📚 위키</button><button class="btn primary" data-generate>OSMU 생성</button><button class="btn outline" data-auto>✨ AI 자동초안</button>${state.generated?'<button class="btn" data-save>💾 Save</button><button class="btn success" data-bulk>🚀 Publish (4)</button><span class="schedule-break"></span><button class="btn outline schedule-btn" data-schedule>🗓️ 예약</button>':''}</div>`}
function history(){return `<aside class="history"><h2>📜 발행 이력</h2><p>클릭→수정 후 재발행</p>${state.history.length?state.history.map(h=>`<div class="history-row"><b>${h.title}</b><small>${h.date}</small><button class="mini" data-history>불러오기</button></div>`).join(''):'<div class="empty">없음</div>'}</aside>`}
function head(c){const count=c.id==='x'?'4/280':c.id==='instagram'?'12/2200':c.id==='threads'?'10/500':'';const direct=['threads','x','facebook','instagram'].includes(c.id);return `<div class="surface-head"><span class="logo ${c.id}">${c.id==='facebook'?'f':c.id==='instagram'?'◎':c.id==='shorts'?'▶':c.name.slice(0,2)}</span><b>${c.name}</b>${count?`<span class="count">${count}</span>`:''}${direct?'<label class="legacy"><input type="checkbox" checked> 발행</label>':''}</div>`}
function preview(c){if(c.id==='threads')return `<div class="preview threads"><div class="postrow"><span class="avatar"></span><div class="postbody"><div><span class="handle">your_brand</span> <span class="meta">1시간</span><span class="more">•••</span></div><p class="copy">${esc(c.draft)}</p><div class="icons">♡　◯　↻　▷</div><div class="stats">답글 18개 · 좋아요 124개</div></div></div></div>`;if(c.id==='x')return `<div class="preview xcard"><div class="postrow"><span class="avatar"></span><div class="postbody"><div><span class="handle">your_brand</span> <span style="color:#1d9bf0">✓</span> <span class="meta">@your_brand · 1분</span><span class="more">•••</span></div><p class="copy">${esc(c.draft)}</p><div class="xstats"><span>◯ 24</span><span>↻ 57</span><span>♡ 312</span><span>▢</span><span>⌯</span></div></div></div></div>`;if(c.id==='facebook')return `<div class="preview facebook-card"><div class="fbhead"><span class="avatar"></span><div><b>your_brand</b><div class="meta">방금 · 🌐</div></div><span class="more">•••</span></div><div class="fbcopy">${esc(c.draft)}</div><div class="fbstats">👍❤️ 248</div><div class="fbactions"><span>좋아요</span><span>댓글</span><span>공유</span></div></div>`;if(c.id==='instagram')return `<div class="preview instagram-card"><div class="ighead"><span class="avatar"></span><b>your_brand</b><span class="meta">· 팔로우</span><span class="more">•••</span></div><div class="igmedia">카드 생성 대기</div><div class="igfoot"><div class="igicons"><span>♡</span><span>◯</span><span>▷</span><span class="right">▢</span></div><div class="igcaption"><b>좋아요 1,284개</b><br><b>your_brand</b> ${esc(c.draft)}</div></div></div>`;return `<div class="preview video-card"><div class="video-empty">영상 생성 대기</div><div class="video-top">${c.id==='shorts'?'▶ Shorts':c.id==='reels'?'←　 Reels':'팔로잉　 추천'}</div><div class="video-rail">♡<br>12.4K<br>◯<br>318<br>▷<br>공유</div><div class="video-copy"><b>@your_brand</b><br>${esc(c.draft)}</div></div>`}
function actions(c){let action='';if(c.status==='published')action='<button class="mini" data-open="'+c.id+'">게시물 보기</button>';else if(c.status==='failed')action='<button class="mini danger" data-retry="'+c.id+'">다시 발행</button>';else if(c.status==='unknown')action='<button class="mini" data-reconcile="'+c.id+'">결과 확인</button>';else action=`<button class="mini primary" data-publish="${c.id}" ${c.saved?'':'disabled'}>${c.status==='processing'?'<span class="spinner"></span>처리 중':'Publish'}</button>`;return `<div class="additive" data-additive="${c.id}"><div class="addrow"><span class="status ${c.status}">${{idle:c.saved?'저장됨 · 발행 준비':'초안',processing:'이 카드만 발행 중',published:'발행됨',failed:'플랫폼 거절',unknown:'발행 여부 확인 필요'}[c.status]}</span><button class="mini" data-edit="${c.id}">편집</button>${action}</div>${c.link?`<div class="permalink">${c.link}</div>`:''}</div>`}
function surface(c){return `<article class="surface" data-surface="${c.id}" data-status="${c.status}">${head(c)}${preview(c)}${actions(c)}</article>`}
function section(group,title,desc){return `<section class="section" data-section="${group}"><div class="section-head"><b>${title}</b><small>${desc}</small><span class="rule"></span></div><div class="rail">${PLATFORMS.filter(p=>p.group===group).map(p=>surface(state.cards[p.id])).join('')}</div></section>`}
function schedulePanel(){if(!state.schedule)return'';return `<div class="schedule-panel"><h3>🗓️ 예약 발행</h3>${state.scheduleError?`<div class="error-note">${state.scheduleError}</div>`:''}<div class="row"><input type="datetime-local" value="2026-08-07T10:00" data-time><button class="mini primary" data-schedule-create>예약 만들기</button></div>${state.scheduleItem?`<div class="schedule-item"><span>${state.scheduleItem}</span><button class="mini" data-schedule-change>변경</button><button class="mini" data-schedule-cancel>취소</button></div>`:''}</div>`}
function content(){if(!state.generated)return `<div class="workspace"><div class="content"><div class="empty-state">글감을 입력하고 OSMU 생성을 누르거나, 오른쪽 발행 이력에서 불러오세요.</div></div>${history()}</div>`;return `<div class="notice">이미지·영상 생성과 Higgsfield 크레딧은 운영자 전용 기능입니다.</div>${schedulePanel()}<div class="workspace"><div class="content">${section('text','✍ 텍스트','Threads · X · Facebook · 클릭해서 편집')}${section('card','▮ 카드뉴스','Instagram · 클릭해서 편집')}${section('video','▶ 영상 9:16','Shorts · Reels · TikTok · 클릭해서 편집')}</div>${history()}</div>`}
function drawer(){if(!state.drawer)return'';const c=state.cards[state.drawer];return `<div class="drawerback" data-close></div><aside class="drawer"><h2>${c.name} 편집</h2><textarea data-draft="${c.id}">${esc(c.draft)}</textarea><div class="draweractions"><button class="btn primary" data-card-save="${c.id}">이 플랫폼만 Save</button><button class="btn" data-close>닫기</button></div></aside>`}
function render(){document.body.classList.toggle('baseline',state.baseline);document.getElementById('app').innerHTML=`<div class="shell">${sidebar()}<main class="main">${toolbar()}${content()}</main></div><div class="baseline-badge">ADDITIVE v12, 점선 영역만 신규</div>${drawer()}${state.toast?`<div class="toast">${state.toast}</div>`:''}`}
