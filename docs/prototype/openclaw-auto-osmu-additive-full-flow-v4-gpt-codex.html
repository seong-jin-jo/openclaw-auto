<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OSMU additive full flow v4</title>
  <style>
    :root{--bg:#fbfbfc;--surface:#fff;--surface2:#f4f4f5;--border:#e4e4e7;--text:#18181b;--muted:#52525b;--subtle:#71717a;--accent:#2563eb;--accent-hover:#1d4ed8;--accent-soft:#eff4ff;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--shadow:0 4px 12px rgba(16,24,40,.08)}[data-theme=dark]{--bg:#0a0a0b;--surface:#161618;--surface2:#1f1f23;--border:#27272a;--text:#f4f4f5;--muted:#a1a1aa;--subtle:#a1a1aa;--accent:#3b82f6;--accent-hover:#60a5fa;--accent-soft:#172554;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--shadow:0 4px 12px rgba(0,0,0,.5)}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}button,select,input,textarea{font:inherit}button{min-height:44px;border:0;background:transparent;color:var(--text);cursor:pointer;border-radius:8px;padding:9px 12px;font-weight:600}button:hover{background:var(--surface2)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 28%,transparent);outline-offset:1px}.primary{background:var(--accent);color:#fff}.primary:hover{background:var(--accent-hover)}.secondary{border:1px solid var(--border);background:var(--surface)}.danger{color:var(--danger)}
    .tools{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px)}.tools strong{margin-right:auto}.tools label{font-size:12px;color:var(--muted)}.tools select{height:38px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);padding:0 28px 0 9px}.tools button{min-height:38px;border:1px solid var(--border);padding:6px 9px}
    .trace{display:none;position:fixed;z-index:70;right:14px;top:62px;width:min(500px,calc(100vw - 28px));max-height:calc(100vh - 80px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:18px}.trace.open{display:block}.trace h2{margin:0 0 10px;font-size:18px}.trace table{width:100%;border-collapse:collapse}.trace th,.trace td{text-align:left;border-bottom:1px solid var(--border);padding:9px;vertical-align:top}.trace th{font-size:11px;color:var(--subtle)}
    .viewport{width:min(1180px,calc(100vw - 24px));min-height:790px;margin:16px auto 50px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}.viewport.mobile{width:min(390px,calc(100vw - 16px))}.app{display:grid;grid-template-columns:224px 1fr;min-height:790px}.sidebar{background:var(--surface);border-right:1px solid color-mix(in srgb,var(--border) 50%,transparent);display:flex;flex-direction:column;min-width:0}.side-head{padding:20px 16px;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent)}.hub-brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700}.logo{width:24px;height:24px;position:relative}.logo:before,.logo:after{content:"";position:absolute;width:13px;height:13px;border-radius:4px}.logo:before{top:2px;left:2px;background:color-mix(in srgb,var(--muted) 30%,transparent)}.logo:after{right:1px;bottom:1px;background:var(--accent)}.workspace{font-size:12px;color:var(--accent);font-weight:600;margin-top:4px}.side-nav{padding:12px 0;overflow:auto;flex:1}.group{padding:13px 12px 5px;color:var(--subtle);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.nav{width:100%;min-height:38px;border-radius:0;padding:7px 16px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:500;text-align:left}.nav:hover{background:var(--surface2)}.nav.active{background:var(--accent-soft);color:var(--text);border-right:2px solid var(--accent)}.nav .ico{width:16px;text-align:center;color:var(--subtle)}.pill{margin-left:auto;padding:2px 6px;border-radius:99px;font-size:9px;background:var(--surface2);color:var(--subtle)}.pill.live{background:color-mix(in srgb,var(--success) 15%,transparent);color:var(--success)}.pill.info{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}.side-foot{padding:12px 16px;border-top:1px solid color-mix(in srgb,var(--border) 50%,transparent);display:grid;gap:4px}.side-foot button{min-height:36px;text-align:left;padding:5px 2px;font-size:12px;color:var(--subtle)}
    .main{min-width:0;background:var(--bg)}.content{padding:24px 32px;max-width:1240px}.osmu-bar{min-height:40px;display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:8px 12px;margin-bottom:18px}.osmu-bar strong{color:var(--accent)}.osmu-bar span{color:var(--muted);font-size:12px}.osmu-bar .work{margin-left:auto;color:var(--subtle)}.back{font-size:12px;color:var(--subtle);margin-bottom:8px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.page-title{display:flex;align-items:center;gap:12px}.page-icon{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}.page-title h1{font-size:20px;line-height:1.2;margin:0 0 3px;font-weight:650}.page-title p{font-size:12px;color:var(--subtle);margin:0}.status{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;border:1px solid var(--border);white-space:nowrap}.status.ok{color:var(--success)}.status.warn{color:var(--warning)}.status.bad{color:var(--danger)}.status.info{color:var(--accent)}
    .tabs{display:flex;gap:4px;margin-bottom:22px;padding-bottom:12px;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent);overflow:auto}.tabs button{min-height:38px;padding:6px 12px;color:var(--subtle);font-size:13px;white-space:nowrap}.tabs button.active{background:var(--accent);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;min-width:0}.card h2,.card h3{margin:0 0 9px;font-size:14px}.card p{margin:4px 0;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.row strong{display:block}.row small,.meta{display:block;color:var(--subtle);font-size:11px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.notice{padding:12px 14px;margin-bottom:16px;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:9px;background:var(--surface)}.notice strong{display:block;margin-bottom:2px}.notice p{margin:0;color:var(--muted)}.notice.warn{border-left-color:var(--warning);background:color-mix(in srgb,var(--warning) 7%,var(--surface))}.notice.bad{border-left-color:var(--danger);background:color-mix(in srgb,var(--danger) 6%,var(--surface))}.funnel{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 18px}.funnel span{padding:7px 9px;background:var(--surface);border:1px solid var(--border);border-radius:7px;font-size:11px}.funnel b{color:var(--subtle)}.metric{font-size:24px;font-weight:750;margin-top:3px}.editor{width:100%;min-height:128px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);padding:11px;resize:vertical}.field{width:100%;min-height:42px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);padding:9px 10px}.choice{border:1px solid var(--border);padding:12px;border-radius:9px;cursor:pointer}.choice.active{border-color:var(--accent);background:var(--accent-soft)}.loading-region{height:106px;border-radius:8px;background:linear-gradient(90deg,var(--surface2) 25%,color-mix(in srgb,var(--surface2) 60%,var(--surface)) 45%,var(--surface2) 65%);background-size:280% 100%;animation:shimmer 1.2s infinite}@keyframes shimmer{to{background-position:-120% 0}}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--border);vertical-align:top}.table th{font-size:10px;color:var(--subtle);text-transform:uppercase}.external{color:var(--accent);text-decoration:underline;text-underline-offset:3px}.chart{height:120px;display:flex;align-items:end;gap:8px;padding-top:12px}.bar{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:8px;opacity:.72}.sample{font-size:10px;color:var(--subtle);margin-top:8px}.advanced{display:none;margin-top:16px}.advanced.open{display:block}.login-shell{min-height:790px;display:grid;place-items:center;background:var(--bg);padding:24px}.login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px}.login-card .hub-brand{font-size:18px;margin-bottom:22px}.login-card h1{font-size:22px;margin:0 0 7px}.login-card p{color:var(--muted)}.login-card button{width:100%;margin-top:9px}.route{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--subtle)}
    .viewport.mobile .app{display:block}.viewport.mobile .sidebar{border-right:0;border-bottom:1px solid var(--border)}.viewport.mobile .side-head{padding:12px 14px}.viewport.mobile .side-nav{display:flex;overflow:auto;padding:7px}.viewport.mobile .group{display:none}.viewport.mobile .nav{width:auto;min-width:max-content;border-radius:7px;min-height:44px;padding:8px 11px}.viewport.mobile .nav:nth-of-type(n+8){display:none}.viewport.mobile .side-foot{display:none}.viewport.mobile .content{padding:18px 14px}.viewport.mobile .osmu-bar{display:grid;gap:2px}.viewport.mobile .osmu-bar .work{margin:0}.viewport.mobile .grid,.viewport.mobile .grid.three{grid-template-columns:1fr}.viewport.mobile .page-head{display:block}.viewport.mobile .page-head>.status{margin-top:10px}.viewport.mobile .actions{flex-direction:column}.viewport.mobile .actions button{width:100%}.viewport.mobile .table{display:block;overflow:auto}.viewport.mobile .tabs button{min-height:44px}.viewport.mobile .funnel{flex-wrap:nowrap;overflow:auto}.viewport.mobile .funnel span{white-space:nowrap}
    .tabs button{min-height:44px}
    @media(max-width:650px){.tools strong{width:100%;margin:0}.tools label{flex:1}.tools select{width:100%}}
  </style>
</head>
<body>
  <header class="tools" aria-label="프로토타입 도구"><strong>OSMU additive prototype v4</strong><label>화면<select id="viewSelect"></select></label><label>상태<select id="stateSelect"></select></label><button data-action="viewport">390 / 1024</button><button data-action="theme">Light / Dark</button><button data-action="trace">유지·추가·수정 근거</button></header>
  <aside id="trace" class="trace" aria-label="디자인 추적 패널"><h2>화면 변경 추적</h2><p class="meta">고객 화면과 분리된 디자인 검토용 패널입니다.</p><table><thead><tr><th>분류</th><th>내용</th></tr></thead><tbody id="traceBody"></tbody></table><div class="actions"><button class="secondary" data-action="trace-close">닫기</button></div></aside>
  <div id="viewport" class="viewport"><div id="root"></div></div>
  <script>
    const TABS=['Queue','Editor','Analytics','Growth','Popular','Settings'];
    const views=[['login','로그인','/login'],['workspace','작업공간','/'],['home','OSMU 성과 홈','/'],['studio','OSMU Studio','/studio'],['threads','Threads 6탭','/channels/threads'],['instagram','Instagram 6탭','/channels/instagram'],['review','발행 전 확인','/studio'],['delivery','즉시·예약','/studio'],['queue','Queue','/channels/threads'],['calendar','발행 캘린더','/calendar'],['publishing','게시·복구','/studio'],['records','발행 기록','/'],['settings','Settings','/settings'],['logout','로그아웃·재로그인','/login']];
    const states=[['default','기본'],['loading','로딩'],['empty','빈 상태'],['oauth-checking','연결 확인 중'],['oauth-failed','연결 실패'],['connected','연결됨'],['reconnect','재연결 필요'],['wrong-account','계정 불일치'],['scheduled','예약됨'],['publishing','게시 중'],['502','502 결과 확인'],['not-published','미발행 확인'],['partial','부분 성공'],['published','게시됨'],['error','오류']];
    let current='login',state='default',tab='Queue',platform='threads',media='TEXT',mobile=false;
    const route=()=>views.find(v=>v[0]===current)?.[2]||'/';
    const go=(label,id,cls='')=>`<button class="${cls}" data-go="${id}">${label}</button>`;
    const act=(label,id,cls='')=>`<button class="${cls}" data-action="${id}">${label}</button>`;
    const status=(label,kind='info')=>`<span class="status ${kind}">${label}</span>`;
    const osmu=()=>`<div class="osmu-bar"><div><strong>OSMU</strong><span> | 한 원문을 여러 플랫폼용으로 만들고 발행·예약·분석하는 전체 콘텐츠 운영</span></div><span class="work">J 투자 연구소</span></div>`;
    const head=(name,desc,letter='O',st='')=>`<div class="back">← 뒤로 · <span class="route">${route()}</span></div><div class="page-head"><div class="page-title"><span class="page-icon">${letter}</span><div><h1>${name}</h1><p>${desc}</p></div></div>${st}</div>`;
    const tabs=()=>`<div class="tabs" data-tab-list>${TABS.map(t=>`<button data-tab="${t}" class="${tab===t?'active':''}">${t}</button>`).join('')}</div>`;
    function sidebar(){return `<aside class="sidebar"><div class="side-head"><div class="hub-brand"><span class="logo"></span>Marketing Hub</div><div class="workspace">J 투자 연구소</div></div><nav class="side-nav"><div class="group">Overview</div><button class="nav ${current==='home'?'active':''}" data-go="home"><span class="ico">⌁</span>성과</button><button class="nav ${current==='studio'?'active':''}" data-go="studio"><span class="ico">✣</span>OSMU Studio<span class="pill info">NEW</span></button><button class="nav" data-go="queue"><span class="ico">▣</span>승인 인박스</button><button class="nav ${current==='calendar'?'active':''}" data-go="calendar"><span class="ico">□</span>발행 캘린더</button><div class="group">Social <span class="pill live">2/5</span></div><button class="nav ${current==='threads'?'active':''}" data-go="threads"><span class="ico">T</span>Threads<span class="pill live">Live</span></button><button class="nav" data-go="studio"><span class="ico">X</span>X (Twitter)</button><button class="nav ${current==='instagram'?'active':''}" data-go="instagram"><span class="ico">◎</span>Instagram<span class="pill info">Connected</span></button><button class="nav" data-go="settings"><span class="ico">f</span>Facebook</button><button class="nav" data-go="settings"><span class="ico">B</span>Bluesky</button><div class="group">Data & Analytics</div><button class="nav" data-go="records"><span class="ico">⌁</span>Blog Performance</button><button class="nav" data-go="records"><span class="ico">⌕</span>Search Console</button><button class="nav" data-go="records"><span class="ico">▥</span>Google Analytics</button><div class="group">Keyword Research</div><button class="nav" data-go="studio"><span class="ico">⌕</span>Keyword Planner</button><button class="nav" data-go="studio"><span class="ico">≋</span>Search Advisor</button><div class="group">Assets & Tools</div><button class="nav" data-go="studio"><span class="ico">▧</span>Images</button><button class="nav" data-go="studio"><span class="ico">▷</span>Videos</button><div class="group">System</div><button class="nav ${current==='settings'?'active':''}" data-go="settings"><span class="ico">⚙</span>Settings</button></nav><div class="side-foot"><button data-action="theme">☾ 다크 모드</button><button data-go="logout">↻ 로그아웃</button></div></aside>`}
    function statePanel(){if(state==='default'||state==='connected')return '';if(state==='loading')return `<div class="loading-region" aria-label="현재 영역 로딩"></div><div class="actions">${go('다른 작업 계속하기','home','secondary')}</div>`;const m={empty:['아직 항목이 없습니다','첫 행동을 선택하면 이 화면에서 이어집니다.','info'], 'oauth-checking':['연결 확인 중','실제 계정과 게시 가능 여부를 확인하고 있습니다.','info'],'oauth-failed':['계정을 연결하지 못했습니다','초안은 보존했습니다. 계정만 다시 확인하세요.','bad'],reconnect:['재연결 필요','저장된 계정은 있지만 지금 게시 가능한지 다시 확인해야 합니다.','warn'],'wrong-account':['계정 불일치','목표 @j.the.great.investor, 확인된 계정 @code_zero_to_one','bad'],scheduled:['예약됨','2026-08-03 20:00 KST, Queue와 캘린더에서 변경할 수 있습니다.','info'],publishing:['게시 중','검수한 버전을 한 번만 보내고 결과를 확인합니다.','info'],'502':['발행 결과 확인 중','추적 번호 OSMU-20260803-7F2A, 기존 외부 결과를 먼저 조회합니다.','warn'],'not-published':['미발행 확인됨','외부 게시물이 만들어지지 않은 것을 확인했습니다.','warn'],partial:['외부 게시물 확인됨','내부 기록을 정리하는 동안 중복 게시를 막았습니다.','warn'],published:['게시됨','대상 계정과 실제 게시물 링크를 확인했습니다.','ok'],error:['이 영역을 불러오지 못했습니다','나머지 화면과 저장된 작업은 계속 사용할 수 있습니다.','bad']};const [h,p,k]=m[state];let buttons=state==='502'?act('기존 발행 결과 확인하기','lookup','primary')+go('발행 기록 보기','records','secondary'):state==='not-published'?act('안전하게 다시 발행하기','safe-publish','primary')+go('초안으로 돌아가기','studio','secondary'):state==='partial'?act('게시물 먼저 열기','external','primary')+go('기록 상태 확인','records','secondary'):state==='published'?act('게시물 링크 열기','external','primary')+go('Analytics 보기',platform,'secondary'):state==='wrong-account'?act('계정 변경 방법 보기','account-help','primary')+go('초안으로 돌아가기','studio','secondary'):state==='reconnect'||state==='oauth-failed'?go('Settings에서 다시 연결','settings','primary')+go('초안으로 돌아가기','studio','secondary'):state==='oauth-checking'?go('채널 관리로 돌아가기',platform,'secondary'):state==='scheduled'?go('Queue에서 보기','queue','primary')+go('캘린더에서 보기','calendar','secondary'):state==='publishing'?act('게시 결과 확인하기','publish-result','primary')+go('발행 기록 보기','records','secondary'):state==='empty'?go('OSMU Studio에서 첫 원문 만들기','studio','
