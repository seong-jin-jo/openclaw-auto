    function breakerView() {
      const minute = state.breaker;
      const content = minute === "1679" ? `<section class="card warning"><div class="stat">1679</div><h2 style="margin-top:8px">안전 제한까지 1분</h2><p class="lede">현재 atomic operation만 마치고 다음 provider/API/migration batch/file mutation을 시작하지 않습니다.</p><div class="button-row"><button class="btn primary" data-action="checkpoint">체크포인트 미리 저장</button><button class="btn" data-go="migration">현재 상태 보기</button></div></section>` : minute === "1680" ? `<section class="card target"><div class="stat">1680</div><h2 style="margin-top:8px">안전 체크포인트 기록</h2><p class="lede">source, account target, reservation/result, migration stage, next action의 5필드를 기록합니다.</p><div class="progress" style="margin-top:18px"><span style="width:100%"></span></div><div class="button-row"><button class="btn primary" data-action="commit">현재 operation commit</button><button class="btn danger" data-action="rollback">현재 operation rollback</button></div></section>` : `<section class="card danger"><div class="stat">1681</div><h2 style="margin-top:8px">읽기 전용 · 다음 side effect 0</h2><p class="lede">provider/API/migration batch/file mutation을 차단했습니다.</p><div class="button-row"><button class="btn primary" data-action="checkpoint">체크포인트 내보내기</button><button class="btn" data-action="new-session">새 세션 승인 요청</button><button class="btn" data-go="migration">현재 상태 보기</button></div></section>`;
      return pageHeader("Safety control", "28시간 circuit-breaker", "1680 active minute 경계에서 현재 atomic operation을 닫고 다음 side effect를 막습니다.", `${minute}분`, minute === "1681" ? "danger" : "current") + `<div class="tabs"><button class="tab ${minute === "1679" ? "active" : ""}" data-breaker="1679">1679</button><button class="tab ${minute === "1680" ? "active" : ""}" data-breaker="1680">1680</button><button class="tab ${minute === "1681" ? "active" : ""}" data-breaker="1681">1681</button></div>${content}` + footer();
    }
    function inventoryView() {
      return pageHeader("Readiness and future boundary", "Video와 extension inventory", "video3와 extensions15는 이번 Initial bet의 상세 발행 화면이 아닙니다.", "상세 흐름 0", "future") +
      `<div class="grid two"><section class="card"><div class="card-head"><div><h2>Video 3</h2><p class="meta">processing truth와 result parity gap</p></div><span class="badge future">FUTURE BET</span></div>${video3.map((x,i)=>`<div class="row" data-video-provider><div><div class="row-title">${x}</div><div class="row-sub">${i===0?"direct upload result parity gap":"reservation/processing 경로 확인 필요"}</div></div><span class="badge current">READINESS</span></div>`).join("")}<div class="boundary"><strong>경계:</strong><span>composer와 publish CTA 없음</span></div></section>
      <section class="card"><div class="card-head"><div><h2>Extensions 15</h2><p class="meta">root runtime-global tools</p></div><span class="badge future">INVENTORY</span></div>${chipList(extensions15, "data-extension") }<div class="row"><div><div class="row-title">Disposition</div><div class="row-sub">repair, adapter, retire 미결 · queue compatible 상세는 Initial 3 우선</div></div><span class="badge current">회수 필요</span></div></section></div>
      <section class="card soft" style="margin-top:16px"><div class="card-head"><h2>기존 특화 탭 보존</h2><span class="badge success">PRESERVED</span></div><p class="meta">Threads 5/5</p>${chipList(["Queue","Analytics","Growth","Popular","Settings"], "data-threads-tab")}<p class="meta" style="margin-top:12px">Instagram 3/3</p>${chipList(["Queue","Editor","Settings"], "data-instagram-tab")}<p class="meta" style="margin-top:12px">Settings 9/9</p>${chipList(settingsTabs, "data-settings-inventory") }<div class="button-row"><button class="btn primary" data-go="studio">Initial 3으로 복귀</button><button class="btn" data-go="rtm">AC 경계 확인</button></div></section>` + footer();
    }
    function rtmView() {
      return pageHeader("Prototype QA only", "PRD AC28 추적표", "제품 메뉴가 아닌 설계 검수 허브입니다. 28개 AC를 view/state에 연결하고 orphan을 0으로 유지합니다.", "28/28", "success") +
      `<div class="grid three" style="margin-bottom:16px"><div class="card"><div class="stat">28</div><div class="stat-label">AC mapped</div></div><div class="card"><div class="stat">0</div><div class="stat-label">orphan</div></div><div class="card"><div class="stat">0</div><div class="stat-label">rejected input reused</div></div></div>
      <div class="table-wrap"><table><thead><tr><th>AC</th><th>의도</th><th>View</th><th>State</th><th>열기</th></tr></thead><tbody>${acRows.map(([n,intent,view,s])=>`<tr data-ac><td data-label="AC"><strong>AC-${String(n).padStart(2,"0")}</strong></td><td data-label="의도">${intent}</td><td data-label="View"><span class="mono">${view}</span></td><td data-label="State">${s}</td><td data-label="열기"><button class="btn" data-go="${view}">보기</button></td></tr>`).join("")}</tbody></table></div>` + footer();
    }
    function routeView() {
      return pageHeader("Existing route preserved", "기존 화면 보존", `${state.routePath}의 제품 의미를 유지합니다. OSMU v7은 이 route를 삭제, 리네임, 이동하지 않습니다.`, "PRESERVED", "success") + `<section class="card"><h2>OSMU 변경 없음</h2><p class="lede">이 프로토타입은 해당 기존 기능을 다시 설계하지 않습니다. Sidebar에서 원래 위치를 유지하고 Initial 3 흐름은 Studio, Inbox, Calendar, Settings에만 additive하게 들어갑니다.</p><div class="button-row"><button class="btn primary" data-go="truth">보존 원장으로</button><button class="btn" data-go="studio">Studio 보기</button></div></section>` + footer();
    }
    function render() {
      renderSidebar();
      const main = document.getElementById("main");
      const views = { truth:truthView, studio:studioView, inbox:inboxView, calendar:calendarView, result:resultView, settings:settingsView, migration:migrationView, breaker:breakerView, inventory:inventoryView, rtm:rtmView, route:routeView };
      main.innerHTML = (views[state.screen] || truthView)();
      main.focus({ preventScroll: true });
      document.querySelectorAll("[data-go]").forEach(el => el.classList.toggle("active", el.classList.contains("tool-button") && el.dataset.go === state.screen));
      document.title = `OSMU v7 · ${state.screen}`;
    }
    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }
    document.addEventListener("click", event => {
      const el = event.target.closest("button, a");
      if (!el) return;
      if (el.dataset.viewport) {
        document.getElementById("prototype-frame").classList.toggle("mobile", el.dataset.viewport === "390");
        document.querySelectorAll("[data-viewport]").forEach(x => x.classList.toggle("active", x === el));
        toast(`${el.dataset.viewport}px 검수 뷰`);
        return;
      }
      if (el.dataset.path) state.routePath = el.dataset.path;
      if (el.dataset.go) { state.screen = el.dataset.go; render(); return; }
      if (el.dataset.dispatch) { state.dispatch = el.dataset.dispatch; render(); return; }
      if (el.dataset.oauth) { state.oauth = el.dataset.oauth; render(); return; }
      if (el.dataset.migration) { state.migration = el.dataset.migration; render(); return; }
      if (el.dataset.breaker) { state.breaker = el.dataset.breaker; render(); return; }
      if (el.dataset.action === "dispatch") { state.dispatch = "checking"; render(); setTimeout(() => { state.dispatch = "reserved"; render(); toast("reservation 목표 상태: 1 accepted, 19 duplicate rejected"); }, 650); return; }
      const messages = {
        "permalink":"프로토타입 외부 이동은 차단했습니다. 실제 저장된 permalink만 연결합니다.",
        "copy-id":"external ID를 복사하는 상태입니다.",
        "reconcile":"외부 결과 조회를 시작하고 새 발행은 만들지 않습니다.",
        "reconnect":"새 OAuth state로 다시 연결합니다. 이전 state는 재사용하지 않습니다.",
        "choose-account":"예상 계정을 다시 선택합니다.", "new-oauth":"새 one-time 연결 요청을 시작합니다.",
        "scope":"필요 scope와 현재 grant를 비교합니다.", "probe":"실제 readiness probe 중입니다. 발행은 계속 차단됩니다.",
        "incident":"revoke 시각, 차단된 dispatch, 보존 결과를 엽니다.", "settings-tab":"기존 Settings 탭을 보존한 상태입니다.",
        "approve-current":"현재 queue 경로로 승인합니다. target source 연결로 오인하지 않습니다.", "reject":"반려 뒤 Inbox 목록으로 돌아갑니다.",
        "month-prev":"이전 달로 이동합니다.", "month-next":"다음 달로 이동합니다.", "export-diff":"mismatch diff를 읽기 전용으로 내보냅니다.",
        "checkpoint":"safe checkpoint 5필드를 내보냅니다.", "commit":"현재 atomic operation만 commit합니다.", "rollback":"현재 atomic operation을 rollback합니다.",
        "new-session":"새 세션 승인 요청을 만들고 현재 화면은 읽기 전용으로 유지합니다."
      };
      if (el.dataset.action) toast(messages[el.dataset.action] || "상태가 기록되었습니다.");
    });
    function syncPhysicalViewport() {
      const physical = window.innerWidth <= 700 ? "390" : "1024";
      document.querySelectorAll("[data-viewport]").forEach(x => x.classList.toggle("active", x.dataset.viewport === physical));
    }
    window.addEventListener("resize", syncPhysicalViewport);
    render();
    syncPhysicalViewport();
  </script>
</body>
</html>
