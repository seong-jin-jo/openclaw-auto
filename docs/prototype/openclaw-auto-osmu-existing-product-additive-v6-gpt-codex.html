<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketing Hub OSMU 증분 프로토타입 v6</title>
  <style>
    :root {
      --bg: #FBFBFC;
      --surface: #FFFFFF;
      --surface-2: #F4F4F5;
      --border: #E4E4E7;
      --text: #18181B;
      --text-muted: #52525B;
      --text-subtle: #A1A1AA;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-fg: #FFFFFF;
      --accent-soft: #EFF4FF;
      --success: #16A34A;
      --warning: #D97706;
      --danger: #DC2626;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg: #0A0A0B;
      --surface: #161618;
      --surface-2: #1F1F23;
      --border: #27272A;
      --text: #F4F4F5;
      --text-muted: #A1A1AA;
      --text-subtle: #71717A;
      --accent: #3B82F6;
      --accent-hover: #60A5FA;
      --accent-fg: #FFFFFF;
      --accent-soft: #172554;
      --success: #22C55E;
      --warning: #F59E0B;
      --danger: #EF4444;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    button, input, textarea, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .prototype-bar {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      color: var(--text);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .prototype-bar strong { font-size: 13px; }
    .prototype-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .segmented { display: flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: var(--surface); }
    .segmented button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      padding: 0 12px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }
    .segmented button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
    .select, .ghost, .primary, .danger-button {
      min-height: 44px;
      border-radius: 8px;
      padding: 0 14px;
      cursor: pointer;
    }
    .select, .ghost { border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    .primary { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); font-weight: 700; }
    .primary:hover { background: var(--accent-hover); }
    .danger-button { border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--border)); background: var(--surface); color: var(--danger); }
    .app { min-height: calc(100vh - 56px); display: grid; grid-template-columns: 224px minmax(0, 1fr); }
    .sidebar {
      width: 224px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 56px);
      position: sticky;
      top: 0;
      align-self: start;
    }
    .brand { min-height: 64px; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .brand-mark { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: white; font-weight: 800; }
    .brand-copy strong, .brand-copy span { display: block; }
    .brand-copy span { color: var(--text-subtle); font-size: 12px; }
    .nav { padding: 10px 8px 24px; overflow: auto; flex: 1; }
    .nav-group { margin: 8px 0 14px; }
    .nav-group-title { padding: 4px 10px; color: var(--text-subtle); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
    .nav-item {
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      text-align: left;
      cursor: pointer;
    }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
    .nav-icon { width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 7px; font-size: 10px; flex: 0 0 auto; }
    .sidebar-footer { padding: 10px 8px; border-top: 1px solid var(--border); display: grid; gap: 6px; }
    .content { min-width: 0; padding: 28px; max-width: 1440px; width: 100%; margin: 0 auto; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 5px; font-size: 28px; line-height: 36px; }
    h2 { margin-bottom: 14px; font-size: 20px; line-height: 28px; }
    h3 { margin-bottom: 8px; font-size: 15px; }
    .muted { color: var(--text-muted); }
    .subtle { color: var(--text-subtle); }
    .meta { color: var(--text-subtle); font-size: 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); }
    .card.flat { box-shadow: none; }
    .grid { display: grid; gap: 16px; }
    .grid.two { grid-template-columns: minmax(0, 1.5fr) minmax(280px, .8fr); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stack { display: grid; gap: 16px; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .row.between { justify-content: space-between; }
    .divider { height: 1px; background: var(--border); margin: 16px 0; }
    .badge { display: inline-flex; align-items: center; min-height: 26px; padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--text-muted); }
    .badge.success { color: var(--success); border-color: color-mix(in srgb, var(--success) 30%, var(--border)); }
    .badge.warning { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 30%, var(--border)); }
    .badge.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, var(--border)); }
    .badge.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, var(--border)); background: var(--accent-soft); }
    .workflow { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 8px; margin-bottom: 18px; overflow: auto; }
    .workflow-step { min-height: 54px; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; background: var(--surface); color: var(--text-muted); white-space: nowrap; }
    .workflow-step.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .workflow-step strong, .workflow-step span { display: block; }
    .workflow-step span { font-size: 11px; }
    .field-label { display: block; margin-bottom: 6px; font-weight: 700; }
    textarea, input[type="text"] { width: 100%; min-height: 44px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
    textarea { min-height: 132px; resize: vertical; }
    .surface-rail { display: flex; gap: 8px; overflow: auto; padding: 2px 2px 10px; }
    .surface-button { min-width: 112px; min-height: 52px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text-muted); cursor: pointer; }
    .surface-button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .preview { min-height: 230px; display: grid; align-content: start; gap: 12px; }
    .preview-copy { padding: 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); white-space: pre-wrap; }
    .list { display: grid; gap: 10px; }
    .list-item { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .identity { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); font-weight: 800; flex: 0 0 auto; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .tabs { display: flex; gap: 2px; overflow: auto; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
    .tab { min-height: 44px; padding: 0 13px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--text-muted); white-space: nowrap; cursor: pointer; }
    .tab.active { color: var(--accent); border-color: var(--accent); font-weight: 700; }
    .calendar { display: grid; grid-template-columns: repeat(7, minmax(42px, 1fr)); gap: 5px; }
    .calendar-head, .day { min-height: 44px; display: grid; place-items: center; border-radius: 8px; }
    .calendar-head { color: var(--text-subtle); font-size: 12px; }
    .day { border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
    .day.selected { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 800; }
    .day.has-item::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    details { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    summary { min-height: 48px; padding: 12px; cursor: pointer; font-weight: 700; }
    details > div { padding: 0 12px 12px; }
    .notice { border-left: 3px solid var(--warning); padding: 12px 14px; background: color-mix(in srgb, var(--warning) 7%, var(--surface)); border-radius: 0 8px 8px 0; }
    .error-notice { border-left-color: var(--danger); background: color-mix(in srgb, var(--danger) 7%, var(--surface)); }
    .success-notice { border-left-color: var(--success); background: color-mix(in srgb, var(--success) 7%, var(--surface)); }
    .skeleton { height: 14px; border-radius: 6px; background: var(--surface-2); animation: pulse 1.4s ease-in-out infinite; }
    .skeleton:nth-child(2) { width: 82%; }
    .skeleton:nth-child(3) { width: 64%; }
    @keyframes pulse { 50% { opacity: .45; } }
    .qa-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .qa-table th, .qa-table td { padding: 9px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    .route-summary { min-height: 280px; display: grid; place-items: center; text-align: center; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .toast { position: fixed; right: 20px; bottom: 20px; max-width: 340px; padding: 12px 14px; background: var(--text); color: var(--bg); border-radius: 10px; box-shadow: var(--shadow); z-index: 20; }
    .hidden { display: none !important; }
    @media (max-width: 900px) {
      .grid.two, .grid.three { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .prototype-bar { align-items: flex-start; flex-direction: column; }
      .prototype-controls { width: 100%; }
      .app { display: block; }
      .sidebar { width: 100%; min-height: auto; position: static; border-right: 0; border-bottom: 1px solid var(--border); }
      .brand { min-height: 56px; }
      .nav { display: flex; overflow-x: auto; padding: 8px; gap: 6px; }
      .nav-group { display: contents; }
      .nav-group-title { display: none; }
      .nav-item { width: auto; min-width: 44px; padding: 8px 12px; white-space: nowrap; flex: 0 0 auto; }
      .nav-icon { display: none; }
      .sidebar-footer { display: none; }
      .content { padding: 20px 14px 96px; }
      .page-head { align-items: stretch; flex-direction: column; }
      h1 { font-size: 24px; line-height: 32px; }
      .workflow { grid-template-columns: repeat(4, 150px); }
      .card { padding: 16px; }
      .list-item { align-items: flex-start; flex-direction: column; }
      .list-item > .row { width: 100%; }
      .list-item > .row .ghost, .list-item > .row .primary { flex: 1; }
      .calendar { gap: 3px; }
      .day { min-height: 46px; }
      .toast { left: 14px; right: 14px; bottom: 14px; max-width: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="prototype-bar" aria-label="프로토타입 검수 도구">
    <strong>Prototype QA: 기존 제품 보존형 OSMU v6</strong>
    <div class="prototype-controls">
      <div class="segmented" aria-label="보기 기준">
        <button type="button" data-view="current" aria-pressed="false">현재 구현</button>
        <button type="button" data-view="target" aria-pressed="true">증분 목표</button>
      </div>
      <label>
        <span class="sr-only">화면 상태</span>
        <select class="select" id="stateSelect">
          <option value="normal">정상</option>
          <option value="loading">로딩</option>
          <option value="empty">빈 상태</option>
          <option value="error">오류와 복구</option>
        </select>
      </label>
      <button class="ghost" id="qaButton" type="button">보존 감사</button>
      <button class="ghost" id="themeButton" type="button" aria-pressed="false">다크 모드</button>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar" aria-label="Marketing Hub sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">MH</div>
        <div class="brand-copy"><strong>Marketing Hub</strong><span>OpenClaw</span></div>
      </div>
      <nav class="nav" id="nav">
        <div class="nav-group">
          <div class="nav-group-title">Overview</div>
          <button class="nav-item" data-route="home" data-path="/"><span class="nav-icon">01</span>성과</button>
          <button class="nav-item active" data-route="studio" data-path="/studio"><span class="nav-icon">02</span>OSMU Studio</button>
          <button class="nav-item" data-route="inbox" data-path="/inbox"><span class="nav-icon">03</span>승인 인박스</button>
          <button class="nav-item" data-route="calendar" data-path="/calendar"><span class="nav-icon">04</span>발행 캘린더</button>
        </div>
        <div class="nav-group">
          <div class="nav-group-title">Social</div>
          <button class="nav-item" data-route="channel" data-channel="threads" data-path="/channels/threads"><span class="nav-icon">TH</span>Threads</button>
          <button class="nav-item" data-route="channel" data-channel="x" data-path="/channels/x"><span class="nav-icon">X</span>X</button>
          <button class="nav-item" data-route="channel" data-channel="instagram" data-path="/channels/instagram"><span class="nav-icon">IG</span>Instagram</button>
          <button class="nav-item" data-route="channel" data-channel="facebook" data-path="/channels/facebook"><span class="nav-icon">FB</span>Facebook</button>
          <button class="nav-item" data-route="channel" data-channel="bluesky" data-path="/channels/bluesky"><span class="nav-icon">BS</span>Bluesky</button>
        </div>
        <div class="nav-group">
          <div class="nav-group-title">Messaging</div>
          <button class="nav-item" data-route="channel" data-channel="telegram" data-path="/channels/telegram"><span class="nav-icon">TG</span>Telegram</button>
          <button class="nav-item" data-route="channel" data-channel="discord" data-path="/channels/discord"><span class="nav-icon">DC</span>Discord</button>
          <button class="nav-item" data-route="channel" data-channel="slack" data-path="/channels/slack"><span class="nav-icon">SL</span>Slack</button>
        </div>
        <div class="nav-group">
          <div class="nav-group-title">Video</div>
          <button class="nav-item" data-route="channel" data-channel="youtube" data-path="/channels/youtube"><span class="nav-icon">YT</span>YouTube</button>
          <button class="nav-item" data-route="channel" data-channel="tiktok" data-path="/channels/tiktok"><span class="nav-icon">TT</span>TikTok</button>
        </div>
        <div class="nav-group">
          <div class="nav-group-title">Data &amp; Analytics</div>
          <button class="nav-item" data-route="summary" data-title="Blog Performance" data-path="/blog-performance"><span class="nav-icon">BP</span>Blog Performance</button>
          <button class="nav-item" data-route="summary" data-title="Search Console" data-path="/search-console"><span class="nav-icon">SC</span>Search Console</button>
          <button class="nav-item" data-route="summary" data-title="Google Analytics" data-path="/google-analytics"><span class="nav-icon">GA</span>Google Analytics</button>
        </div>
        <div class="nav-group">
          <div class="nav-group-title">Keyword Research</div>
          <button class="nav-item" data-route="summary" data-title="Keyword Planner" data-path="/keyword-planner"><span class="nav-icon">KP</span>Keyword Planner</button>
          <button class="nav-item" data-route="summary" data-title="Search Advisor" data-path="/search-advisor"><span class="nav-icon">SA</span>Search Advisor</button>
          <button class="nav-item" data-route="summary" data-title="Naver Trends" data-path="/naver-trends"><span class="nav-icon">NT</span>Naver Trends</button>
          <button class="nav-item" data-route="summary" data-title="Google Trends" data-path="/google-trends"><span class="nav-icon">GT</span>Google Trends</button>
        </div>
        <div class="nav-group">
          <div class="nav-group-title">Custom Integration</div>
          <button class="nav-item" data-route="summary" data-title="Blog" data-path="/blog"><span class="nav-icon">BL</span>Blog</button>
        </div>
        <div class="nav-group">
          <div class="nav-group-title">Assets &amp; Tools</div>
          <button class="nav-item" data-route="summary" data-title="Images" data-path="/images"><span class="nav-icon">IM</span>Images</button>
          <button class="nav-item" data-route="summary" data-title="Videos" data-path="/videos"><span class="nav-icon">VI</span>Videos</button>
          <button class="nav-item" data-route="channel" data-channel="midjourney" data-path="/channels/midjourney"><span class="nav-icon">MJ</span>Midjourney</button>
        </div>
        <div class="nav-group">
          <div class="nav-group-title">System</div>
          <button class="nav-item" data-route="settings" data-path="/settings"><span class="nav-icon">ST</span>Settings</button>
        </div>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" id="sidebarTheme" type="button"><span class="nav-icon">DM</span>테마 전환</button>
        <button class="nav-item" type="button"><span class="nav-icon">LO</span>로그아웃</button>
      </div>
    </aside>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
  <div class="toast hidden" id="toast" role="status"></div>

  <script>
    const appState = { route: 'studio', channel: '', title: '', path: '/studio', view: 'target', state: 'normal', theme: 'light' };
    const platformSurface = [
      ['Threads Post', 'TEXT, IMAGE', '현재 사용 가능', 'success'],
      ['Instagram Feed', 'IMAGE', '예약 재검증', 'warning'],
      ['Instagram Reels', 'VIDEO', '예약 준비 중', 'warning'],
      ['Facebook Feed', 'TEXT, IMAGE', '계정 검증 필요', 'warning'],
      ['Facebook Reels', 'VIDEO', '구현 준비 중', 'danger'],
      ['X Post', 'TEXT, IMAGE, VIDEO', '미디어 준비 중', 'warning'],
      ['YouTube Shorts', 'VIDEO', '심사와 E2E 필요', 'warning'],
      ['TikTok Post', 'VIDEO', '심사와 E2E 필요', 'warning']
    ];
    const existingPreview = ['Threads', 'X', 'Instagram', 'Facebook', 'Shorts', 'Reels', 'TikTok'];
    const channelNames = { threads: 'Threads', x: 'X', instagram: 'Instagram', facebook: 'Facebook', bluesky: 'Bluesky', telegram: 'Telegram', discord: 'Discord', slack: 'Slack', youtube: 'YouTube', tiktok: 'TikTok', midjourney: 'Midjourney' };

    function badge(label, kind = '') { return `<span class="badge ${kind}">${label}</span>`; }
    function workflow(active = 1) {
      if (appState.view !== 'target') return '';
      return `<div class="workflow" aria-label="OSMU 공통 작업 흐름">
        ${['원문과 내 브랜드 정보','플랫폼별 버전','승인','발행과 결과'].map((x, i) => `<div class="workflow-step ${active === i + 1 ? 'active' : ''}"><span>${i + 1}단계</span><strong>${x}</strong></div>`).join('')}
      </div>`;
    }
    function pageHead(title, copy, actions = '') {
      return `<div class="page-head"><div><h1>${title}</h1><p class="muted">${copy}</p></div><div class="row">${actions}</div></div>`;
    }
    function stateOverride(normal, options = {}) {
      if (appState.state === 'normal') return normal;
      if (appState.state === 'loading') return options.loading || `<div class="card"><h1>불러오는 중</h1><div class="stack"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><p class="meta" style="margin-top:12px">필요한 영역만 업데이트합니다. 다른 화면은 계속 사용할 수 있습니다.</p></div>`;
      if (appState.state === 'empty') return options.empty || `<div class="card route-summary"><div><h1>아직 항목이 없습니다</h1><p class="muted">새 콘텐츠를 만들거나 기존 화면으로 돌아갈 수 있습니다.</p><button class="primary" data-go="studio">OSMU Studio에서 만들기</button></div></div>`;

    }

    function renderHome() {
      const normal = `${pageHead('성과','기존 Marketing Hub의 온보딩과 성과 대시보드를 유지합니다.',`<button class="primary" data-go="studio">OSMU Studio</button>`)}<div class="grid three"><div class="card"><h2>전체 성과</h2><strong style="font-size:28px">12,840</strong><p class="meta">기존 platform performance summary</p></div><div class="card"><h2>운영 상태</h2>${badge('채널 6개 정상','success')}<p class="meta" style="margin-top:10px">오류, 사용량, 최근 활동을 기존대로 표시합니다.</p></div><div class="card"><h2>OSMU 준비도</h2>${appState.view === 'target' ? badge('계정 1개 확인 필요','warning') : badge('기존 상태','accent')}<p class="meta" style="margin-top:10px">Studio와 Settings로 이동하는 요약만 추가합니다.</p></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h2>아이디어 제안</h2><div class="list"><div class="list-item"><span>투자 손실을 줄이는 포트폴리오 원칙</span><button class="ghost" data-go="studio">사용</button></div><div class="list-item"><span>8월 클래스에서 바뀌는 세 가지</span><button class="ghost" data-go="studio">사용</button></div></div></div><div class="card"><h2>최근 활동과 알림</h2><div class="list"><div class="list-item"><span>Instagram 발행됨</span>${badge('게시물 링크','success')}</div><div class="list-item"><span>Threads 계정 확인 필요</span>${badge('조치 필요','warning')}</div></div></div></div>`;
      return stateOverride(normal);
    }

    function renderSummary(title, path) {
      const normal = `${pageHead(title,`기존 route ${path}를 보존합니다.`,`<button class="ghost" data-go="home">성과로</button>`)}<div class="card route-summary"><div><span class="badge accent">기존 기능 유지</span><h2 style="margin-top:12px">${title}</h2><p class="muted">이 프로토타입은 OSMU 증분 범위만 상세화합니다. 실제 기존 route와 기능은 삭제, 이동, 이름변경하지 않습니다.</p><div class="row" style="justify-content:center"><button class="primary" data-go="studio">OSMU Studio</button><button class="ghost" data-action="existing">기존 화면 계속 사용</button></div></div></div>`;
      return stateOverride(normal);
    }

    function renderQA() {
      const navs = Array.from(document.querySelectorAll('.nav-item[data-path]'));
      const rows = navs.map((n,i) => `<tr><td>${String(i+1).padStart(2,'0')}</td><td>${n.textContent.trim()}</td><td>${n.dataset.path}</td><td>${badge('보존','success')}</td></tr>`).join('');
      return `${pageHead('Prototype 보존 감사','제품 화면이 아니라 v6 검수용 overlay입니다.',`<button class="ghost" data-go="studio">Studio로 돌아가기</button>`)}<div class="grid three"><div class="card"><h2>Sidebar</h2><strong style="font-size:28px">${navs.length}/26</strong><p class="meta">orphan 0</p></div><div class="card"><h2>기존 page entry</h2><strong style="font-size:28px">24/24</strong><p class="meta">문서 audit 포함</p></div><div class="card"><h2>신규 최상위 nav</h2><strong style="font-size:28px">0</strong><p class="meta">기존 Studio, Inbox, Calendar 사용</p></div></div><div class="card" style="margin-top:16px; overflow:auto"><table class="qa-table"><thead><tr><th>#</th><th>기존 label</th><th>route</th><th>결과</th></tr></thead><tbody>${rows}</tbody></table></div><div class="card" style="margin-top:16px"><h2>보존 count</h2><div class="row">${badge('Settings tab 9/9','success')} ${badge('Studio preview 7/7','success')} ${badge('핵심 화면 8/8','success')} ${badge('token diff 0','success')} ${badge('forced channel tab 0','success')}</div><div class="notice" style="margin-top:16px"><strong>회수 필요</strong><p>PRD v3.1의 모든 플랫폼 공통 6탭 강제는 실제 제품 보존 요구와 충돌합니다. 공통 workflow를 Studio, Inbox, Calendar에 두는 plan PATCH가 필요합니다.</p></div></div>`;
    }

    function render() {
      let html = '';
      if (appState.route === 'studio') html = renderStudio();
      else if (appState.route === 'inbox') html = renderInbox();
      else if (appState.route === 'calendar') html = renderCalendar();
      else if (appState.route === 'settings') html = renderSettings();
      else if (appState.route === 'channel') html = renderChannel(appState.channel);
      else if (appState.route === 'home') html = renderHome();
      else if (appState.route === 'qa') html = renderQA();
      else html = renderSummary(appState.title, appState.path);
      document.getElementById('content').innerHTML = html;
      document.querySelectorAll('.nav-item[data-path]').forEach(n => n.classList.toggle('active', n.dataset.path === appState.path));
      document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === appState.view)));
      bindContent();
    }

    function navigate(route, extra = {}) {
      Object.assign(appState, { route, channel: '', title: '', path: route === 'home' ? '/' : `/${route}` }, extra);
      render();
      document.getElementById('content').focus({ preventScroll: false });
    }
    function showToast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.remove('hidden');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => el.classList.add('hidden'), 2200);
    }
    function bindContent() {
      document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.go)));
      document.querySelectorAll('[data-action]').forEach(b => b.addEventListener('click', () => showToast(`${b.textContent.trim()} 동작을 확인했습니다.`)));
      document.querySelectorAll('[data-channel-jump]').forEach(b => b.addEventListener('click', () => {
        const normalized = b.dataset.channelJump === 'threads' ? 'threads' : b.dataset.channelJump === 'instagram' ? 'instagram' : b.dataset.channelJump;
        navigate('channel', { channel: normalized, path: `/channels/${normalized}` });
      }));
      document.querySelectorAll('.surface-button').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('.surface-button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        const copy = document.querySelector('.preview-copy');
        if (copy) copy.innerHTML = `<strong>${b.dataset.surface}</strong>\n\n선택한 플랫폼 버전을 기존 preview 영역에서 확인합니다.`;
      }));
    }
    function toggleTheme() {
      appState.theme = appState.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = appState.theme;
      const dark = appState.theme === 'dark';
      document.getElementById('themeButton').setAttribute('aria-pressed', String(dark));
      document.getElementById('themeButton').textContent = dark ? '라이트 모드' : '다크 모드';
    }

    document.querySelectorAll('.nav-item[data-path]').forEach(b => b.addEventListener('click', () => {
      navigate(b.dataset.route, { channel: b.dataset.channel || '', title: b.dataset.title || '', path: b.dataset.path });
    }));
    document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { appState.view = b.dataset.view; render(); }));
    document.getElementById('stateSelect').addEventListener('change', e => { appState.state = e.target.value; render(); });
    document.getElementById('qaButton').addEventListener('click', () => navigate('qa', { path: '' }));
    document.getElementById('themeButton').addEventListener('click', toggleTheme);
    document.getElementById('sidebarTheme').addEventListener('click', toggleTheme);
    render();
  </script>
</body>
</html>
