# 멀티 테넌트 동시 운영 (브랜드/도메인은 fork-local — 슬러그는 예시)
# 기본 인스턴스는 docker-compose.yml.example 그대로 (port 18789/34560 유지)
# 본 파일은 신규 인스턴스를 정의. 같은 image 공유 (build 1회).
#
# 포트 매핑 (예시):
#   tenant2  gateway 18790 / dashboard 34561
#   tenant3  gateway 18792 / dashboard 34563
#   tenant4  gateway 18793 / dashboard 34564
#
# 가동 전 1회 작업:
#   ./bootstrap-postagi-4tenants.sh  (data/config 디렉토리 생성 + templates 복사)
#
# 가동:
#   docker-compose -f docker-compose.postagi-4tenants.yml up -d

x-gateway-base: &gateway-base
  build:
    context: ./openclaw
    dockerfile: Dockerfile
    network: host
    args:
      OPENCLAW_EXTENSIONS: "threads-publish threads-queue threads-style threads-insights threads-search threads-growth x-publish image-upload instagram-publish card-generator midjourney-image video-generate"
      OPENCLAW_INSTALL_BROWSER: "1"
  image: openclaw-auto/gateway:postagi
  network_mode: host
  init: true
  restart: unless-stopped

x-dashboard-base: &dashboard-base
  build:
    context: ./dashboard
    network: host
  image: openclaw-auto/dashboard:postagi
  network_mode: host
  restart: unless-stopped

services:
  # ─────────────── Tenant ───────────────
  openclaw-gateway-tenant2:
    <<: *gateway-base
    container_name: openclaw-gateway-tenant2
    volumes:
      - ./config-tenant2:/home/node/.openclaw
      - ./data-tenant2:/home/node/data
    env_file: .env.tenant2
    environment:
      HOME: /home/node
      TZ: Asia/Seoul
    command: ["node", "dist/index.js", "gateway", "--bind", "loopback", "--port", "18790", "--allow-unconfigured"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-dashboard-tenant2:
    <<: *dashboard-base
    container_name: openclaw-dashboard-tenant2
    volumes:
      - ./data-tenant2:/app/data
      - ./config-tenant2:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env.tenant2
    environment:
      DATA_DIR: /app/data
      CONFIG_DIR: /app/config
      PORT: "34561"
      HOSTNAME: "0.0.0.0"
      GATEWAY_CONTAINER: openclaw-gateway-tenant2
      GATEWAY_PORT: "18790"
    depends_on:
      - openclaw-gateway-tenant2

  # ─────────────── Tenant ───────────────
  openclaw-gateway-tenant3:
    <<: *gateway-base
    container_name: openclaw-gateway-tenant3
    volumes:
      - ./config-tenant3:/home/node/.openclaw
      - ./data-tenant3:/home/node/data
    env_file: .env.tenant3
    environment:
      HOME: /home/node
      TZ: Asia/Seoul
    command: ["node", "dist/index.js", "gateway", "--bind", "loopback", "--port", "18792", "--allow-unconfigured"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18792/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-dashboard-tenant3:
    <<: *dashboard-base
    container_name: openclaw-dashboard-tenant3
    volumes:
      - ./data-tenant3:/app/data
      - ./config-tenant3:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env.tenant3
    environment:
      DATA_DIR: /app/data
      CONFIG_DIR: /app/config
      PORT: "34563"
      HOSTNAME: "0.0.0.0"
      GATEWAY_CONTAINER: openclaw-gateway-tenant3
      GATEWAY_PORT: "18792"
    depends_on:
      - openclaw-gateway-tenant3

  # ─────────────── tenant (tenant4) ───────────────
  openclaw-gateway-tenant4:
    <<: *gateway-base
    container_name: openclaw-gateway-tenant4
    volumes:
      - ./config-tenant4:/home/node/.openclaw
      - ./data-tenant4:/home/node/data
    env_file: .env.tenant4
    environment:
      HOME: /home/node
      TZ: Asia/Seoul
    command: ["node", "dist/index.js", "gateway", "--bind", "loopback", "--port", "18793", "--allow-unconfigured"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18793/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-dashboard-tenant4:
    <<: *dashboard-base
    container_name: openclaw-dashboard-tenant4
    volumes:
      - ./data-tenant4:/app/data
      - ./config-tenant4:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env.tenant4
    environment:
      DATA_DIR: /app/data
      CONFIG_DIR: /app/config
      PORT: "34564"
      HOSTNAME: "0.0.0.0"
      GATEWAY_CONTAINER: openclaw-gateway-tenant4
      GATEWAY_PORT: "18793"
    depends_on:
      - openclaw-gateway-tenant4

  # ─────────────── tenant1 (auto-added 2026-06-08) ───────────────
  openclaw-gateway-tenant1:
    <<: *gateway-base
    container_name: openclaw-gateway-tenant1
    volumes:
      - ./config-tenant1:/home/node/.openclaw
      - ./data-tenant1:/home/node/data
    env_file: .env.tenant1
    environment:
      HOME: /home/node
      TZ: Asia/Seoul
    command: ["node", "dist/index.js", "gateway", "--bind", "loopback", "--port", "18789"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-dashboard-tenant1:
    <<: *dashboard-base
    container_name: openclaw-dashboard-tenant1
    volumes:
      - ./data-tenant1:/app/data
      - ./config-tenant1:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env.tenant1
    environment:
      DATA_DIR: /app/data
      CONFIG_DIR: /app/config
      PORT: "34560"
      HOSTNAME: "0.0.0.0"
      GATEWAY_CONTAINER: openclaw-gateway-tenant1
      GATEWAY_PORT: "18789"
    depends_on:
      - openclaw-gateway-tenant1

  # ─────────────── OSMU SaaS 대시보드(멀티테넌트, 고객 로그인) ───────────────
  # 공개 URL: openclaw.example.com → localhost:18789(VM)
  # per-service(tenant1/tenant5/..)와 별개. 고객은 /login으로 자기 테넌트 격리. 게이트웨이는 고객별 동적 프로비저닝.
  # ⚠️ .env.osmu 필수(DASHBOARD_AUTH_TOKEN=운영자잠금 + NEXT_PUBLIC_SUPABASE_* + DATABASE_URL + OSMU_SECRET_KEY).
  # ⚠️ 18789는 tenant1 게이트웨이와 같은 포트 → 둘 중 하나만(SaaS 모델이 per-service 대체).
  # autoheal 워치독 — healthcheck가 unhealthy로 표시한 컨테이너를 자동 재시작(L4 재발방지).
  # restart:unless-stopped는 프로세스 종료만 재시작 → 100% CPU hang엔 무력(2026-06-28 장애).
  # AUTOHEAL_CONTAINER_LABEL로 라벨 단 컨테이너만 감시.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: openclaw-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "15"
      AUTOHEAL_START_PERIOD: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  openclaw-dashboard-osmu:
    <<: *dashboard-base
    container_name: openclaw-dashboard-osmu
    labels:
      autoheal: "true"   # autoheal 워치독이 unhealthy 시 자동 재시작
    volumes:
      - ./data-osmu:/app/data
      - ./config-osmu:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      # claude CLI 폴백 인증(테넌트 Anthropic 키 미등록 시 `claude -p`). 호스트가 사전 인증된 ~/.claude 필요.
      # 테넌트가 자기 API 키 등록 시 이 경로 불필요(HTTP API로 감). 인증 없으면 폴백만 502(고객 키 경로는 정상).
      - ${HOME}/.claude:/root/.claude:ro
    env_file: .env.osmu
    environment:
      DATA_DIR: /app/data
      CONFIG_DIR: /app/config
      DASHBOARD_PORT: "18789"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    # 헬스체크(L4 재발방지) — hang/DB불가 감지. unhealthy 자동재시작은 autoheal 워치독이 수행
    # (restart:unless-stopped는 프로세스 *종료*만 재시작 → 100% CPU hang엔 무력했음. 2026-06-28 장애).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18789/api/health"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
