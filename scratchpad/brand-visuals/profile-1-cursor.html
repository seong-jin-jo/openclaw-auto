<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>profile-1-cursor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --base:#0B0F1A; --surface:#151B2B; --amber:#F59E0B; --mint:#34D399;
    --text:#F8FAFC; --text-sub:#94A3B8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:800px; height:800px; overflow:hidden; }
  body{
    background:
      radial-gradient(circle at 50% 38%, var(--surface) 0%, var(--base) 72%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 40px);
    position:relative;
    font-family:'Pretendard', sans-serif;
  }
  .stage{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .mono-wrap{
    display:flex; align-items:center; gap:14px;
    transform:translateY(-18px);
  }
  .monogram{
    font-weight:800; font-size:236px; line-height:1; letter-spacing:-10px;
    color:var(--text);
    text-shadow: 0 8px 40px rgba(0,0,0,0.45);
  }
  .cursor{
    width:56px; height:190px; border-radius:3px;
    background:linear-gradient(180deg, #FCD34D 0%, var(--amber) 55%, #B45309 100%);
    box-shadow: 0 0 70px 14px rgba(245,158,11,0.45), 0 0 0 1px rgba(255,255,255,0.08) inset;
    transform:translateY(6px);
  }
  .tag{
    position:absolute; bottom:190px; left:0; right:0;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:22px; font-weight:500; letter-spacing:6px;
    color:var(--text-sub); text-transform:uppercase;
    opacity:0.75;
  }
  .tag .dot{ color:var(--amber); }
  .crop-guide{
    position:absolute; inset:2px;
    border-radius:50%;
    border:2px dashed rgba(248,250,252,0.28);
    pointer-events:none;
  }
  .crop-guide::after{
    content:"원형 크롭 프리뷰 — 코너 4곳은 잘려나감";
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    font-family:'JetBrains Mono', monospace; font-size:14px; color:rgba(248,250,252,0.4);
    white-space:nowrap; letter-spacing:0.5px;
  }
  .corner-mask{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 50%, transparent 70.5%, rgba(0,0,0,0.55) 71%);
    pointer-events:none;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="mono-wrap">
      <div class="monogram">SJ</div>
      <div class="cursor"></div>
    </div>
  </div>
  <div class="tag">BUILD<span class="dot">·</span>LOG</div>
  <div class="corner-mask"></div>
  <div class="crop-guide"></div>
</body>
</html>
