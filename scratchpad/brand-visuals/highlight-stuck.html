<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>highlight-stuck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --base:#0B0F1A; --surface:#151B2B; --amber:#F59E0B; --mint:#34D399;
    --text:#F8FAFC; --text-sub:#94A3B8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:400px; height:400px; overflow:hidden; }
  body{
    position:relative; font-family:'Pretendard', sans-serif;
    background: radial-gradient(circle at 50% 40%, var(--surface) 0%, var(--base) 75%);
  }
  .stage{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  .icon-wrap{ position:relative; width:112px; height:112px; display:flex; align-items:center; justify-content:center; }
  .block{
    width:96px; height:96px; border-radius:16px;
    background:rgba(52,211,153,0.10);
    border:3px solid var(--mint);
    box-shadow:0 0 40px 4px rgba(52,211,153,0.22);
  }
  .crack{
    position:absolute; width:6px; height:118px; background:var(--mint); border-radius:3px;
    transform:rotate(18deg);
    box-shadow:0 0 20px 3px rgba(52,211,153,0.5);
  }
  .label{ font-weight:700; font-size:30px; color:var(--text); letter-spacing:-0.5px; }
  .crop-guide{ position:absolute; inset:2px; border-radius:50%; border:2px dashed rgba(248,250,252,0.28); pointer-events:none; }
  .corner-mask{ position:absolute; inset:0; background:radial-gradient(circle at 50% 50%, transparent 70.5%, rgba(0,0,0,0.55) 71%); pointer-events:none; }
</style>
</head>
<body>
  <div class="stage">
    <div class="icon-wrap"><div class="block"></div><div class="crack"></div></div>
    <div class="label">막힘해부</div>
  </div>
  <div class="corner-mask"></div>
  <div class="crop-guide"></div>
</body>
</html>
