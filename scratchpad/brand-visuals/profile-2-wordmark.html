<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>profile-2-wordmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --base:#0B0F1A; --surface:#151B2B; --amber:#F59E0B; --mint:#34D399;
    --text:#F8FAFC; --text-sub:#94A3B8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:800px; height:800px; overflow:hidden; }
  body{
    background:
      radial-gradient(circle at 50% 42%, var(--surface) 0%, var(--base) 72%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 40px);
    position:relative;
    font-family:'Pretendard', sans-serif;
  }
  .stage{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
  }
  .path{
    font-family:'JetBrains Mono', monospace;
    font-size:20px; font-weight:500; letter-spacing:1px;
    color:var(--text-sub); opacity:0.65;
  }
  .path b{ color:var(--amber); font-weight:500; }
  .prompt-line{ display:flex; align-items:flex-end; gap:20px; }
  .chevron{
    font-family:'JetBrains Mono', monospace;
    font-weight:800; font-size:220px; line-height:1;
    color:var(--amber);
    text-shadow: 0 0 60px rgba(245,158,11,0.5);
  }
  .word{
    font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:200px; line-height:1; letter-spacing:-4px;
    color:var(--text);
  }
  .cursor-bar{
    width:74px; height:22px; border-radius:2px;
    background:var(--amber);
    box-shadow: 0 0 40px 6px rgba(245,158,11,0.4);
    align-self:flex-end;
    transform:translateY(-14px);
  }
  .underline{
    width:420px; height:3px;
    background:linear-gradient(90deg, var(--amber), transparent);
    border-radius:2px;
    opacity:0.8;
  }
  .crop-guide{
    position:absolute; inset:2px;
    border-radius:50%;
    border:2px dashed rgba(248,250,252,0.28);
    pointer-events:none;
  }
  .corner-mask{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 50%, transparent 70.5%, rgba(0,0,0,0.55) 71%);
    pointer-events:none;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="path">sj<b>@</b>buildlog:~$</div>
    <div class="prompt-line">
      <span class="chevron">&gt;</span>
      <span class="word">sj</span>
      <span class="cursor-bar"></span>
    </div>
    <div class="underline"></div>
  </div>
  <div class="corner-mask"></div>
  <div class="crop-guide"></div>
</body>
</html>
