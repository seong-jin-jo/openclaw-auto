<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>banner-youtube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --base:#0B0F1A; --surface:#151B2B; --amber:#F59E0B; --mint:#34D399;
    --text:#F8FAFC; --text-sub:#94A3B8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:2560px; height:1440px; overflow:hidden; }
  body{
    position:relative;
    font-family:'Pretendard', sans-serif;
    background:#0B0F1A;
  }
  .photo{
    position:absolute; inset:0;
    background-image:url('bg-banner.png');
    background-size:cover;
    background-position:58% 50%;
    filter:saturate(0.95) brightness(0.82);
  }
  .scrim{
    position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(11,15,26,0.92) 0%, rgba(11,15,26,0.78) 38%, rgba(11,15,26,0.28) 62%, rgba(11,15,26,0.42) 100%),
      radial-gradient(1200px 900px at 85% 30%, rgba(245,158,11,0.10) 0%, transparent 60%);
  }
  .grid{
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 48px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 48px);
    mix-blend-mode:overlay;
  }

  /* ---- content block (positioned to sit inside YouTube safe zone 1546x423, centered) ---- */
  .content{
    position:absolute;
    left:507px; top:508px; width:1546px; height:423px;
    display:flex; align-items:center;
  }
  .textcol{
    width:60%;
    display:flex; flex-direction:column; justify-content:center; gap:22px;
  }
  .kicker{
    display:flex; align-items:center; gap:10px;
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:26px;
    letter-spacing:2px; color:var(--amber);
  }
  .kicker .sep{ color:var(--text-sub); font-weight:400; }
  .kicker .name{ color:var(--text); }
  .tagline{
    font-weight:800; font-size:76px; line-height:1.18; letter-spacing:-2px;
    color:var(--text);
    text-shadow:0 4px 24px rgba(0,0,0,0.55);
  }
  .schedule{
    display:flex; align-items:center; gap:14px;
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:32px;
    color:var(--mint); letter-spacing:0.5px;
  }
  .schedule .bar{ width:10px; height:10px; border-radius:2px; background:var(--mint); box-shadow:0 0 16px 2px rgba(52,211,153,0.6); }

  /* ---- floating terminal/dashboard mockup ---- */
  .mockup-wrap{
    position:absolute; right:-40px; top:280px;
    transform: rotate(-15deg);
  }
  .card{
    width:820px; height:560px;
    background:linear-gradient(180deg, #1A2236 0%, var(--surface) 100%);
    border-radius:18px;
    border:1px solid rgba(255,255,255,0.09);
    box-shadow: 0 60px 120px -20px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.03) inset;
    overflow:hidden;
  }
  .chrome{
    height:52px; background:rgba(0,0,0,0.32);
    display:flex; align-items:center; padding:0 24px; gap:10px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .dot{ width:13px; height:13px; border-radius:50%; }
  .dot.r{ background:#EF4444; } .dot.y{ background:#F59E0B; } .dot.g{ background:#34D399; }
  .chrome .fname{
    margin-left:16px; font-family:'JetBrains Mono', monospace; font-size:18px; color:var(--text-sub);
  }
  .chrome .time{
    margin-left:auto; font-family:'JetBrains Mono', monospace; font-size:16px; color:var(--text-sub); opacity:0.6;
  }
  .code{ padding:28px 32px 10px; font-family:'JetBrains Mono', monospace; font-size:21px; line-height:1.75; }
  .code .l{ white-space:pre; }
  .k{ color:var(--mint); } .s{ color:var(--text-sub); } .v{ color:var(--text); } .n{ color:var(--amber); font-weight:700; }
  .stats{
    display:flex; gap:0; margin:18px 32px 0; padding-top:20px; border-top:1px solid rgba(255,255,255,0.07);
  }
  .stat{ flex:1; }
  .stat .label{ font-family:'JetBrains Mono', monospace; font-size:15px; color:var(--text-sub); letter-spacing:1px; text-transform:uppercase; }
  .stat .num{ font-family:'JetBrains Mono', monospace; font-size:38px; font-weight:700; color:var(--amber); margin-top:6px; }
  .stat .num.mint{ color:var(--mint); }
  .stat .bar-track{ width:88%; height:6px; border-radius:4px; background:rgba(255,255,255,0.09); margin-top:12px; overflow:hidden; }
  .stat .bar-fill{ height:100%; border-radius:4px; }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="scrim"></div>
  <div class="grid"></div>

  <div class="mockup-wrap">
    <div class="card">
      <div class="chrome">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="fname">buildlog.ts</span>
        <span class="time">02:14 AM</span>
      </div>
      <div class="code">
        <div class="l"><span class="s">$</span> <span class="v">osmu publish</span> <span class="k">--channel</span> <span class="s">threads</span></div>
        <div class="l"><span class="k">✓</span> <span class="v">draft generated</span> <span class="s">(12.4s)</span></div>
        <div class="l"><span class="k">✓</span> <span class="v">approved by</span> <span class="v">SJ</span></div>
        <div class="l"><span class="s">→</span> <span class="v">publishing...</span> <span class="k">done</span></div>
        <div class="l"><span class="v">followers</span><span class="s">:</span> <span class="n">+38</span> <span class="s">today</span></div>
        <div class="l"><span class="v">uptime</span><span class="s">:</span> <span class="n">41</span> <span class="s">days</span></div>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="label">발행 / 주</div>
          <div class="num">21</div>
          <div class="bar-track"><div class="bar-fill" style="width:72%;background:var(--amber);"></div></div>
        </div>
        <div class="stat">
          <div class="label">자동화 비율</div>
          <div class="num mint">54<span style="font-size:22px;">%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:54%;background:var(--mint);"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="textcol">
      <div class="kicker"><span>&gt;</span><span class="name">SJ</span><span class="sep">_BUILDLOG</span></div>
      <div class="tagline">혼자 만들고,<br>전부 공개함</div>
      <div class="schedule"><span class="bar"></span>매주 목요일</div>
    </div>
  </div>
</body>
</html>
