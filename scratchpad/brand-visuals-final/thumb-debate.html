<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>thumb-debate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --base:#0B0F1A; --surface:#151B2B; --amber:#F59E0B; --mint:#34D399;
    --text:#F8FAFC; --text-sub:#94A3B8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1280px; height:720px; overflow:hidden; }
  body{
    position:relative; font-family:'Pretendard', sans-serif;
    background:#0B0F1A;
  }
  .photo{
    position:absolute; inset:0;
    background-image:url('bg-thumb.png');
    background-size:cover; background-position:center;
    filter:brightness(0.72) saturate(0.85) grayscale(0.15);
  }
  .scrim{
    position:absolute; inset:0;
    background:
      linear-gradient(100deg, rgba(11,15,26,0.9) 0%, rgba(11,15,26,0.6) 46%, rgba(11,15,26,0.28) 70%),
      radial-gradient(900px 700px at 88% 50%, rgba(248,250,252,0.07) 0%, transparent 60%);
  }
  .topbar{ position:absolute; top:0; left:0; right:0; height:16px; background:var(--text); z-index:2; }
  .series-tag{
    position:absolute; top:38px; left:64px; z-index:2;
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:22px;
    letter-spacing:4px; color:var(--text); text-transform:uppercase;
  }
  .hook{
    position:absolute; left:64px; top:150px; width:620px; z-index:2;
    font-weight:800; font-size:84px; line-height:1.2; letter-spacing:-2px; color:var(--text);
    text-shadow:0 4px 22px rgba(0,0,0,0.65);
  }
  .badge{
    position:absolute; left:64px; bottom:48px; z-index:2;
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16);
    border-radius:10px; padding:10px 20px; backdrop-filter:blur(4px);
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:26px;
  }
  .badge .chev{ color:var(--amber); }
  .badge .name{ color:var(--text); }

  /* VS split panel, right side */
  .split{
    position:absolute; right:80px; top:106px; width:460px; height:508px; z-index:2;
    display:flex; flex-direction:column; border-radius:16px; overflow:hidden;
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 50px 100px -20px rgba(0,0,0,0.7);
  }
  .pane{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    position:relative;
  }
  .pane.top{ background:rgba(21,27,43,0.65); }
  .pane.bottom{ background:rgba(21,27,43,0.85); }
  .pane .kicker{ font-family:'JetBrains Mono', monospace; font-size:16px; letter-spacing:2px; color:var(--text-sub); text-transform:uppercase; }
  .pane .stance{ font-weight:800; font-size:44px; color:var(--text); text-align:center; line-height:1.25; }
  .pane.top .stance{ color:var(--text-sub); }
  .vs-badge{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:88px; height:88px; border-radius:50%;
    background:var(--base); border:3px solid var(--text);
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-weight:800; font-size:28px; color:var(--text);
    box-shadow:0 0 40px 6px rgba(248,250,252,0.2);
    z-index:2;
  }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="scrim"></div>
  <div class="topbar"></div>
  <div class="series-tag">경계 논쟁</div>
  <div class="hook">결과물로<br>비교함</div>
  <div class="badge"><span class="chev">&gt;</span><span class="name">sj</span></div>

  <div class="split">
    <div class="pane top">
      <div class="kicker">주장 A</div>
      <div class="stance">국비 6개월<br>수료</div>
    </div>
    <div class="pane bottom">
      <div class="kicker">주장 B</div>
      <div class="stance">바이브코딩<br>6주</div>
    </div>
    <div class="vs-badge">VS</div>
  </div>
</body>
</html>
