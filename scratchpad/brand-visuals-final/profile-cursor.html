<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>profile-cursor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --base:#0B0F1A; --surface:#151B2B; --amber:#F59E0B; --mint:#34D399;
    --text:#F8FAFC; --text-sub:#94A3B8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1000px; height:1000px; overflow:hidden; }
  body{
    position:relative;
    font-family:'Pretendard', sans-serif;
    background:#0B0F1A;
  }
  .photo{
    position:absolute; inset:0;
    background-image:url('bg-avatar.png');
    background-size:cover;
    background-position:center 42%;
    filter:saturate(0.9) brightness(0.72);
  }
  .vignette{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 46%, rgba(11,15,26,0.25) 0%, rgba(11,15,26,0.72) 62%, rgba(11,15,26,0.94) 100%);
  }
  .stage{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .mono-wrap{
    display:flex; align-items:center; gap:16px;
    transform:translateY(-14px);
  }
  .monogram{
    font-weight:800; font-size:270px; line-height:1; letter-spacing:-12px;
    color:var(--text);
    text-shadow: 0 10px 50px rgba(0,0,0,0.65), 0 2px 0 rgba(0,0,0,0.35);
  }
  .cursor{
    width:64px; height:216px; border-radius:4px;
    background:linear-gradient(180deg, #FCD34D 0%, var(--amber) 55%, #B45309 100%);
    box-shadow: 0 0 90px 18px rgba(245,158,11,0.55), 0 0 0 1px rgba(255,255,255,0.1) inset;
    transform:translateY(8px);
  }
  .tag{
    position:absolute; bottom:212px; left:0; right:0;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:24px; font-weight:700; letter-spacing:7px;
    color:var(--text-sub); text-transform:uppercase;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  }
  .tag .dot{ color:var(--amber); }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="vignette"></div>
  <div class="stage">
    <div class="mono-wrap">
      <div class="monogram">SJ</div>
      <div class="cursor"></div>
    </div>
  </div>
  <div class="tag">BUILD<span class="dot">·</span>LOG</div>
</body>
</html>
