<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>card-cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --base:#0B0F1A; --surface:#151B2B; --amber:#F59E0B; --mint:#34D399;
    --text:#F8FAFC; --text-sub:#94A3B8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1080px; height:1350px; overflow:hidden; }
  body{
    position:relative; font-family:'Pretendard', sans-serif;
    background:#0B0F1A;
  }
  .photo{
    position:absolute; inset:0;
    background-image:url('bg-card.png');
    background-size:cover; background-position:center;
    filter:brightness(0.76) saturate(1.05);
  }
  .scrim{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(11,15,26,0.55) 0%, rgba(11,15,26,0.42) 40%, rgba(11,15,26,0.86) 100%),
      radial-gradient(700px 700px at 50% 18%, rgba(245,158,11,0.10) 0%, transparent 60%);
  }
  .topbar{ position:absolute; top:0; left:0; right:0; height:18px; background:var(--amber); z-index:2; }
  .series-tag{
    position:absolute; top:56px; left:72px; z-index:2;
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:24px;
    letter-spacing:5px; color:var(--amber); text-transform:uppercase;
  }
  .hook{
    position:absolute; left:72px; right:72px; bottom:200px; z-index:2;
    font-weight:800; font-size:88px; line-height:1.18; letter-spacing:-2px; color:var(--text);
    text-shadow:0 6px 28px rgba(0,0,0,0.65);
  }
  .hook .num{ font-family:'JetBrains Mono', monospace; color:var(--amber); font-weight:800; }
  .sub{
    position:absolute; left:72px; right:72px; bottom:132px; z-index:2;
    font-family:'JetBrains Mono', monospace; font-size:24px; color:var(--text-sub); letter-spacing:0.5px;
  }
  .badge{
    position:absolute; left:72px; bottom:56px; z-index:2;
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16);
    border-radius:10px; padding:12px 22px; backdrop-filter:blur(4px);
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:28px;
  }
  .badge .chev{ color:var(--amber); }
  .badge .name{ color:var(--text); }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="scrim"></div>
  <div class="topbar"></div>
  <div class="series-tag">빌드로그</div>
  <div class="hook">이번 주<br>실패 <span class="num">1</span>건,<br>배운 것 <span class="num">1</span>개</div>
  <div class="sub">→ 다음 슬라이드에서 원인 해부</div>
  <div class="badge"><span class="chev">&gt;</span><span class="name">sj</span></div>
</body>
</html>
