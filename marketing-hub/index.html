<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>postAGI Marketing Hub</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', -apple-system, sans-serif; background: #0d0d0d; color: #e6e6e6; }
  .hub { display: grid; grid-template-columns: 220px 1fr; height: 100vh; }
  aside { background: #1a1a1a; border-right: 1px solid #2a2a2a; padding: 20px 0; overflow-y: auto; }
  aside h1 { font-size: 13px; color: #888; padding: 0 20px 16px; letter-spacing: 1px; text-transform: uppercase; }
  .tabs { list-style: none; }
  .tab {
    padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 10px;
    border-left: 3px solid transparent; transition: all .15s;
  }
  .tab:hover { background: #252525; }
  .tab.active { background: #2a2a2a; border-left-color: #E8A5B8; color: #fff; }
  .tab .emoji { font-size: 18px; min-width: 24px; text-align: center; }
  .tab .meta { flex: 1; }
  .tab .name { font-size: 13px; font-weight: 500; }
  .tab .status { font-size: 10px; color: #666; margin-top: 2px; letter-spacing: 0.5px; }
  .status.active { color: #5b8266; }
  .status.pending { color: #d4a373; }
  .status.waiting-meta-review, .status.waiting-legal-opinion { color: #8B8378; }
  .add-btn {
    margin: 16px 20px 8px; padding: 10px; background: transparent; border: 1px dashed #444;
    color: #888; cursor: pointer; width: calc(100% - 40px); border-radius: 4px; font-size: 12px;
  }
  .add-btn:hover { border-color: #E8A5B8; color: #E8A5B8; }
  main { position: relative; }
  iframe { width: 100%; height: 100%; border: none; background: #fff; }
  .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #555; flex-direction: column; gap: 12px; }
  .empty h2 { font-size: 18px; color: #888; }
  .empty p { font-size: 13px; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal-bg.show { display: flex; }
  .modal { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 28px; width: 480px; max-width: 90vw; }
  .modal h2 { font-size: 16px; margin-bottom: 18px; color: #E8A5B8; }
  .modal label { display: block; font-size: 11px; color: #888; margin: 12px 0 4px; letter-spacing: 0.5px; }
  .modal input, .modal select { width: 100%; padding: 8px 10px; background: #0d0d0d; border: 1px solid #333; color: #e6e6e6; border-radius: 3px; font-size: 13px; }
  .modal input:focus, .modal select:focus { outline: none; border-color: #E8A5B8; }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
  .modal-actions button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .btn-cancel { background: transparent; color: #888; }
  .btn-submit { background: #E8A5B8; color: #1a1a1a; font-weight: 600; }
  .cmd-output { margin-top: 16px; padding: 12px; background: #0d0d0d; border: 1px solid #333; border-radius: 4px; font-family: monospace; font-size: 12px; color: #5b8266; white-space: pre-wrap; word-break: break-all; display: none; }
  .cmd-output.show { display: block; }
  .copy-btn { margin-top: 8px; font-size: 11px; color: #888; cursor: pointer; }
</style>
</head>
<body>
<div class="hub">
  <aside>
    <h1>postAGI Marketing</h1>
    <ul class="tabs" id="tabs"></ul>
    <button class="add-btn" onclick="openAddModal()">+ 새 서비스 추가</button>
  </aside>
  <main id="main">
    <div class="empty">
      <h2>서비스를 선택하세요</h2>
      <p>좌측 사이드바에서 서비스 탭 클릭</p>
    </div>
  </main>
</div>

<!-- 서비스 추가 모달 -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>새 서비스 추가</h2>
    <form id="addForm" onsubmit="submitAddForm(event)">
      <label>slug (영문 소문자, 예: tenant2, dc)</label>
      <input type="text" name="slug" required pattern="[a-z0-9]+" placeholder="예: novaapp">

      <label>표시명 (한글 OK)</label>
      <input type="text" name="name" required placeholder="예: Nova App">

      <label>이모지/한자 (1자)</label>
      <input type="text" name="emoji" required maxlength="2" placeholder="예: 🌟">

      <label>주 채널</label>
      <select name="channel" required>
        <option value="instagram">Instagram</option>
        <option value="x">X (Twitter)</option>
        <option value="threads">Threads</option>
      </select>

      <label>본계정 도메인 (Cloudflare 라우트 prefix)</label>
      <input type="text" name="domain" required placeholder="예: marketing-nova.example.com">

      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeAddModal()">취소</button>
        <button type="submit" class="btn-submit">생성 명령 발행</button>
      </div>
    </form>
    <div class="cmd-output" id="cmdOutput"></div>
  </div>
</div>

<script>
let tenants = [];
let activeSlug = null;

async function loadTenants() {
  const res = await fetch('tenants.json');
  const data = await res.json();
  tenants = data.tenants;
  renderTabs();
}

function renderTabs() {
  const ul = document.getElementById('tabs');
  ul.innerHTML = tenants.map(t => `
    <li class="tab ${t.slug === activeSlug ? 'active' : ''}" onclick="selectTab('${t.slug}')">
      <span class="emoji">${t.emoji}</span>
      <span class="meta">
        <div class="name">${t.name}</div>
        <div class="status ${t.status}">${formatStatus(t.status)}</div>
      </span>
    </li>
  `).join('');
}

function formatStatus(s) {
  return {
    'active': 'LIVE',
    'pending': '대기',
    'waiting-meta-review': 'Meta 검수',
    'waiting-legal-opinion': 'Legal 자문'
  }[s] || s;
}

function selectTab(slug) {
  activeSlug = slug;
  const t = tenants.find(x => x.slug === slug);
  if (!t) return;
  document.getElementById('main').innerHTML =
    `<iframe src="${t.publicUrl}" title="${t.name}"></iframe>`;
  renderTabs();
}

function openAddModal() {
  document.getElementById('modalBg').classList.add('show');
  document.getElementById('cmdOutput').classList.remove('show');
  document.getElementById('addForm').reset();
}

function closeAddModal() {
  document.getElementById('modalBg').classList.remove('show');
}

function submitAddForm(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const slug = fd.get('slug');
  const name = fd.get('name');
  const emoji = fd.get('emoji');
  const channel = fd.get('channel');
  const domain = fd.get('domain');

  // 새 tenant 객체
  const maxPort = Math.max(...tenants.map(t => t.dashboardPort));
  const newTenant = {
    slug, name, emoji,
    dashboardPort: maxPort + 1,
    gatewayPort: maxPort + 1 - 34560 + 18789,
    publicUrl: 'https://' + domain,
    channels: [channel],
    status: 'pending'
  };

  // 명령 출력 (사용자가 터미널에 복붙)
  const cmd = `# 1) tenants.json 갱신 (수동 또는 아래 명령)
echo '${JSON.stringify(newTenant)}' | tee -a /tmp/new-tenant.json

# 2) 신규 인스턴스 생성 (docker-compose append + bootstrap)
cd ~/sj_code_master/postAGI/openclaw-auto
bash add-tenant.sh ${slug} ${newTenant.dashboardPort} ${newTenant.gatewayPort} ${channel}

# 3) Cloudflare Tunnel 라우트 추가 (cloudflared config)
#    hostname: ${domain}
#    service: http://localhost:${newTenant.dashboardPort}

# 4) 가동
docker-compose -f docker-compose.postagi-4tenants.yml up -d --build`;

  const out = document.getElementById('cmdOutput');
  out.textContent = cmd;
  out.classList.add('show');

  // 클립보드 복사 시도
  navigator.clipboard.writeText(cmd).then(() => {
    out.innerHTML = cmd + '\n\n<span class="copy-btn">✓ 클립보드 복사됨</span>';
  }).catch(() => {});
}

loadTenants();
</script>
</body>
</html>
